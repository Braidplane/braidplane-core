services:
  spire-registration-test:
    image: ghcr.io/spiffe/spire-server:1.15.2@sha256:410c624a2f2311c23ecc96c24abd854213333f57ccf4fd1c8d3e30b3dbf007bb
    command: ["-config", "/server.conf"]
    volumes:
      - ./docker/spire-test.conf:/server.conf:ro
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "entry", "show", "-socketPath", "/tmp/api.sock", "-output", "json"]

  postgres-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-postgres-connector-test
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    ports:
      - "${POSTGRES_CONNECTOR_PORT:-35433}:5432"
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=braidplane
    volumes:
      - ./docker/test-data/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d braidplane"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mysql-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-mysql-connector-test
    image: mysql:26.7@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
    ports:
      - "${MYSQL_CONNECTOR_PORT:-33307}:3306"
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=braidplane
      - MYSQL_USER=braidplane
      - MYSQL_PASSWORD=braidplanepass
    volumes:
      - ./docker/test-data/mysql:/docker-entrypoint-initdb.d
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpass"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  http-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-http-connector-test
    build:
      context: ./docker/test-data/http-crud
    ports:
      - "${HTTP_CONNECTOR_PORT:-38080}:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  openapi-server:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-openapi-server
    image: nginx:1.31-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    ports:
      - "${OPENAPI_SERVER_PORT:-38081}:80"
    restart: always
    volumes:
      - ./api-schema:/usr/share/nginx/html:ro
      - ./docker/nginx/openapi-server.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://127.0.0.1/schema.yml || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  hubspot-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-hubspot-connector-test
    build:
      context: ./docker/test-data/hubspot-mock
    ports:
      - "${HUBSPOT_MOCK_PORT:-38082}:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  bigquery-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-bigquery-connector-test
    build:
      context: ./docker/test-data/bigquery-mock
    ports:
      - "${BIGQUERY_MOCK_PORT:-38084}:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  s3-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-s3-connector-test
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: mini -dir=/data -s3.port=9000 -ip=s3-connector-test -admin.ui=false -webdav=false
    ports:
      - "${S3_CONNECTOR_PORT:-39000}:9000"
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID=braidplane
      - AWS_SECRET_ACCESS_KEY=braidplanepass
      - S3_BUCKET=braidplane-fixtures
    volumes:
      - s3-seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  s3-connector-test-setup:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-s3-connector-test-setup
    image: amazon/aws-cli:2.31.18@sha256:1a491b258590cc66866cd550f592edff80082f44daf1d903820daeca2f4954de
    depends_on:
      s3-connector-test:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=braidplane
      - AWS_SECRET_ACCESS_KEY=braidplanepass
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://s3-connector-test:9000
      - AWS_PAGER=
      - S3_FIXTURE_SOURCE=/seed/fixtures/customers.csv
      - S3_FIXTURE_KEY=fixtures/customers.csv
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        sh /fixture/seed.sh
        tail -f /dev/null
    restart: always
    volumes:
      - ./docker/test-data/s3/seed.sh:/fixture/seed.sh:ro
      - ./docker/test-data/s3:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "sh /fixture/seed.sh check"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  git-provider-mock:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-git-provider-mock
    build:
      context: ./docker/test-data/git-provider-mock
    ports:
      - "${GIT_PROVIDER_MOCK_PORT:-38083}:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mongo-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-mongo-connector-test
    image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    ports:
      - "${MONGO_CONNECTOR_PORT:-37017}:27017"
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpass
      - MONGO_INITDB_DATABASE=braidplane
    volumes:
      - ./docker/test-data/mongo:/docker-entrypoint-initdb.d
      - type: tmpfs
        target: /data/db
      - type: tmpfs
        target: /data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username root --password rootpass --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ftp-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-ftp-connector-test
    build:
      context: ./docker/test-data/ftp
    ports:
      - "${FTP_CONNECTOR_PORT:-32121}:21"
      - "${FTP_PASV_MIN:-32100}-${FTP_PASV_MAX:-32100}:${FTP_PASV_MIN:-32100}-${FTP_PASV_MAX:-32100}"
    restart: always
    environment:
      - FTP_USER=braidplane
      - FTP_PASS=braidplanepass
      - FTP_PUBLIC_HOST=127.0.0.1
      - FTP_ROOT=/srv/ftp
      - FTP_PASV_MIN=${FTP_PASV_MIN:-32100}
      - FTP_PASV_MAX=${FTP_PASV_MAX:-32100}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"127.0.0.1\", 21), 2); s.close()'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  git-connector-test:
    container_name: ${COMPOSE_PROJECT_NAME:-braidplane}-git-connector-test
    build:
      context: ./docker
      dockerfile: Dockerfile.soft-serve
    ports:
      - "${GIT_SSH_PORT:-32223}:23231"
      - "${GIT_HTTP_PORT:-32080}:23232"
    restart: always
    environment:
      - SOFT_SERVE_INITIAL_ADMIN_KEYS=${GIT_TEST_SSH_PUBLIC_KEY}
      - SOFT_SERVE_DATA_PATH=/soft-serve
      # Acquire the SQLite writer lock before metadata reads to avoid lock-upgrade races.
      - "SOFT_SERVE_DB_DATA_SOURCE=soft-serve.db?_pragma=busy_timeout(5000)&_pragma=foreign_keys(1)&_txlock=immediate"
    volumes:
      - git-soft-serve-data:/soft-serve
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "23231"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  git-soft-serve-data:
  s3-seaweedfs-data:

server {
    bind_address = "127.0.0.1"
    bind_port = "8081"
    trust_domain = "issuer.test"
    data_dir = "/tmp/data"
    socket_path = "/tmp/api.sock"
    log_level = "ERROR"
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/tmp/data/datastore.sqlite3"
        }
    }
    KeyManager "disk" { plugin_data { keys_path = "/tmp/data/keys.json" } }
    NodeAttestor "join_token" { plugin_data {} }
}

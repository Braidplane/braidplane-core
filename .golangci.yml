          deny:
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: shared internal packages must not depend on SSR frontend packages
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: shared internal packages must not depend on HTTP transport handlers

            - "${base-path}/pkg/deploymentplan/*.go"
            - "${base-path}/pkg/depsports/**/*.go"
            - "${base-path}/pkg/depsports/*.go"
            - "${base-path}/pkg/eventtest/**/*.go"
            - "${base-path}/pkg/eventtest/*.go"
            - "${base-path}/pkg/executiondelivery/**/*.go"
            - "${base-path}/pkg/executiondelivery/*.go"

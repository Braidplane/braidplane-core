            - "${base-path}/pkg/gitlab/*.go"
            - "${base-path}/pkg/gitprovider/**/*.go"
            - "${base-path}/pkg/gitprovider/*.go"
            - "${base-path}/pkg/googleclient/**/*.go"
            - "${base-path}/pkg/googleclient/*.go"
            - "${base-path}/pkg/googleoauth/**/*.go"
            - "${base-path}/pkg/googleoauth/*.go"
            - "${base-path}/pkg/googleworkspace/**/*.go"
            - "${base-path}/pkg/googleworkspace/*.go"
            - "${base-path}/pkg/hostguard/**/*.go"
            - "${base-path}/pkg/hostguard/*.go"
            - "${base-path}/pkg/httpoauth/**/*.go"
            - "${base-path}/pkg/httpoauth/*.go"

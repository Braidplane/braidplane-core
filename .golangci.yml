            - "${base-path}/pkg/jsonvalue/*.go"
            - "${base-path}/pkg/lifecycle/**/*.go"
            - "${base-path}/pkg/lifecycle/*.go"
            - "${base-path}/pkg/locale/**/*.go"
            - "${base-path}/pkg/locale/*.go"
            - "${base-path}/pkg/logging/**/*.go"
            - "${base-path}/pkg/logging/*.go"
            - "${base-path}/pkg/metrics/**/*.go"
            - "${base-path}/pkg/metrics/*.go"
            - "${base-path}/pkg/domain/model/**/*.go"
            - "${base-path}/pkg/domain/model/*.go"
            - "${base-path}/pkg/oauthflow/**/*.go"
            - "${base-path}/pkg/oauthflow/*.go"
            - "${base-path}/pkg/odcs/**/*.go"
            - "${base-path}/pkg/odcs/*.go"
            - "${base-path}/pkg/pipeline/**/*.go"
            - "${base-path}/pkg/pipeline/*.go"
            - "${base-path}/pkg/proofevidence/**/*.go"
            - "${base-path}/pkg/proofevidence/*.go"
            - "${base-path}/pkg/proofidentity/**/*.go"
            - "${base-path}/pkg/proofidentity/*.go"
            - "${base-path}/pkg/ptr/**/*.go"
            - "${base-path}/pkg/ptr/*.go"
            - "${base-path}/pkg/publicschema/**/*.go"
            - "${base-path}/pkg/publicschema/*.go"
            - "${base-path}/pkg/queue/**/*.go"
            - "${base-path}/pkg/queue/*.go"
            - "${base-path}/pkg/repostore/**/*.go"
            - "${base-path}/pkg/repostore/*.go"
            - "${base-path}/pkg/reqctx/**/*.go"
            - "${base-path}/pkg/reqctx/*.go"
            - "${base-path}/pkg/resourcescope/**/*.go"
            - "${base-path}/pkg/resourcescope/*.go"
            - "${base-path}/pkg/sinkbinding/**/*.go"
            - "${base-path}/pkg/sinkbinding/*.go"
            - "${base-path}/pkg/slack/**/*.go"
            - "${base-path}/pkg/slack/*.go"
            - "${base-path}/pkg/snowflakewif/**/*.go"
            - "${base-path}/pkg/snowflakewif/*.go"
            - "${base-path}/pkg/spireregistration/**/*.go"
            - "${base-path}/pkg/spireregistration/*.go"
            - "${base-path}/pkg/testutil/**/*.go"
            - "${base-path}/pkg/testutil/*.go"
            - "${base-path}/pkg/tracing/**/*.go"
            - "${base-path}/pkg/tracing/*.go"
            - "${base-path}/pkg/uuid/**/*.go"
            - "${base-path}/pkg/uuid/*.go"
            - "${base-path}/pkg/validate/**/*.go"
            - "${base-path}/pkg/validate/*.go"
            - "!${base-path}/*_test.go"
            - "!${base-path}/**/*_test.go"
            - "!${base-path}/pkg/fake/**"
            - "!${base-path}/pkg/testutil/**"
            - "!${base-path}/pkg/eventtest/**"
            - "!${base-path}/pkg/queue/**"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: internal packages must not own persistence
            - pkg: github.com/Braidplane/braidplane-core/service
              desc: internal packages must not orchestrate business services
        queue_persistence_boundary:
          list-mode: lax
          files:
            - "${base-path}/pkg/queue/*.go"
            - "${base-path}/pkg/queue/**/*.go"
            - "!${base-path}/pkg/queue/*_test.go"
            - "!${base-path}/pkg/queue/**/*_test.go"
          allow:
            - github.com/Braidplane/braidplane-core/postgres$
            - github.com/Braidplane/braidplane-core/postgres/executionrequests$
          deny:
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: queue uses only its transaction and execution-request ports
            - pkg: github.com/Braidplane/braidplane-core/service
              desc: queue must not depend on business consumers
        test_composition_visibility:
          files:
            - "$all"
            - "!**/*_test.go"
            - "!${base-path}/pkg/fake/**"
            - "!${base-path}/pkg/testutil/**"
            - "!${base-path}/pkg/eventtest/**"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/pkg/eventtest
              desc: event-test composition is not a production dependency
        proof_configuration_boundary:
          list-mode: strict
          files:
            - "${base-path}/service/proofconfigsvc/*.go"
            - "!${base-path}/service/proofconfigsvc/*_test.go"
          allow:
            - $gostd
            - github.com/Braidplane/braidplane-core/postgres$
            - github.com/Braidplane/braidplane-core/postgres/proofconfig$
            - github.com/Braidplane/braidplane-core/pkg/domain/model$
            - github.com/Braidplane/braidplane-core/service/datasourcessvc$
            - github.com/Braidplane/braidplane-core/service/eventrecorder$
            - github.com/Braidplane/braidplane-core/service/worker/producer$
            - github.com/Braidplane/braidplane-core/pkg/slug$
            - github.com/Braidplane/braidplane-core/pkg/xerror$
        proof_evidence_boundary:
          list-mode: strict
          files:
            - "${base-path}/pkg/proofevidence/*.go"
            - "${base-path}/pkg/proofevidence/**/*.go"
            - "!${base-path}/pkg/proofevidence/*_test.go"
            - "!${base-path}/pkg/proofevidence/**/*_test.go"
          allow:
            - $gostd
            - github.com/Braidplane/braidplane-core/pkg/hostguard$
            - github.com/Braidplane/braidplane-core/pkg/domain/model$
            - github.com/Braidplane/braidplane-core/pkg/slug$
            - github.com/Braidplane/braidplane-core/pkg/xerror$
        pipeline_internal_boundary:
          list-mode: lax
          files:
            - "${base-path}/pkg/pipeline/*.go"
            - "${base-path}/pkg/pipeline/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen
              desc: internal pipeline packages must not depend on generated API DTOs or transport contracts
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: internal pipeline packages must not depend on SSR frontend packages
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: internal pipeline packages must not depend on persistence repositories
            - pkg: github.com/Braidplane/braidplane-core/service
              desc: internal pipeline packages must not depend on service-layer orchestration or connector packages
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: internal pipeline packages must not depend on HTTP transport handlers
        no_stdlib_errors:
          deny:
            - pkg: errors
              desc: use internal/xerror helpers instead of the standard errors package
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: '^errors\.New$'
          msg: "use xerror constructors (internal/xerror) instead of errors.New"
        - pattern: '^fmt\.Errorf$'
          msg: "use xerror constructors or xerror.Wrapf instead of fmt.Errorf"
        - pattern: '^errors\.As$'
          msg: "use xerror.As (internal/xerror) instead of errors.As"
      analyze-types: true
    govet:
      enable:
        - nilness
    wrapcheck:
      # Braidplane uses package-local xerror sentinels at service/repository/transport
      # boundaries. Internal package pass-throughs keep those sentinels intact,
      # while third-party and stdlib dependency errors remain subject to wrapping.
      ignore-package-globs:
        - github.com/Braidplane/braidplane-core/*
        - github.com/Braidplane/braidplane-core/cli/apiclient
        - github.com/Braidplane/braidplane-core/cli/cmd/braidplane
        # Canonical shared packages moved to the standalone CLI module.
        - github.com/Braidplane/braidplane-core/pkg/xerror
        - github.com/Braidplane/braidplane-core/pkg/kongcmd
        - github.com/Braidplane/braidplane-core/pkg/slug
        - github.com/Braidplane/braidplane-core/pkg/model
        - github.com/Braidplane/braidplane-core/pkg/must
        - github.com/Braidplane/braidplane-core/pkg/redaction
        - github.com/Braidplane/braidplane-core/pkg/nativetype
        - github.com/Braidplane/braidplane-core/pkg/payload/file
        - github.com/Braidplane/braidplane-core/pkg/payload/form
        - github.com/Braidplane/braidplane-core/pkg/connector/catalog
        - github.com/Braidplane/braidplane-core/pkg/pipeline/spec
        - github.com/Braidplane/braidplane-core/pkg/pipeline/diff
        - github.com/Braidplane/braidplane-core/pkg/pipeline/runtime
        - github.com/Braidplane/braidplane-core/pkg/pipeline/graph
        - github.com/Braidplane/braidplane-core/pkg/pipeline/payload
        - github.com/Braidplane/braidplane-core/pkg/pipeline/transform/sql
        - github.com/Braidplane/braidplane-core/pkg/pipeline/validate
        - github.com/Braidplane/braidplane-core/pkg/structvalidate
      ignore-sig-regexps:
        # Fiber handlers return framework response errors directly to Fiber.
        - 'func \(github\.com/gofiber/fiber/v3\.Ctx\)\.(JSON|SendString|SendStatus|Send|Next)\('
        - 'func \(\*github\.com/gofiber/fiber/v3\.Redirect\)\.To\('
        # Middleware/decorator pass-through methods must preserve interface contracts.
        - 'func \(net/http\.RoundTripper\)\.RoundTrip\('
        - 'func \(log/slog\.Handler\)\.Handle\('
        - 'func \(io\.Closer\)\.Close\('
        - 'func \(github\.com/a-h/templ\.Component\)\.Render\('
        - 'func \(context\.Context\)\.Err\('
        # Codec hook methods keep serialization package errors intact.
        - 'func encoding/json\.(Marshal|Unmarshal)\('
        - 'func \(\*encoding/json\.Decoder\)\.Decode\('
        - 'func \(\*gopkg\.in/yaml\.v3\.(Decoder|Node)\)\.Decode\('

  exclusions:
    generated: lax
    presets:
      - comments
    rules:
      - path: ^api-schema/gen/.+\.go$
        linters:
          - forbidigo
      - path: ^pkg/xerror/.+\.go$
        linters:
          - depguard
          - forbidigo
      - path: .+_test\.go
        linters:
          - forbidigo
          - wrapcheck
      # Test fixtures intentionally use sample secrets, local subprocesses,
      # temporary file paths, and executable helper scripts.
      - path: .+_test\.go
        text: "G101:|G204:|G304:|G306:"
        linters:
          - gosec
      # Local developer fixture data uses fake credentials and local git helpers.
      - path: ^pkg/fake/seeder\.go$
        text: "G101:|G204:"
        linters:
          - gosec
      # Repository storage is a git CLI adapter; command execution and worktree
      # file reads are the package boundary it owns.
      - path: ^pkg/repostore/.+\.go$
        text: "G101:|G204:|G304:"
        linters:
          - gosec
      # CLI and config packages intentionally read user-selected local files.
      - path: ^(cli/cmd/braidplane/.+|cmd/prdiffreport/main|cmd/observability-smoke/main|config/config)\.go$
        text: "G117:|G204:|G304:"
        linters:
          - gosec
      # Curated builder examples are resolved through the local example allowlist.
      - path: ^frontend/handlers_builder\.go$
        text: "G304:"
        linters:
          - gosec
      # Pipeline spec validation and TLS root loading are local-file APIs by design.
      - path: ^(pkg/pipeline/validate/repository|service/email/tls)\.go$
        text: "G304:"
        linters:
          - gosec
      # Worktree connector ports and request-context/sort constants contain token-like names,
      # not credentials.
      - path: ^(pkg/depsports/depsports|pkg/reqctx/reqctx|transport/http/list_params)\.go$
        text: "G101:|G703:"
        linters:
          - gosec
      # Conversions are guarded immediately before use; gosec does not follow
      # the package-local bounds checks for these legacy integer fields.
      - path: ^(pkg/crypto/argon2|service/pipelineruntime/run_store|service/pipelinesvc/service)\.go$
        text: "G115:"
        linters:
          - gosec
      # Executable helper scripts intentionally need owner execute permission.
      - path: ^service/datasourcessvc/connector/git/auth\.go$
        text: "G306:"
        linters:
          - gosec
      # HTTP and HubSpot connectors issue customer-configured outbound requests;
      # provider/network restrictions are enforced by connector configuration.
      - path: ^(service/datasourcessvc/connector/http/connector|pkg/hubspot/crm/client)\.go$
        text: "G704:"
        linters:
          - gosec
      # Infrastructure packages that extract third-party error types (pgx, fiber, stdlib)
      # where importing xerror would introduce wrong coupling.
      - path: ^postgres/errors\.go$
        linters:
          - forbidigo
      - path: ^pkg/apierror/middleware\.go$
        linters:
          - forbidigo
      - path: ^pkg/repostore/git\.go$
        linters:
          - forbidigo
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      # Module path which contains the source code being formatted.
      # Default: ""
      module-path: github.com/Braidplane/braidplane-core
      # Choose whether to use the extra rules.
      # Default: false
      extra-rules: true
  exclusions:
    generated: lax

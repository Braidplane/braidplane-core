            - "${base-path}/pkg/httpsecurity/*.go"
            - "${base-path}/pkg/hubspot/**/*.go"
            - "${base-path}/pkg/hubspot/*.go"
            - "${base-path}/pkg/i18n/**/*.go"
            - "${base-path}/pkg/i18n/*.go"
            - "${base-path}/pkg/jsonvalue/**/*.go"
            - "${base-path}/pkg/jsonvalue/*.go"
            - "${base-path}/pkg/lifecycle/**/*.go"
            - "${base-path}/pkg/lifecycle/*.go"
            - "${base-path}/pkg/locale/**/*.go"
            - "${base-path}/pkg/locale/*.go"
            - "${base-path}/pkg/logging/**/*.go"
            - "${base-path}/pkg/logging/*.go"

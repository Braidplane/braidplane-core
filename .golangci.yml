version: "2"
run:
  relative-path-mode: cfg
  go: "1.26"
linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocritic
    - govet
    - iface
    - ineffassign
    - loggercheck
    - makezero
    - misspell
    - nilnil
    - nilnesserr
    - nilerr
    - noctx
    - nosprintfhostport
    - nolintlint
    - predeclared
    - promlinter
    - rowserrcheck
    - spancheck
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usetesting
    - wastedassign
    - gosec
    - wrapcheck
  settings:
    depguard:
      rules:
        spire_registration_boundary:
          files:
            - "$all"
            - "!${base-path}/pkg/spireregistration/**"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/pkg/spireregistration
              desc: SPIRE administration belongs only to the isolated WIF reconciler
        cli_boundary:
          files:
            - "$all"
            - "!${base-path}/cli/**"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/cli
              desc: shared and backend packages must not depend on CLI implementation
        frontend_boundary:
          files:
            - "${base-path}/frontend/*.go"
            - "${base-path}/frontend/**/*.go"
            - "${base-path}/cmd/frontend/*.go"
            - "${base-path}/cmd/frontend/**/*.go"
          list-mode: lax
          allow:
            - github.com/Braidplane/braidplane-core/pkg/sinkbinding$
            - github.com/Braidplane/braidplane-core/pkg/connector/googleworkspace$
          deny:
            - pkg: github.com/Braidplane/braidplane-core/pkg/eventtest
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/gitlab
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/gitprovider
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/googleoauth
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/googleworkspace
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/hubspot
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/operatorcapability
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/prworkflow
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/slack
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/snowflakewif
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/config/backend
              desc: frontend runtime must load frontend configuration only
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen/server
              desc: frontend must use the generated API client package, not server stubs
            - pkg: github.com/Braidplane/braidplane-core/pkg/connector
              desc: frontend must use the pipeline capability projection
            - pkg: github.com/Braidplane/braidplane-core/pkg/sinkbinding
              desc: frontend may use only the neutral sink-binding names package
            - pkg: github.com/Braidplane/braidplane-core/pkg/connector
              desc: frontend must not depend on backend connector internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/crypto
              desc: frontend must not depend on backend credential or password crypto internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/fake
              desc: frontend must not depend on backend fake-data composition internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/i18n
              desc: frontend must not depend on backend email/localization runtime internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/queue
              desc: frontend must not depend on backend worker queue internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/repostore
              desc: frontend must not depend on backend pipeline repository storage internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/testutil
              desc: frontend must not depend on backend test composition internals
            - pkg: github.com/Braidplane/braidplane-core/service
              desc: frontend must call backend API endpoints, not service packages
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: frontend must not import database layer packages
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: frontend package should stay separate from backend HTTP transport internals
        backend_composition_boundary:
          files:
            - "${base-path}/main.go"
            - "${base-path}/backend/*.go"
            - "${base-path}/backend/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/config/frontend
              desc: backend runtime must load backend configuration only
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen/client
              desc: backend runtime must use generated server stubs, not the frontend API client
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: backend runtime must not compose or render the SSR frontend
        backend_config_boundary:
          files:
            - "${base-path}/config/backend/*.go"
            - "${base-path}/config/backend/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/config/frontend
              desc: backend configuration must not depend on frontend configuration
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen/client
              desc: backend configuration must not depend on the generated frontend API client
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: backend configuration must not depend on SSR frontend packages
        frontend_config_boundary:
          files:
            - "${base-path}/config/frontend/*.go"
            - "${base-path}/config/frontend/**/*.go"
          list-mode: lax
          allow:
            - github.com/Braidplane/braidplane-core/pkg/sinkbinding$
            - github.com/Braidplane/braidplane-core/pkg/connector/googleworkspace$
          deny:
            - pkg: github.com/Braidplane/braidplane-core/pkg/eventtest
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/gitlab
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/gitprovider
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/googleoauth
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/googleworkspace
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/hubspot
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/operatorcapability
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/prworkflow
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/slack
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/snowflakewif
              desc: frontend must not depend on backend provider or tooling internals
            - pkg: github.com/Braidplane/braidplane-core/config/backend
              desc: frontend configuration must not depend on backend configuration
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen/server
              desc: frontend configuration must not depend on generated backend server stubs
            - pkg: github.com/Braidplane/braidplane-core/pkg/connector
              desc: frontend must use the pipeline capability projection
            - pkg: github.com/Braidplane/braidplane-core/pkg/sinkbinding
              desc: frontend may use only the neutral sink-binding names package
            - pkg: github.com/Braidplane/braidplane-core/pkg/connector
              desc: frontend configuration must not depend on backend connector internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/crypto
              desc: frontend configuration must not depend on backend credential or password crypto internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/fake
              desc: frontend configuration must not depend on backend fake-data composition internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/i18n
              desc: frontend configuration must not depend on backend email/localization runtime internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/queue
              desc: frontend configuration must not depend on backend worker queue internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/repostore
              desc: frontend configuration must not depend on backend pipeline repository storage internals
            - pkg: github.com/Braidplane/braidplane-core/pkg/testutil
              desc: frontend configuration must not depend on backend test composition internals
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: frontend configuration must not depend on database layer packages
            - pkg: github.com/Braidplane/braidplane-core/service
              desc: frontend configuration must not depend on backend services
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: frontend configuration must not depend on backend HTTP transport
        service_boundary:
          files:
            - "${base-path}/service/*.go"
            - "${base-path}/service/**/*.go"
            - "!${base-path}/service/*_test.go"
            - "!${base-path}/service/**/*_test.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen
              desc: service must not depend on generated API DTOs or transport contracts
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: service must not depend on SSR frontend rendering or handlers
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: service must not depend on HTTP transport handlers
        execution_broker_boundary:
          files:
            - "${base-path}/service/executionbroker/*.go"
            - "${base-path}/service/executionbroker/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/service/worker
              desc: execution broker owns the backend-neutral contract; worker packages may adapt it, but the broker must not depend on worker implementation
        postgres_boundary:
          files:
            - "${base-path}/postgres/*.go"
            - "${base-path}/postgres/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen
              desc: postgres must not depend on generated API DTOs or transport contracts
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: postgres must not depend on SSR frontend rendering or handlers
            - pkg: github.com/Braidplane/braidplane-core/service
              desc: postgres must not depend on business services
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: postgres must not depend on HTTP transport handlers
        transport_http_boundary:
          files:
            - "${base-path}/transport/http/*.go"
            - "${base-path}/transport/http/**/*.go"
            - "!${base-path}/transport/http/*_test.go"
            - "!${base-path}/transport/http/**/*_test.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: backend HTTP transport must not import SSR frontend packages
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen/client
              desc: backend HTTP transport must use generated server stubs, not the frontend API client
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: backend HTTP handlers must use services instead of reaching into repositories directly
        connector_provider_client_boundary:
          files:
            - "${base-path}/service/datasourcessvc/connector/**/client/*.go"
            - "${base-path}/service/datasourcessvc/connector/**/client/**/*.go"
            - "${base-path}/pkg/gitprovider/*.go"
            - "${base-path}/pkg/gitprovider/**/*.go"
            - "${base-path}/pkg/hubspot/*.go"
            - "${base-path}/pkg/hubspot/**/*.go"
            - "${base-path}/pkg/googleoauth/*.go"
            - "${base-path}/pkg/googleoauth/**/*.go"
            - "${base-path}/pkg/googleworkspace/*.go"
            - "${base-path}/pkg/googleworkspace/**/*.go"
            - "${base-path}/pkg/gitlab/oauth/*.go"
            - "${base-path}/pkg/gitlab/oauth/**/*.go"
            - "${base-path}/pkg/slack/*.go"
            - "${base-path}/pkg/slack/**/*.go"
            - "${base-path}/pkg/snowflakewif/*.go"
            - "${base-path}/pkg/snowflakewif/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen
              desc: provider clients must not depend on generated API DTOs or transport contracts
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: provider clients must not depend on SSR frontend packages
            - pkg: github.com/Braidplane/braidplane-core/pkg/connector/result
              desc: provider clients must not depend on Braidplane execution result envelopes
            - pkg: github.com/Braidplane/braidplane-core/pkg/pipeline
              desc: provider clients must not depend on backend pipeline state
            - pkg: github.com/Braidplane/braidplane-core/pkg/pipeline
              desc: provider clients must not depend on pipeline runtime or spec concerns
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: provider clients must not depend on Braidplane persistence repositories
            - pkg: github.com/Braidplane/braidplane-core/service/credentialssvc
              desc: provider clients must not depend on credential lifecycle services
            - pkg: github.com/Braidplane/braidplane-core/service/credentialssvc/provider/hubspot
              desc: provider clients must not depend on the HubSpot credential-lifecycle adapter
            - pkg: github.com/Braidplane/braidplane-core/service/datasourcessvc
              desc: provider clients must not depend on Braidplane data-source services or connector adapters
            - pkg: github.com/Braidplane/braidplane-core/service/datasourcessvc/connector/types
              desc: provider clients must not depend on Braidplane connector execution parameter contracts
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: provider clients must not depend on HTTP transport handlers
        connector_boundary:
          files:
            - "${base-path}/service/datasourcessvc/connector/*.go"
            - "${base-path}/service/datasourcessvc/connector/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/api-schema/gen
              desc: connectors must not depend on generated API DTOs or transport contracts
            - pkg: github.com/Braidplane/braidplane-core/frontend
              desc: connectors must not depend on SSR frontend packages
            - pkg: github.com/Braidplane/braidplane-core/postgres
              desc: connectors must not depend on Braidplane persistence repositories
            - pkg: github.com/Braidplane/braidplane-core/service/credentialssvc
              desc: connectors must not depend on credential lifecycle services
            - pkg: github.com/Braidplane/braidplane-core/service/credentialssvc/provider/hubspot
              desc: connectors must not depend on the HubSpot credential-lifecycle adapter
            - pkg: github.com/Braidplane/braidplane-core/transport/http
              desc: connectors must not depend on HTTP transport handlers
        bigquery_execution_auth_boundary:
          files:
            - "${base-path}/service/datasourcessvc/connector/bigquery/*.go"
            - "${base-path}/service/datasourcessvc/connector/bigquery/**/*.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/pkg/googleoauth
              desc: BigQuery execution receives resolved credentials and must not own OAuth consent or refresh
            - pkg: github.com/Braidplane/braidplane-core/service/credentialssvc
              desc: BigQuery execution must not depend on credential lifecycle services
        contract_compilation_boundary:
          files:
            - "${base-path}/pkg/contractplan/*.go"
            - "${base-path}/pkg/contractplan/**/*.go"
            - "${base-path}/pkg/odcs/*.go"
            - "${base-path}/pkg/odcs/**/*.go"
            - "!${base-path}/pkg/contractplan/**/*_test.go"
            - "!${base-path}/pkg/contractplan/*_test.go"
            - "!${base-path}/pkg/odcs/**/*_test.go"
            - "!${base-path}/pkg/odcs/*_test.go"
          deny:
            - pkg: github.com/Braidplane/braidplane-core/pkg/gitprovider
              desc: contract compilation must use explicitly supplied source snapshots
            - pkg: github.com/Braidplane/braidplane-core/pkg/repostore
              desc: contract compilation must not read mutable Git resources
            - pkg: github.com/Braidplane/braidplane-core/pkg/crypto
              desc: contract compilation must not resolve credentials
            - pkg: github.com/Braidplane/braidplane-core/pkg/queue
              desc: contract compilation must not admit execution
            - pkg: github.com/Braidplane/braidplane-core/pkg/pipeline/run$
              desc: contract compilation must not dispatch execution
            - pkg: github.com/Braidplane/braidplane-core/pkg/executiondelivery
              desc: contract compilation must not dispatch execution
        internal_boundary:
          files:
            - "${base-path}/pkg/apierror/**/*.go"
            - "${base-path}/pkg/apierror/*.go"
            - "${base-path}/pkg/apischema/**/*.go"
            - "${base-path}/pkg/apischema/*.go"
            - "${base-path}/pkg/as/**/*.go"
            - "${base-path}/pkg/as/*.go"
            - "${base-path}/pkg/clock/**/*.go"
            - "${base-path}/pkg/clock/*.go"
            - "${base-path}/pkg/connector/**/*.go"
            - "${base-path}/pkg/connector/*.go"
            - "${base-path}/pkg/contractplan/**/*.go"
            - "${base-path}/pkg/contractplan/*.go"
            - "${base-path}/pkg/crypto/**/*.go"

metadata:
  slug: hubspot-contacts-to-mysql
  name: HubSpot Contacts to MySQL
  # NOTE: Replace the example slugs below with real slugs from your organization.
  # This pipeline expects:
  # - a HubSpot data source, for example `acme-hubspot`
  # - a MySQL data source, for example `acme-mysql`
  # - a saved MySQL sink query, for example `upsert-hubspot-contacts-mysql`
  #
  # The MySQL sink query should accept an `org_slug` parameter and use `FROM input`,
  # for example:
  #   INSERT INTO hubspot_contacts (org_slug, hubspot_id, email, first_name, last_name)
  #   SELECT {{org_slug}}, hubspot_id, email, first_name, last_name
  #   FROM input
  #   ON DUPLICATE KEY UPDATE
  #     email = VALUES(email),
  #     first_name = VALUES(first_name),
  #     last_name = VALUES(last_name)
steps:
  - kind: query
    slug: fetch-hubspot-contacts
    name: Read contacts from HubSpot
    query:
      data_source_ref: acme-hubspot
      operation_type: hubspot
      operation_inline:
        type: hubspot
        object_type: contacts
        operation: list
        properties:
          - email
          - firstname
          - lastname
        limit: 100
      output_contract:
        name: hubspot-contacts
        representation: rows
        fields:
          - name: hs_object_id
            type: string
            required: true
          - name: email
            type: string
            required: false
          - name: firstname
            type: string
            required: false
          - name: lastname
            type: string
            required: false
  - kind: transform
    slug: project-contact-rows
    name: Normalize contact fields
    transform:
      inputs:
        input: fetch-hubspot-contacts
      sql: |
        SELECT
          hs_object_id AS hubspot_id,
          email,
          firstname AS first_name,
          lastname AS last_name
        FROM input
        WHERE email IS NOT NULL
        ORDER BY email
      output_kind: rows
      output_contract:
        name: hubspot-contact-rows
        representation: rows
        fields:
          - name: hubspot_id
            type: string
            required: true
          - name: email
            type: string
            required: false
          - name: first_name
            type: string
            required: false
          - name: last_name
            type: string
            required: false
  - kind: sink
    slug: write-contact-rows
    name: Upsert contacts into MySQL
    sink:
      idempotency_class: deduplicated_by_ledger
      input: project-contact-rows
      input_contract:
        name: hubspot-contact-rows
        representation: rows
        fields:
          - name: hubspot_id
            type: string
            required: true
          - name: email
            type: string
            required: false
          - name: first_name
            type: string
            required: false
          - name: last_name
            type: string
            required: false
      data_source_ref: acme-mysql
      operation_type: sql
      operation_ref: upsert-hubspot-contacts-mysql
      config:
        org_slug: acme

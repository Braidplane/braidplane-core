metadata:
  slug: postgres-customers-to-hubspot
  name: PostgreSQL Customers to HubSpot
  # Replace these example slugs with organization-owned resources:
  # - source data source: `app-postgres`
  # - saved source query: `active-customers`
  # - writable HubSpot data source: `hubspot-destination` with `read_only: false`
  #   HubSpot defaults to `read_only: true`, which prevents sink dispatch.
  # - saved HubSpot operation: `upsert-contacts-by-customer-id`
  #
  # The saved HubSpot operation uses:
  #   type: hubspot
  #   object_type: contacts
  #   operation: upsert
  #   id_property: external_customer_id
  #   Note: `external_customer_id` must already exist in HubSpot and be configured as unique.
  #   property_mapping:
  #     customer_id: external_customer_id
  #     email: email
  #     first_name: firstname
  #     last_name: lastname
  #   rows: "{{input}}"
steps:
  - kind: query
    slug: read-active-customers
    name: Read active customers
    query:
      data_source_ref: app-postgres
      operation_type: sql
      operation_ref: active-customers
      output_contract:
        name: active-customers
        representation: rows
        fields:
          - name: customer_id
            type: string
            required: true
          - name: email
            type: string
            required: true
          - name: first_name
            type: string
            required: false
          - name: last_name
            type: string
            required: false
  - kind: sink
    slug: upsert-hubspot-contacts
    name: Upsert contacts into HubSpot
    sink:
      idempotency_class: idempotent_with_key
      input: read-active-customers
      input_contract:
        name: active-customers
        representation: rows
        fields:
          - name: customer_id
            type: string
            required: true
          - name: email
            type: string
            required: true
          - name: first_name
            type: string
            required: false
          - name: last_name
            type: string
            required: false
      data_source_ref: hubspot-destination
      operation_type: hubspot
      operation_ref: upsert-contacts-by-customer-id

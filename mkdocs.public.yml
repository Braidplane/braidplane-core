site_name: Braidplane Docs · Alpha
site_description: Public documentation for Braidplane's ETL-first operational data workflows

docs_dir: docs-public
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
hooks:
  - docker/docs/mkdocs_hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - How Braidplane works: getting-started/overview.md
      - Review changes with Proof: getting-started/proof.md
      - UI tutorial: getting-started/first-result.md
      - Install the CLI: getting-started/cli.md
      - CLI tutorial: getting-started/first-result-cli.md
      - Pipeline specifications: getting-started/pipeline-specifications.md
  - Connectors:
      - Connector directory: connectors/index.md
      - Support levels: connectors/support-levels.md
      - Connect a system: connectors/connect-a-system.md
      - Data sources:
          - PostgreSQL: connectors/postgresql.md
          - MySQL: connectors/mysql.md
          - Google Workspace: connectors/google-workspace.md
          - BigQuery: connectors/bigquery.md
          - Snowflake: connectors/snowflake.md
          - MongoDB: connectors/mongodb.md
          - HTTP: connectors/http.md
          - HubSpot: connectors/hubspot.md
          - FTP: connectors/ftp.md
          - Git: connectors/git.md
          - GitHub: connectors/github.md
          - GitLab: connectors/gitlab.md
          - S3: connectors/s3.md
  - Examples:
      - Choose a recipe: examples/index.md
      - Customer enrichment: examples/http-customer-enrichment.md
      - Settlement reconciliation: examples/settlement-ledger-reconciliation.md
      - Spreadsheet contact overrides: examples/spreadsheet-contact-overrides.md
      - Document inventory projection: examples/document-inventory-projection.md
      - Opaque file archive: examples/opaque-file-archive.md
      - PostgreSQL to S3 walkthrough: getting-started/first-pipeline.md
  - API:
      - Reference: api/index.md
      - Alpha API contract: api/alpha.md

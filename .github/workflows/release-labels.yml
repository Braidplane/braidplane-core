name: PR release classification

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-labels:
    name: Release labels
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate current release classification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | python3 -c '
          import json, sys
          from scripts.prepare_core_release import classified
          classified([json.load(sys.stdin)])
          print("Release classification is valid.")'

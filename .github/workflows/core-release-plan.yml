name: Prepare Core release candidate

on:
  workflow_run:
    workflows: [Community core]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: core-release-plan
  cancel-in-progress: false
  queue: max

jobs:
  prepare-plan:
    if: ${{ github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha && vars.CORE_RELEASE_PREPARATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare candidate after successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.prepare_core_release "$GITHUB_WORKSPACE"

name: Prepare disposable hosted runner
description: Reclaim unused SDK disk space before dependency and image caches are loaded.
inputs:
  reclaim_sdk_space:
    description: Remove unused SDKs before loading caches
    default: 'true'
runs:
  using: composite
  steps:
    - name: Reclaim unused hosted SDKs
      if: runner.environment == 'github-hosted'
      shell: bash
      env:
        RECLAIM_SDK_SPACE: ${{ inputs.reclaim_sdk_space }}
      run: |
        df -h /
        # Community uses pinned Go/Node and Python, not these preinstalled SDKs.
        if [ "$RECLAIM_SDK_SPACE" = true ]; then
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        fi
        df -h /
    - name: Start disk sampling
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        python3 scripts/ci_disk_usage.py sample "$RUNNER_TEMP/community-disk" </dev/null >"$RUNNER_TEMP/community-disk-sampler.log" 2>&1 &

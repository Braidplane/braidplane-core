                $ref: '#/components/schemas/APIKeyWithToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot rotate this API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key not found or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


      required: [intent_token, request_digest, candidate, claim, operation, target, data_source_slug, credential_version, policy_version, expires_at, evidence_expires_at, metadata_expires_at, rate_window_seconds, timeout_seconds, max_rows, max_bytes, max_requests]

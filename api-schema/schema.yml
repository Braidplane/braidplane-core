openapi: 3.0.4
info:
  title: Braidplane API
  description: |
    Braidplane backend API for multi-tenant operational data workflows.
    It provides authentication, organization management, data source connectivity,
    query execution, and pipeline orchestration endpoints used by the SSR frontend.
    Protected operations accept bearer credentials or browser sessions unless overridden.
    Authentication does not grant resource permissions or bypass principal restrictions.
    Alpha authentication and retry contract: see docs-public/api/alpha.md in this release.
  version: 0.0.1

servers:
  - url: /api
    description: Community application API

security:
  - BearerAuth: []
  - SessionAuth: []

paths:





  /users:
    post:
      summary: Create a user
      description: Create a new local account.
      operationId: createUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
            example:
              full_name: "John Doe"
              email: "john.doe@example.com"
              password: "SecurePass123!"
      responses:
        "400":
          description: Invalid account input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Self-service registration or external onboarding is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: A user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                slug: "johndoe"
                full_name: "John Doe"
                email: "john.doe@example.com"
                role: "user"
                mfa_email_enabled: false
                has_local_password: true
                locale: "en-US"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"

  /sessions:
    post:
      summary: Create a session
      description: Create a new session
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSession"
            example:
              email: "john.doe@example.com"
              password: "SecurePass123!"
      responses:
        "200":
          description: Session has been set in the cookie
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/AuthenticatedUser'
              example:
                authentication_version: 1
                slug: "johndoe"
                full_name: "John Doe"
                email: "john.doe@example.com"
                role: "user"
                mfa_email_enabled: false
                has_local_password: true
                locale: "en-US"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        "202":
          description: Email MFA verification is required before the session is created
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/MFAChallenge'
              example:
                challenge_token: example-mfa-challenge
                expires_at: "2025-10-04T10:40:00Z"

  /sessions/mfa/verify:
    post:
      summary: Verify session MFA challenge
      description: Verifies an email MFA code and creates the session cookie
      operationId: verifySessionMFA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerification"
            example:
              challenge_token: example-mfa-challenge
              code: "123456"
      responses:
        "200":
          description: Session has been set in the cookie
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/AuthenticatedUser'
              example:
                authentication_version: 1
                slug: "johndoe"
                full_name: "John Doe"
                email: "john.doe@example.com"
                role: "user"
                mfa_email_enabled: true
                has_local_password: true
                locale: "en-US"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        "400":
          description: Invalid, expired, consumed, or over-attempt MFA challenge

  /users/profile:
    get:
      summary: Get user profile
      description: Returns the authenticated user's profile information
      operationId: getUsersProfile
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                slug: "johndoe"
                full_name: "John Doe"
                email: "john.doe@example.com"
                role: "user"
                mfa_email_enabled: false
                has_local_password: true
                locale: "pl"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        '401':
          description: Unauthorized - user not authenticated
    patch:
      summary: Update user profile
      description: Update the authenticated user's profile information
      operationId: patchUsersProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfile'
            example:
              locale: "pl"
              full_name: "John Doe"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                slug: "johndoe"
                full_name: "John Doe"
                email: "john.doe@example.com"
                role: "user"
                mfa_email_enabled: false
                has_local_password: true
                locale: "pl"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        '401':
          description: Unauthorized - user not authenticated

  /users/profile/deletion:
    post:
      summary: Request removal of the current account
      description: >-
        Requires an authenticated browser session, CSRF protection, and explicit confirmation.
        PATs and organization API keys cannot request account removal. The subject
        is always the session user. Ownership conflicts leave access intact;
        otherwise access is revoked and processing cancellation begins. An accepted
        request remains pending until account-owned processing stops. The account
        and its private data are then hard-deleted. Minimal legal-acceptance evidence
        is retained independently. External provider resources and backups are not erased.
        Save the returned request identifier before leaving the signed-out flow.
      operationId: requestAccountDeletion
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionConfirmation'
      responses:
        '200':
          description: Account deleted; minimal acceptance evidence retained independently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
        '202':
          description: Request recorded; access revoked and remaining cleanup pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
        '409':
          description: >-
            Transfer ownership for organizations in ownership_required and explicitly
            delete sole-member organizations in organization_removal_required, then retry.
            Either list may be populated alone, or both may contain organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionRequest'
        '400':
          description: Invalid confirmation
        '401':
          description: An active session is required
        '403':
          description: Session user not authorized, token principal, or invalid CSRF

  /users/profile/password:
    put:
      summary: Change user password
      description: Changes the authenticated session user's local password after verifying the current password and revokes all sessions, including the current session. Sign in again afterward. PATs and organization API keys cannot manage user passwords.
      operationId: updateUserPassword
      security:
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPassword'
            example:
              current_password: "SecurePass123!"
              new_password: "NewSecurePass123!"
      responses:
        '204':
          description: Password updated successfully
        '400':
          description: Validation failed, password policy failed, or local password sign-in is not enabled
        '401':
          description: A session user is required or the current password is invalid
        '403':
          description: Session user cannot update this password

  /users/profile/personal-access-tokens:
    post:
      summary: Create a personal access token
      description: Creates a user-scoped personal access token and returns the raw token once. Session users may opt a new token into personal access token management. A management-enabled PAT may create tokens for its own user, but bearer-created tokens always have management disabled.
      tags:
        - authentication
      operationId: createPersonalAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPersonalAccessToken'
            example:
              name: "Developer CLI"
              expires_at: "2026-12-31T23:59:59Z"
      responses:
        '201':
          description: Personal access token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessTokenWithToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot manage personal access tokens or attempted to delegate management capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List personal access tokens
      description: Lists safe personal access token metadata for the authenticated user. A PAT must have personal access token management enabled. Raw tokens and token hashes are never returned.
      tags:
        - authentication
      operationId: listPersonalAccessTokens
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/PersonalAccessTokensFieldParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
      responses:
        '200':
          description: List of personal access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessTokenListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot manage personal access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/profile/personal-access-tokens/{pat_slug}:
    get:
      summary: Get a personal access token
      description: Returns safe personal access token metadata for the authenticated user. A PAT must have personal access token management enabled. Raw tokens and token hashes are never returned.
      tags:
        - authentication
      operationId: getPersonalAccessToken
      parameters:
        - $ref: '#/components/parameters/PATSlugParam'
      responses:
        '200':
          description: Personal access token details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot manage personal access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Personal access token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a personal access token
      description: Updates safe personal access token metadata owned by the authenticated user. A management-enabled PAT may update metadata but cannot enable or disable management capability. Raw tokens and token hashes are never returned.
      tags:
        - authentication
      operationId: updatePersonalAccessToken
      parameters:
        - $ref: '#/components/parameters/PATSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonalAccessToken'
            example:
              name: "Developer CLI"
      responses:
        '200':
          description: Personal access token updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessToken'
        '400':
          description: Malformed JSON or invalid personal access token update input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot manage personal access tokens or attempted to change management capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Personal access token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Revoke a personal access token
      description: Revokes a personal access token owned by the authenticated user. A PAT must have personal access token management enabled.
      tags:
        - authentication
      operationId: deletePersonalAccessToken
      parameters:
        - $ref: '#/components/parameters/PATSlugParam'
      responses:
        '204':
          description: Personal access token revoked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot manage personal access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Personal access token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/profile/personal-access-tokens/{pat_slug}/delete:
    post:
      summary: Delete a revoked personal access token
      description: Permanently deletes revoked personal access token metadata owned by the authenticated session user. This remains session-only. Active tokens must be revoked before deletion. Raw tokens and token hashes are never returned.
      tags:
        - authentication
      operationId: deleteRevokedPersonalAccessToken
      security:
        - SessionAuth: []
      parameters:
        - $ref: '#/components/parameters/PATSlugParam'
      responses:
        '204':
          description: Revoked personal access token metadata deleted
        '400':
          description: Personal access token must be revoked before deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A session user is required; PATs and organization API keys cannot manage PATs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Personal access token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/profile/personal-access-tokens/{pat_slug}/rotate:
    post:
      summary: Rotate a personal access token
      description: Replaces a personal access token secret for the authenticated user and returns the raw token once. A PAT must have personal access token management enabled; rotation preserves the target token's management capability.
      tags:
        - authentication
      operationId: rotatePersonalAccessToken
      parameters:
        - $ref: '#/components/parameters/PATSlugParam'
      responses:
        '200':
          description: Personal access token rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalAccessTokenWithToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot manage personal access tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Personal access token not found or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/methods:
    get:
      summary: Get available authentication methods
      description: Returns deployment-level sign-in configuration before authentication. It grants no tenant access and does not check provider reachability.
      operationId: getAuthenticationMethods
      security: []
      tags:
        - authentication
      responses:
        '200':
          description: Configured authentication methods
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [google_sign_in_enabled]
                properties:
                  google_sign_in_enabled:
                    type: boolean

  /auth/google:
    post:
      summary: Start or complete Google account registration
      description: Resumes a verified, unexpired pending Google signup in the browser session without another authorization; otherwise starts Google authorization.
      operationId: registerGoogleAccount
      security: []
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                _csrf:
                  type: string
                  description: Browser form CSRF token. Required when completing a pending signup.
      responses:
        '302':
          description: Redirect to Google authorization, authenticated workspace setup after completing signup, or the authentication retry page if the pending signup is invalid or expired.
        '400':
          description: Invalid registration input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account creation is disabled, or the pending signup CSRF token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Google sign-in is not configured or its provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Initiate Google OAuth flow
      description: |
        Redirects the user to Google's OAuth consent screen.
        After the user authenticates with Google, they will be redirected back to the backend callback endpoint.
      tags:
        - authentication
      operationId: initiateGoogleAuth
      security: []
      responses:
        '302':
          description: Redirect to Google OAuth consent screen
          headers:
            Location:
              description: Google OAuth authorization URL
              schema:
                type: string
                format: uri
                example: "https://accounts.google.com/o/oauth2/v2/auth?client_id=..."
        '503':
          description: Google sign-in is not configured or its provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/google/callback:
    get:
      summary: Handle Google OAuth callback
      description: |
        Callback endpoint that Google redirects to after user authentication.
        Exchanges the authorization code for user information, creates or finds the user in the database,
        establishes a session, and redirects back to the frontend.
      tags:
        - authentication
      operationId: handleGoogleCallback
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code provided by Google on success; absent when authorization is cancelled or fails.
          schema:
            type: string
            example: "4/0AeanS0aRXqzQGLfI..."
        - name: state
          in: query
          required: false
          description: CSRF protection token
          schema:
            type: string
            example: "random-state-string"
        - name: error
          in: query
          required: false
          description: Error code from Google if authentication failed
          schema:
            type: string
            example: "access_denied"
      responses:
        '302':
          description: Redirect to frontend (success or error)
          headers:
            Location:
              description: Frontend URL with session cookie set (success) or error page with error details (failure)
              schema:
                type: string
                format: uri
                example: "http://localhost:3000"
            Set-Cookie:
              description: Session cookie (HttpOnly, SameSite=Lax) - only set on success
              schema:
                type: string
                example: "session_id=abc123; HttpOnly; SameSite=Lax; Path=/; Max-Age=604800"

  /auth/email/verify:
    post:
      summary: Verify email address
      description: |
        Verifies a user's email address using the token sent to their email during registration.
        Tokens are single-use and expire after 24 hours.
      tags:
        - authentication
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
            example:
              token: "abc123-secure-token-xyz789"
      responses:
        '204':
          description: Email successfully verified
        '400':
          description: Invalid or expired token

  /auth/password/forgot:
    post:
      summary: Request password reset
      description: |
        Requests a password reset email for the supplied address.
        The response is intentionally identical whether or not the account exists.
      tags:
        - authentication
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
            example:
              email: "john.doe@example.com"
      responses:
        '204':
          description: Password reset request accepted
        '400':
          description: Invalid request body or validation error

  /auth/password/reset:
    post:
      summary: Reset password
      description: |
        Resets a user's password using a single-use reset token and revokes all existing sessions and pending MFA login challenges.
        Tokens expire after 24 hours.
      tags:
        - authentication
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              token: "reset-token-abc123"
              password: "NewSecurePass123!"
      responses:
        '204':
          description: Password successfully reset
        '400':
          description: Invalid request, token, or expired token

  /auth/email/resend-verification:
    post:
      summary: Resend verification email
      description: |
        Sends a fresh verification email to an unverified account.
        The response is intentionally generic and does not expose account state.
      tags:
        - authentication
      operationId: resendVerificationEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmailRequest'
            example:
              email: "john.doe@example.com"
      responses:
        '204':
          description: Verification resend request accepted
        '400':
          description: Invalid request body or validation error

  /organizations:
    post:
      summary: Create an organization
      description: Creates a new organization. The authenticated user is added as an admin member.
      tags:
        - organizations
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrganization'
            example:
              name: "Acme Corp"
              slug: "acme-corp"
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: "Acme Corp"
                slug: "acme-corp"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        '409':
          description: Organization already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List user's organizations
      description: Lists all organizations the authenticated user is a member of.
      tags:
        - organizations
      operationId: listOrganizations
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/OrganizationsFieldParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
              example:
                organizations:
                  - name: "Acme Corp"
                    slug: "acme-corp"
                    member_role: "admin"
                    created_at: "2025-10-04T10:30:00Z"
                    updated_at: "2025-10-04T10:30:00Z"
                has_more: false
                next_cursor: null
                prev_cursor: null

  /organizations/{slug}:
    delete:
      summary: Delete an organization
      description: >-
        Permanently removes the organization, its memberships and settings.
        Remove projects and data sources first. Unresolved processing blocks deletion.
        Pending Snowflake workload identity cleanup also blocks deletion; retry after cleanup completes.
        Minimal legal-acceptance evidence is retained independently.
      tags: [organizations]
      operationId: deleteOrganization
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  description: The exact organization slug.
      responses:
        '204':
          description: Organization deleted
        '400':
          description: Invalid confirmation
        '401':
          description: Authentication required
        '403':
          description: Forbidden
        '404':
          description: Organization not found
        '409':
          description: Remove projects and data sources, resolve outstanding processing, and wait for Snowflake workload identity cleanup before retrying
    get:
      summary: Get an organization
      description: Returns the organization identified by its slug.
      tags:
        - organizations
      operationId: getOrganization
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                name: "Acme Corp"
                slug: "acme-corp"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an organization

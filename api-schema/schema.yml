  /organizations/{slug}/projects/{project_slug}/environments/{environment_slug}/pipeline-validation:
    post:
      summary: Validate a pipeline spec
      description: >
        Validates a pipeline spec against one enabled project environment. This
        is the shared validation surface for frontend builder preflight and CLI
        server-target validation. Validation applies the canonical pipeline spec
        validator: syntax/schema decoding, required fields, supported step
        kinds, graph and binding consistency, source/sink/transform target
        shape, and mutually exclusive operation references. Server validation
        resolves logical data-source refs through the selected project
        environment and rejects sink replay policies unsupported by the resolved
        connector before checking org-scoped cached data-source schema
        metadata when the spec contains contracts or transforms that require
        schema context. It does not refresh schemas, call live connectors, run
        operations, or prove that referenced connector operations exist in the
        target environment. Failed validation results with a pipeline slug are
        stored as non-run diagnostic history for operator triage only when the
        caller is authorized to update pipeline history; the response body
        remains the source of truth for validation semantics. UI builder
        validation may still run earlier local checks for draft completeness and
        graph editing feedback; CLI --local validation uses the local validator
        without contacting this endpoint and therefore cannot check bindings or
        cached server-side schema metadata.
      tags:
        - pipelines
      operationId: validatePipeline
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineValidationRequest'
      responses:
        '200':
          description: Pipeline validation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineValidationResponse'
        '400':
          description: Invalid input (malformed JSON or malformed request shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


          $ref: '#/components/schemas/Timestamp'
        actual_fire_at:
          $ref: '#/components/schemas/Timestamp'
        misfire_result:
          description: Scheduler result for this executed fire, not the trigger configuration policy. Skipped fires are recorded without a pipeline run.
          allOf:
            - $ref: '#/components/schemas/PipelineRunScheduleMisfireResult'
      required:
        - trigger_slug
        - trigger_revision
        - cron
        - timezone
        - scheduled_fire_at
        - actual_fire_at
        - misfire_result

    PipelineRunSourceWebhookSummary:
      type: object
      additionalProperties: false

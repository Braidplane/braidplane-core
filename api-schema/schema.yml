        - fields

    FileSchemaDiagnostic:
      type: object
      description: Non-fatal file schema sampling diagnostic.
      properties:
        name:
          type: string
          description: Listed file name or logical dataset identifier.
          example: "users.csv"
        target:
          type: string
          description: Provider target that was sampled.
          example: "imports/users.csv"
        severity:
          type: string
          description: Diagnostic severity.
          example: "warning"
        code:
          type: string
          description: Stable diagnostic code for the sampling outcome.
          example: "parse_failed"
        message:
          type: string
          description: Human-readable safe diagnostic summary.
          example: "Skipped file because fields could not be inferred from the sample."
      required:
        - name
        - target
        - severity
        - code
        - message

    FileSchemaResponse:
      type: object
      description: File data source schema introspection result (FTP, storage, etc.)
      properties:
        schema_type:
          type: string
          description: Schema category identifier
          enum: [file]
          x-enum-varnames:
            - File
          example: "file"
        type:
          type: string
          description: File source vendor type
          enum: [ftp, git, github, gitlab, s3, google_workspace]
          example: "git"
        files:
          type: array
          description: List of discovered files or datasets
          items:
            $ref: '#/components/schemas/FileInfo'
        diagnostics:
          type: array
          description: Non-fatal diagnostics for listed files that could not be sampled or parsed.
          items:
            $ref: '#/components/schemas/FileSchemaDiagnostic'
      required:
        - schema_type
        - type
        - files

    SQLResultFormat:
      type: string
      enum: [rows, file]
      description: Rows by default. File serializes one finite query result as a retained JSON object with column_names, rows and row_count; positive row and transfer limits are required.

    # Query Statement Schemas (Polymorphic)
    PostgresStatement:
      type: object
      description: PostgreSQL query statement with {{paramName}} placeholders
      properties:
        type:
          type: string
          enum: [postgres]
          x-enum-varnames:
            - PostgresStatementTypePostgres
          description: Data source type discriminator
        sql:
          type: string
          minLength: 1
          description: PostgreSQL SQL statement with {{paramName}} placeholders
          example: "SELECT * FROM users WHERE id = {{user_id}} LIMIT {{limit}}"
        format:
          $ref: '#/components/schemas/SQLResultFormat'
      required:
        - type
        - sql

    MySQLStatement:
      type: object
      description: MySQL query statement with {{paramName}} placeholders
      properties:
        format:
          $ref: '#/components/schemas/SQLResultFormat'
        type:
          type: string
          enum: [mysql]
          description: Data source type discriminator
        sql:
          type: string
          minLength: 1
          description: MySQL SQL statement with {{paramName}} placeholders
          example: "SELECT * FROM users WHERE id = {{user_id}} LIMIT {{limit}}"
      required:
        - type
        - sql

    BigQueryStatement:
      type: object
      description: Braidplane BigQuery operation statement. Query operations use GoogleSQL with {{paramName}} placeholders that are converted to BigQuery named parameters. The insert_rows operation is BigQuery-specific and consumes Braidplane row payloads before sending BigQuery insertAll rows.
      additionalProperties: false
      properties:
        format:
          $ref: '#/components/schemas/SQLResultFormat'
        type:
          type: string
          enum: [bigquery]
          x-enum-varnames:
            - BigQueryStatementTypeBigquery
          description: Data source type discriminator
        operation:
          type: string
          enum: [query, insert_rows]
          description: BigQuery-specific Braidplane operation mode. BigQuery itself receives jobs.query or insertAll requests; this field tells Braidplane which provider operation to call.
          example: query
        sql:
          type: string
          minLength: 1
          description: GoogleSQL statement with {{paramName}} placeholders. Required for query operations.
          example: "SELECT * FROM `analytics.orders` WHERE region = {{region}}"
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          description: Operation-local timeout in seconds, capped by connector execution limits
          example: 30
        maximum_bytes_billed:
          type: integer
          format: int64
          minimum: 1
          description: Operation-local BigQuery maximumBytesBilled cost guard, capped by connector execution limits. This limits provider-side bytes processed/scanned, not response size.
          example: 1000000000
        dataset:
          type: string
          minLength: 1
          description: Target BigQuery dataset namespace for insert_rows; falls back to the connector default dataset when omitted. In project.dataset.table, this is the dataset segment.
          example: analytics
        table:
          type: string
          minLength: 1
          description: Target BigQuery table inside the dataset for insert_rows. In project.dataset.table, this is the table segment.
          example: orders
        rows:
          description: Braidplane row payload consumed by the BigQuery-specific insert_rows operation. Usually {{input}} for pipeline sinks; exact placeholders can resolve to native arrays of row objects before Braidplane sends BigQuery insertAll rows.
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
            - type: string
          example: "{{input}}"
        insert_id_prefix:
          type: string
          description: Optional prefix for BigQuery insertAll insertId values. insertId is BigQuery's best-effort duplicate suppression key for streaming inserts; omitted values send rows without insertIds. Supports safe runtime placeholders such as {{runtime.run.slug}}.
          example: "{{runtime.run.slug}}"
      oneOf:
        - title: BigQueryQueryStatement
          properties:
            operation:
              type: string
              enum: [query]
              x-enum-varnames:
                - BigQueryQueryStatementOperationQuery
          required:
            - type
            - operation
            - sql
        - title: BigQueryInsertRowsStatement
          properties:
            operation:
              type: string
              enum: [insert_rows]
              x-enum-varnames:
                - BigQueryInsertRowsStatementOperationInsertRows
          required:
            - type
            - operation
            - table
            - rows
      required:
        - type

    SnowflakeStatement:
      type: object
      description: Snowflake SQL statement with parameterized {{paramName}} placeholders
      additionalProperties: false
      properties:
        format:
          $ref: '#/components/schemas/SQLResultFormat'
        type:
          type: string
          enum: [snowflake]
          description: Data source type discriminator
        sql:
          type: string
          minLength: 1
          description: Snowflake SQL text; values are bound through the driver and never interpolated
          example: "SELECT * FROM ANALYTICS.PUBLIC.ORDERS WHERE REGION = {{region}}"
      required: [type, sql]

    MongoDBStatement:
      type: object
      description: MongoDB query statement with native structure and {{paramName}} placeholders
      properties:
        type:
          type: string
          enum: [mongodb]
          description: Data source type discriminator
        collection:
          type: string
          minLength: 1
          description: MongoDB collection name
          example: "users"
        operation:
          type: string
          enum: [find, aggregate, count_documents, insert_one, update_one, delete_one, update_many, delete_many]
          description: MongoDB operation type
          example: "find"
        filter:
          type: object
          additionalProperties: true
          description: MongoDB query filter (supports {{paramName}} placeholders in values)
          example: {"_id": "{{user_id}}"}
        sort:
          type: object
          additionalProperties:
            type: integer
            enum: [1, -1]
          description: MongoDB sort specification
          example: {"created_at": -1}
        projection:
          type: object
          additionalProperties:
            type: integer
            enum: [0, 1]
          description: MongoDB field projection
          example: {"_id": 1, "email": 1}
        limit_value:
          type: integer
          minimum: 1
          description: Maximum documents to return
          example: 100
        document:
          type: object
          additionalProperties: true
          description: |
            Document to insert or update (supports {{paramName}} placeholders in values).
            Only used for write operations (insert_one, update_one, update_many, delete_one, delete_many).
            For find and aggregate operations, this field is ignored.
          example: {"email": "value", "full_name": "value", "is_active": true}
      required:
        - type
        - collection
        - operation
    HTTPStatement:
      type: object
      description: HTTP API request statement with {{paramName}} placeholders
      properties:
        type:
          type: string
          enum: [http]
          description: Data source type discriminator
        method:
          type: string
          enum: [GET, POST, PUT, DELETE, PATCH, HEAD]
          description: HTTP method
          example: "GET"
        path:
          type: string
          minLength: 1
          description: API endpoint path with {{paramName}} placeholders
          example: "/users/{{user_id}}/posts"
        query_params:
          type: object
          additionalProperties: true
          description: Query string parameters (supports {{paramName}} placeholders in values)
          example: {"limit": "{{limit}}", "offset": "{{offset}}"}
        headers:
          type: object
          additionalProperties:
            type: string
          description: Non-secret HTTP headers (supports {{paramName}} placeholders in values); keep authentication values in encrypted data-source credentials.
          example: {"Content-Type": "application/json"}
        body:
          description: Request body (JSON object or {{paramName}} placeholders)
          example: {"filter": "{{filter}}"}
        pagination:
          $ref: '#/components/schemas/HTTPPagination'
        acknowledgement:
          $ref: '#/components/schemas/HTTPAcknowledgement'
        write_retry:
          $ref: '#/components/schemas/HTTPWriteRetry'
      required:
        - type
        - method
        - path

    HTTPWriteRetry:
      type: object
      additionalProperties: false
      description: Explicit operator attestation of a verified provider idempotency contract. Only saved pipeline sink operations with idempotent_with_key and a durable effect claim may use this policy. Requires the configured header to bind exactly to {{runtime.sink.idempotency_key}}. The provider must deduplicate the same destination, method, key and payload, return the original outcome, and reject changed payloads. Automatic repetition stops when retention from the original durable claim expires. This is not a universal exactly-once guarantee.
      required: [verified, provider_contract_url, key_header, retention_seconds, payload_conflict]
      properties:
        verified:
          type: boolean
          enum: [true]
        provider_contract_url:
          type: string
          format: uri
          description: HTTPS documentation for the verified provider contract; recorded as a reference and never fetched by execution.
        key_header:
          type: string
          minLength: 1
          maxLength: 128
        retention_seconds:
          type: integer
          minimum: 1
          maximum: 604800
          description: Verified minimum provider key retention, from the first durable effect claim, within the same provider account and destination scope.
        payload_conflict:
          type: string
          enum: [reject]

    HTTPAcknowledgement:
      type: object
      additionalProperties: false
      description: Opt-in response acknowledgement. All status and JSON checks must pass before execution succeeds. Failed or missing evidence never proves a write had no effect.
      required: [status_codes, success]
      properties:
        status_codes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: integer
            minimum: 200
            maximum: 299
        success:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/HTTPAcknowledgementCheck'
        empty_fields:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Field names checked recursively throughout the JSON response, including records in objects or arrays. Each occurrence must be null, an empty object or an empty array. Absent fields are allowed; nonempty or scalar values reject acknowledgement.
          items:
            type: string
            minLength: 1
            maxLength: 64

    HTTPAcknowledgementCheck:
      type: object
      additionalProperties: false
      required: [path, equals]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[^.*\[\]{}]+(\.[^.*\[\]{}]+){0,15}$'
          description: Object-only dot path in the JSON response body; maximum 16 segments. Missing fields and non-object traversal fail acknowledgement.
        equals:
          x-go-type: json.RawMessage
          description: Required non-null JSON string, boolean or number. Strings and booleans compare by type and value; numbers require the exact JSON number representation. Templates are not expanded.

    HTTPPagination:
      type: object
      additionalProperties: false
      description: GET-only bounded cursor, page-number or next-link draining. Choose exactly one traversal pattern. The final envelope contains all selected records; traversal is separate from incremental checkpoints.
      required: [records_path, max_pages, timeout_seconds]
      oneOf:
        - required: [cursor_param, next_cursor_path]
          not:
            anyOf:
              - required: [page_param]
              - required: [page_size_param]
              - required: [page_size]
              - required: [total_pages_path]
              - required: [page_number_path]
              - required: [next_link_path]
        - required: [page_param, page_size_param, page_size, total_pages_path, page_number_path]
          not:
            anyOf:
              - required: [cursor_param]
              - required: [next_cursor_path]
              - required: [next_link_path]
        - required: [next_link_path]
          not:
            anyOf:
              - required: [cursor_param]
              - required: [next_cursor_path]
              - required: [page_param]
              - required: [page_size_param]
              - required: [page_size]
              - required: [total_pages_path]
              - required: [page_number_path]
      properties:
        next_link_path:
          type: string
          pattern: '^[^.*\[\]]+(\.[^.*\[\]]+)*$'
          description: Object-only JSON dot path selecting a next URL string. Missing, null or empty ends traversal. Relative links resolve against the last response URL. Links must retain the original origin, contain no user information or fragment, and satisfy destination and OAuth restrictions. Link queries replace authored query parameters; preserve any fixed incremental window in provider links.
        page_param:
          type: string
          minLength: 1
          description: Query parameter for page number; starts at 1 and advances by 1.
        page_size_param:
          type: string
          minLength: 1
          description: Query parameter for the explicitly requested page size; distinct from page_param.
        page_size:
          type: integer
          minimum: 1
          maximum: 10000
        page_number_path:
          type: string
          pattern: '^[^.*\[\]]+(\.[^.*\[\]]+)*$'
          description: Object-only dot path selecting the integer response page number; must equal the requested page, including for an empty result.
        total_pages_path:
          type: string
          pattern: '^[^.*\[\]]+(\.[^.*\[\]]+)*$'
          description: Object-only dot path selecting the nonnegative integer total page count. Zero is valid only on an empty first page. Missing or changing totals fail without partial results.
        cursor_param:
          type: string
          minLength: 1
          description: Query parameter receiving the next opaque string cursor; an existing query_params value seeds the first request.
        records_path:
          type: string
          pattern: '^[^.*\[\]]+(\.[^.*\[\]]+)*$'
          description: Object-only dot path selecting a JSON array, without array indexing or wildcards.
        next_cursor_path:
          type: string
          pattern: '^[^.*\[\]]+(\.[^.*\[\]]+)*$'
          description: Object-only dot path selecting the next string cursor; distinct from an incremental checkpoint.
        max_pages:
          type: integer
          minimum: 1
          maximum: 1000
          description: Fail rather than return partial success when more pages remain.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          description: Whole drain deadline including response reads, retries, and backoff; an earlier execution deadline wins.

    HubSpotFilter:
      type: object
      description: HubSpot CRM search filter
      additionalProperties: false
      properties:
        property_name:
          type: string
          minLength: 1
          description: HubSpot property name to filter on
          example: email
        operator:
          type: string
          description: HubSpot search operator
          enum: [EQ, NEQ, LT, LTE, GT, GTE, BETWEEN, IN, NOT_IN, HAS_PROPERTY, NOT_HAS_PROPERTY, CONTAINS_TOKEN]
          example: EQ
        value:
          description: Primary filter value. Supports {{paramName}} placeholders.
        high_value:
          description: Secondary value used for BETWEEN filters. Supports {{paramName}} placeholders.
        values:
          type: array
          description: Multi-value payload used by IN and NOT_IN filters. Supports {{paramName}} placeholders in values.
          items: {}
      required:
        - property_name
        - operator

    HubSpotFilterGroup:
      type: object
      description: HubSpot CRM search filter group
      additionalProperties: false
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/HubSpotFilter'
      required:
        - filters

    HubSpotStatement:
      type: object
      description: HubSpot CRM read or idempotent upsert operation with {{paramName}} placeholders
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [hubspot]
          description: Data source type discriminator
        object_type:
          type: string
          description: Supported HubSpot CRM object name or discovered custom objectTypeId
          pattern: '^(contacts|companies|deals|2-[1-9][0-9]*)$'
          example: contacts
        operation:
          type: string
          description: HubSpot CRM operation
          enum: [list, search, upsert]
          default: search
          example: search
        properties:
          type: array
          description: Properties to project into the result rows
          items:
            type: string
          example: [firstname, lastname, email]
        query:
          type: string
          description: Optional HubSpot free-text search query
          example: acme
        filter_groups:
          type: array
          description: Optional HubSpot filter groups
          items:
            $ref: '#/components/schemas/HubSpotFilterGroup'
        sorts:
          type: array
          description: Optional HubSpot sort expressions
          items:
            type: string
          example: [-createdate]
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: Maximum rows to return in a page
          example: 100
        after:
          type: string
          description: Pagination cursor used to fetch the next page
          example: "1024"
        id_property:
          type: string
          minLength: 1
          description: HubSpot property with a unique-value constraint used as the stable upsert key
          example: external_customer_id
        property_mapping:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            minLength: 1
          description: Explicit mapping from input row fields to writable HubSpot properties. One target must equal id_property.
          example:
            customer_id: external_customer_id
            email: email
            company: company
        rows:
          description: Braidplane row payload consumed by upsert. Usually {{input}} for pipeline sinks; exact placeholders resolve to native arrays of row objects.
          oneOf:
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
            - type: string
          example: "{{input}}"
      oneOf:
        - title: HubSpotReadStatement
          properties:
            operation:
              type: string
              enum: [list, search]
          required:
            - type
            - object_type
        - title: HubSpotUpsertStatement
          properties:
            operation:
              type: string
              enum: [upsert]
          required:
            - type
            - object_type
            - operation
            - id_property
            - property_mapping
            - rows
      required:
        - type
        - object_type

    FTPStatement:
      type: object
      description: FTP file operation statement with {{paramName}} placeholders
      properties:
        type:
          type: string
          enum: [ftp]
          description: Data source type discriminator
        operation:
          type: string
          description: FTP operation mode
          enum: [read, write]
          default: read
          example: "read"
        path:
          type: string
          minLength: 1
          description: FTP file path with {{paramName}} placeholders
          example: "users-{{date}}.xlsx"
        format:
          type: string
          description: Optional parser override. Use file for native opaque file/blob payloads. Spreadsheet mode supports Excel workbook files and normalizes the selected sheet/range to rows.
          enum: [auto, csv, json, file, spreadsheet]
          default: auto
          example: "spreadsheet"
        delimiter:
          type: string
          minLength: 1
          maxLength: 1
          description: Optional CSV delimiter (single character)
          example: ","
        has_header:
          type: boolean
          description: Optional CSV/spreadsheet header override
          example: true
        sheet:
          type: string
          minLength: 1
          description: Optional spreadsheet sheet name. If omitted for reads, the first workbook sheet is used.
          example: "Orders"
        range:
          type: string
          minLength: 1
          description: Optional spreadsheet A1 range within the selected sheet. Sheet names must be supplied through `sheet`.
          example: "A1:D200"
        content:
          description: Content to write when operation is write. Supports JSON values, arrays, objects, raw CSV string, spreadsheet rows, or raw file content when format is file.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: string
          example:
            - id: 1
              email: "alice@example.com"
        overwrite:
          type: boolean
          description: Whether to overwrite an existing target file when operation is write
          default: true
          example: true
      required:
        - type
        - path

    GitStatement:
      type: object
      description: Git file read/write statement with {{paramName}} placeholders
      properties:
        type:
          type: string
          enum: [git]
          description: Data source type discriminator
        operation:
          type: string
          description: Git file operation
          enum: [read, write]
          default: read
          example: "read"
        path:
          type: string
          minLength: 1
          description: File path within the repository with {{paramName}} placeholders
          example: "data/{{date}}/users.xlsx"
        branch:
          type: string
          description: Optional git ref (branch, tag, or commit SHA) to read from or push to
          example: "main"
        format:
          type: string
          description: Optional file format override. Use file for native opaque file/blob payloads. Spreadsheet mode supports Excel workbook files and normalizes the selected sheet/range to rows.
          enum: [auto, csv, json, file, spreadsheet]
          x-enum-varnames:
            - GitStatementFormatAuto
            - GitStatementFormatCsv
            - GitStatementFormatJson
            - GitStatementFormatFile
            - GitStatementFormatSpreadsheet
          default: auto
          example: "spreadsheet"
        delimiter:
          type: string
          minLength: 1
          maxLength: 1
          description: Optional CSV delimiter (single character); applies when format is CSV
          example: ","
        has_header:
          type: boolean
          description: Optional CSV/spreadsheet header override; if not specified, header presence is auto-detected
          example: true
        sheet:
          type: string
          minLength: 1
          description: Optional spreadsheet sheet name. If omitted for reads, the first workbook sheet is used.
          example: "Orders"
        range:
          type: string
          minLength: 1
          description: Optional spreadsheet A1 range within the selected sheet. Sheet names must be supplied through `sheet`.
          example: "A1:D200"
        content:
          description: Content to write when operation is write. Supports JSON values, arrays of objects, raw CSV string, spreadsheet rows, or raw file content when format is file.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: string
          example:
            - id: 1
              email: "alice@example.com"
            - id: 2
              email: "bob@example.com"
        message:
          type: string
          description: Optional commit message for write operations
          example: "add user records"
      required:
        - type
        - path

    S3Statement:
      type: object
      additionalProperties: false
      description: S3 object read/write statement with {{paramName}} placeholders
      properties:
        type:
          type: string
          enum: [s3]
          x-enum-varnames:
            - S3StatementTypeS3
          description: Data source type discriminator
        operation:
          type: string
          enum: [read, write]
          description: S3 object operation
          example: read
        bucket:
          type: string
          minLength: 1
          description: Optional bucket override. Omit to use the data source bucket.
          example: "braidplane-fixtures"
        key:
          type: string
          minLength: 1
          description: Object key with {{paramName}} placeholders. Relative keys are resolved below the configured prefix.
          example: "exports/users-{{runtime.run.date}}.csv"
        format:
          type: string
          description: Optional file format override. Use file for native opaque file/blob payloads. Spreadsheet mode supports Excel workbook files and normalizes the selected sheet/range to rows.
          enum: [auto, csv, json, file, spreadsheet]
          x-enum-varnames:
            - S3StatementFormatAuto
            - S3StatementFormatCsv
            - S3StatementFormatJson
            - S3StatementFormatFile
            - S3StatementFormatSpreadsheet
          default: auto
          example: csv
        delimiter:
          type: string
          minLength: 1
          maxLength: 1
          description: Optional CSV delimiter (single character)
          example: ","
        has_header:
          type: boolean
          description: Optional CSV/spreadsheet header override
          example: true
        sheet:
          type: string
          minLength: 1
          description: Optional spreadsheet sheet name. If omitted for reads, the first workbook sheet is used.
          example: "Orders"
        range:
          type: string
          minLength: 1
          description: Optional spreadsheet A1 range for reads or start cell for writes. Sheet names must be supplied through `sheet`.
          example: "A1:D200"
        content:
          description: Content to write when operation is write. Pipeline sinks normally bind this through {{input}}.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: string
          example:
            - id: 1
              email: "alice@example.com"
        content_type:
          type: string
          minLength: 1
          description: Optional object Content-Type metadata override
          example: "application/json"
        metadata:
          type: object
          description: Optional user metadata to attach to the written object
          additionalProperties:
            type: string
          example:
            source: braidplane
        overwrite:
          type: boolean
          description: Whether to replace an existing object when operation is write
          default: true
          example: true
      oneOf:
        - title: S3ReadStatement
          properties:
            operation:
              type: string
              enum: [read]
              x-enum-varnames:
                - S3ReadStatementOperationRead
          required:
            - type
            - operation
            - key
        - title: S3WriteStatement
          properties:
            operation:
              type: string
              enum: [write]
              x-enum-varnames:
                - S3WriteStatementOperationWrite
          required:
            - type
            - operation
            - key
            - content
      required:
        - type

    QueryStatement:
      oneOf:
        - $ref: '#/components/schemas/PostgresStatement'
        - $ref: '#/components/schemas/MySQLStatement'
        - $ref: '#/components/schemas/BigQueryStatement'
        - $ref: '#/components/schemas/GoogleWorkspaceStatement'
        - $ref: '#/components/schemas/SnowflakeStatement'
        - $ref: '#/components/schemas/MongoDBStatement'
        - $ref: '#/components/schemas/HTTPStatement'
        - $ref: '#/components/schemas/HubSpotStatement'
        - $ref: '#/components/schemas/FTPStatement'
        - $ref: '#/components/schemas/GitStatement'
        - $ref: '#/components/schemas/S3Statement'
      discriminator:
        propertyName: type
        mapping:
          postgres: '#/components/schemas/PostgresStatement'
          mysql: '#/components/schemas/MySQLStatement'
          bigquery: '#/components/schemas/BigQueryStatement'
          google_workspace: '#/components/schemas/GoogleWorkspaceStatement'
          snowflake: '#/components/schemas/SnowflakeStatement'
          mongodb: '#/components/schemas/MongoDBStatement'
          http: '#/components/schemas/HTTPStatement'
          hubspot: '#/components/schemas/HubSpotStatement'
          ftp: '#/components/schemas/FTPStatement'
          git: '#/components/schemas/GitStatement'
          s3: '#/components/schemas/S3Statement'

    # Query Schemas
    QueryParameter:
      type: object
      description: Parameter definition for a query. Parameters are referenced in query statements using {{paramName}} placeholders (case-sensitive)
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          description: Parameter name (used as {{name}} placeholder in query; case-sensitive matching)
          example: "user_id"
        data_type:
          type: string
          description: Data type of the parameter
          enum: [text, integer, boolean, date, uuid]
          example: "integer"
        is_required:
          type: boolean
          description: Whether this parameter must be provided
          default: false
          example: true
        default_value:
          type: string
          description: Default value for the parameter (JSON-encoded)
          example: "100"
        description:
          type: string
          description: Human-readable description of the parameter
          example: "Maximum number of results to return"
      required:
        - name
        - data_type

    NewQuery:
      type: object
      allOf:
        - not:
            required: [expected_input_contract, expected_input_contract_ref]
        - not:
            required: [output_contract, output_contract_ref]
      description: Request body for creating a new query
      additionalProperties: false
      properties:
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens; if collision occurs, a random suffix is appended)
          allOf:
            - $ref: '#/components/schemas/Slug'
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name of the query
          example: "Get Active Users"
        description:
          type: string
          description: Optional description of what the query does
          example: "Fetch all users who logged in within the last 30 days"
        query_statement:
          allOf:
            - $ref: '#/components/schemas/QueryStatement'
          description: The query to execute with type-specific structure
        parameters:
          type: array
          description: Parameter definitions for the query
          items:
            $ref: '#/components/schemas/QueryParameter'
          default: []
        row_limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: Maximum number of result rows, capped by the server limit. HTTP top-level JSON array elements each count as one row; objects and scalar/text responses count as one document, while null and opaque files have no JSON rows. Exceeding the effective limit fails with EXECUTION_ROW_LIMIT_EXCEEDED; response-byte limits apply independently.
          default: 1000
          example: 1000
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          description: Query execution timeout in seconds
          default: 30
          example: 30
        expected_input_contract:
          description: Optional expected input payload contract for using this saved query as a sink operation.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        expected_input_contract_ref:
          description: Optional exact ODCS sink input requirement, exclusive with expected_input_contract. Resolved in the consuming pipeline project when composition is enabled.
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
        output_contract:
          description: Optional saved query output promise, checked after execution independently of the step promise. Requires contract composition.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        output_contract_ref:
          description: Optional exact ODCS output promise, exclusive with output_contract. Requires contract composition.
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
      required:
        - name
        - query_statement

    UpdateQuery:
      type: object
      allOf:
        - not:
            required: [expected_input_contract, expected_input_contract_ref]
        - not:
            required: [output_contract, output_contract_ref]
      description: Request body for updating a query
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable name of the query
          example: "Get Recent Active Users"
        description:
          type: string
          description: Optional description of what the query does
          example: "Updated description"
        query_statement:
          allOf:
            - $ref: '#/components/schemas/QueryStatement'
          description: The query to execute with type-specific structure
        parameters:
          type: array
          description: Parameter definitions for the query
          items:
            $ref: '#/components/schemas/QueryParameter'
        row_limit:
          type: integer
          minimum: 1
          maximum: 10000
          description: Maximum number of result rows, capped by the server limit. HTTP top-level JSON array elements each count as one row; objects and scalar/text responses count as one document, while null and opaque files have no JSON rows. Exceeding the effective limit fails with EXECUTION_ROW_LIMIT_EXCEEDED; response-byte limits apply independently.
          example: 500
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          description: Query execution timeout in seconds
          example: 15
        expected_input_contract:
          description: Optional expected input payload contract for using this saved query as a sink operation.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        expected_input_contract_ref:
          description: Optional exact ODCS sink input requirement, exclusive with expected_input_contract. Resolved in the consuming pipeline project when composition is enabled.
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
        output_contract:
          description: Optional saved query output promise, checked after execution independently of the step promise. Requires contract composition.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        output_contract_ref:
          description: Optional exact ODCS output promise, exclusive with output_contract. Requires contract composition.
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
      required:
        - name
        - query_statement

    Query:
      type: object
      allOf:
        - not:
            required: [expected_input_contract, expected_input_contract_ref]
        - not:
            required: [output_contract, output_contract_ref]
      description: A saved query definition
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          type: string
          description: Human-readable name of the query
          example: "Get Active Users"
        description:
          type: string
          description: Description of what the query does
          example: "Fetch all users who logged in within the last 30 days"
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        query_statement:
          allOf:
            - $ref: '#/components/schemas/QueryStatement'
          description: The query to execute with type-specific structure
        parameters:
          type: array
          description: Parameter definitions for the query
          items:
            $ref: '#/components/schemas/QueryParameter'
        row_limit:
          type: integer
          description: Maximum number of result rows, capped by the server limit. HTTP top-level JSON array elements each count as one row; objects and scalar/text responses count as one document, while null and opaque files have no JSON rows. Exceeding the effective limit fails with EXECUTION_ROW_LIMIT_EXCEEDED; response-byte limits apply independently.
          example: 1000
        timeout_seconds:
          type: integer
          description: Query execution timeout in seconds
          example: 30
        expected_input_contract:
          description: Optional expected input payload contract for using this saved query as a sink operation.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        expected_input_contract_ref:
          description: Optional exact ODCS sink input requirement, exclusive with expected_input_contract. Resolved in the consuming pipeline project when composition is enabled.
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
        output_contract:
          description: Optional saved query output promise, checked after execution independently of the step promise. Requires contract composition.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        output_contract_ref:
          description: Optional exact ODCS output promise, exclusive with output_contract. Requires contract composition.
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        deleted_at:
          description: Timestamp when the query was soft-deleted. Omitted for active queries.
          allOf:
            - $ref: '#/components/schemas/NullableTimestamp'
      required:
        - slug
        - name
        - data_source_slug
        - query_statement
        - parameters
        - row_limit
        - timeout_seconds
        - created_at
        - updated_at

    QueryListResponse:
      type: object
      description: Paginated list of queries
      properties:
        queries:
          type: array
          items:
            $ref: '#/components/schemas/Query'
        has_more:
          type: boolean
          description: Whether there are more results
          example: false
        next_cursor:
          type: string
          description: Cursor for fetching the next page
          example: "2026-02-15T10:30:00Z_abc123"
        prev_cursor:
          type: string
          description: Cursor for fetching the previous page
          nullable: true
          example: "2026-02-15T10:10:00Z_xyz789"
      required:
        - queries
        - has_more

    QueryExecutionRecord:
      type: object
      description: Query execution record
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        status:
          type: string
          description: Execution status
          example: success
        result:
          $ref: '#/components/schemas/QueryExecutionResult'
        executed_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - status
        - result
        - executed_at

    QueryExecutionListResponse:
      type: object
      description: Paginated list of query executions
      properties:
        executions:
          type: array
          items:
            $ref: '#/components/schemas/QueryExecutionRecord'
        has_more:
          type: boolean
          description: Whether there are more results
          example: false
        next_cursor:
          type: string
          description: Cursor for fetching the next page
          example: "2026-02-15T10:30:00Z_abc123"
        prev_cursor:
          type: string
          description: Cursor for fetching the previous page
          nullable: true
          example: "2026-02-15T10:10:00Z_xyz789"
      required:
        - executions
        - has_more

    QueryExecutionSummary:
      type: object
      description: Latest recorded successful saved-query execution in an organization.
      properties:
        successful_execution:
          allOf:
            - $ref: '#/components/schemas/QueryExecutionIdentity'
          nullable: true
          description: Latest recorded successful saved-query execution, or null when none is recorded.
      required:
        - successful_execution

    QueryExecutionIdentity:
      type: object
      description: Metadata identifying a saved-query execution without its payload or result.
      properties:
        execution_slug:
          $ref: '#/components/schemas/Slug'
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        query_slug:
          $ref: '#/components/schemas/Slug'
        executed_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - execution_slug
        - data_source_slug
        - query_slug
        - executed_at

    UpdatePipeline:
      type: object
      description: Request to propose a change to an existing Git-authored pipeline. Pipeline slug is immutable and defined only by the pipeline_slug path parameter.
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/PipelineSpecUpdate'
      required:
        - spec

    PipelineRef:
      type: object
      description: Persisted pipeline reference metadata.
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        sync_status:
          $ref: '#/components/schemas/PipelineSyncStatus'
        source_path:
          type: string
          description: Source path within the authoritative upstream repository.
          example: pipelines/acme-users-sync.pipeline.yaml
        source_ref:
          type: string
          description: Source Git ref used for the latest applied version.
          example: refs/heads/main
        last_applied_commit:
          type: string
          description: Immutable commit SHA of the latest Git version applied into canonical DB storage.
          example: abc123def456
        current_version_spec_hash:
          type: string
          nullable: true
          description: Immutable hash of the latest persisted version for this pipeline.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
        has_draft:
          type: boolean
          description: Whether the currently authenticated member has a saved draft for this pipeline.
          example: true
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - name
        - sync_status
        - source_path
        - source_ref
        - last_applied_commit
        - has_draft
        - created_at
        - updated_at

    PipelineSyncStatus:
      type: string
      description: Sync status between DB-canonical spec and upstream git representation.
      enum:
        - synced
        - drifted
      example: synced

    Pipeline:
      allOf:
        - $ref: '#/components/schemas/PipelineRef'
        - type: object
          properties:
            spec:
              $ref: '#/components/schemas/PipelineSpec'
            draft:
              allOf:
                - $ref: '#/components/schemas/PipelineDraft'
              nullable: true
              description: Current draft for this pipeline when present.
          required:
            - spec

    PipelineDraft:
      type: object
      description: Member-scoped Git proposal working state. It is never a deployable runtime definition.
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        initiating_member:
          allOf:
            - $ref: '#/components/schemas/Slug'
          description: Authenticated Braidplane member who initiated the current proposal attempt.
        based_on_spec_hash:
          type: string
          nullable: true
          description: Canonical pipeline version hash used as the draft base.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
        draft_state:
          type: string
          description: Local proposal lifecycle state. Provider state is last-known unless proposal_updated_at changes.
          enum: [editing, publish_queued, publish_failed, proposal_open, branch_pushed, proposal_closed, abandoned]
          example: proposal_open
        draft_spec_hash:
          type: string
          description: Hash of the current member-scoped draft specification.
          example: 7d8b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9
        repository:
          type: string
          description: Normalized authoritative repository URL resolved from the owning project backend.
          example: https://github.com/acme/pipelines.git
        proposal_supported:
          type: boolean
          description: Whether the project backend supports publishing a proposal branch, optionally with a provider-native pull or merge request.
        publication_mode:
          type: string
          nullable: true
          enum: [delegated_user, organization_service, repository_credential]
          description: Identity mode immutably selected for the current proposal attempt; repository_credential uses the configured plain Git connection without a provider principal.
        provider_actor:
          type: string
          nullable: true
          description: Safe display identity of the provider principal executing the proposal operation.
        authority_source:
          type: string
          nullable: true
          description: Safe description of the bound provider grant, installation, or service credential.
        base_ref:
          type: string
          nullable: true
          description: Git ref retained as the proposal base.
          example: refs/heads/main
        base_commit_sha:
          type: string
          nullable: true
          description: Exact base commit observed when proposal continuity was established.
          example: 0123456789abcdef0123456789abcdef01234567
        branch_name:
          type: string
          nullable: true
          description: Stable proposal branch retained across safe retries.
          example: braidplane/default/daily-sync/member-a
        branch_head_sha:
          type: string
          nullable: true
          description: Last proposal branch head confirmed by the provider.
          example: fedcba9876543210fedcba9876543210fedcba98
        proposal_provider:
          type: string
          nullable: true
          description: Publication backend; git records a pushed branch without a PR or MR.
          enum: [github, gitlab, git]
          example: github
        proposal_id:
          type: string
          nullable: true
          description: Provider-stable pull or merge request identifier.
          example: "42"
        proposal_url:
          type: string
          format: uri
          nullable: true
          description: Human-visible provider pull or merge request URL.
          example: https://github.com/acme/pipelines/pull/42
        proposal_state:
          type: string
          nullable: true
          description: Last provider proposal state observed by Braidplane.
          enum: [open, closed, merged]
          example: open
        proposal_is_stale:
          type: boolean
          description: Whether saved draft content differs from the last content confirmed on the proposal branch.
        last_proposed_draft_hash:
          type: string
          nullable: true
          description: Draft hash last confirmed on the proposal branch.
        queued_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: Time the latest proposal publish was queued.
        proposal_updated_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: Time Braidplane last confirmed proposal branch/provider metadata; not deployment evidence.
        failed_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: Time the latest proposal attempt was recorded as failed.
        failure_code:
          type: string
          nullable: true
          description: Safe machine-readable failure code populated when draft_state is publish_failed.
          example: provider_unavailable
        failure_message:
          type: string
          nullable: true
          description: Safe operator-facing failure summary populated when draft_state is publish_failed.
          example: Git proposal provider operation failed; retry is available.
        spec:
          $ref: '#/components/schemas/PipelineSpec'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - pipeline_slug
        - initiating_member
        - draft_state
        - draft_spec_hash
        - repository
        - proposal_supported
        - proposal_is_stale
        - spec
        - created_at
        - updated_at

    PipelineDraftResponse:
      type: object
      description: Wrapper response with draft payload.
      properties:
        draft:
          $ref: '#/components/schemas/PipelineDraft'
      required:
        - draft

    SavePipelineDraftRequest:
      type: object
      description: Request to save a draft pipeline definition. Pipeline slug is immutable and defined only by the pipeline_slug path parameter.
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/PipelineSpecUpdate'
        expected_spec_hash:
          type: string
          nullable: true
          description: Canonical pipeline version hash the editor was opened from.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
      required:
        - spec

    PublishPipelineDraftRequest:
      type: object
      description: Request to publish a saved draft as proposal-oriented Git branch work while keeping the materialized canonical artifact unchanged.
      additionalProperties: false
      properties:
        expected_spec_hash:
          type: string
          nullable: true
          description: Canonical pipeline version hash the editor believes is current.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
        force:
          type: boolean
          description: Whether to queue the proposal when the expected materialized version is stale.
          default: false
          example: false

    PipelineDraftConflictResponse:
      type: object
      description: Structured conflict response returned when a draft save or publish uses a stale pipeline version.
      properties:
        error:
          $ref: '#/components/schemas/Error'
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        expected_spec_hash:
          type: string
          nullable: true
          description: Version hash provided by the caller.
          example: stale-hash
        current_spec_hash:
          type: string
          nullable: true
          description: Current canonical pipeline version hash.
          example: current-hash
        draft_based_on_spec_hash:
          type: string
          nullable: true
          description: Version hash currently recorded as the draft base.
          example: draft-base-hash
        draft_preserved:
          type: boolean
          description: Whether the caller's saved draft still exists after the conflict.
          example: true
        can_overwrite:
          type: boolean
          description: Whether the caller may retry with force enabled.
          example: true
      required:
        - error
        - pipeline_slug
        - draft_preserved
        - can_overwrite

    PipelineListResponse:
      type: object
      description: Paginated list of pipelines in a project.
      properties:
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/PipelineRef'
        has_more:
          type: boolean
          description: Whether there are more results
          example: false
        next_cursor:
          type: string
          description: Cursor for fetching the next page
          nullable: true
          example: "2026-02-15T10:30:00Z_acme-users-sync"
        prev_cursor:
          type: string
          description: Cursor for fetching the previous page
          nullable: true
          example: "2026-02-15T10:10:00Z_nightly-export"
      required:
        - pipelines
        - has_more

    PipelineValidationRequest:
      type: object
      description: Request to validate a canonical pipeline spec.
      additionalProperties: false
      properties:
        spec:
          $ref: '#/components/schemas/PipelineSpec'
      required:
        - spec

    PipelineValidationResponse:
      type: object
      description: Structured result for pipeline spec validation.
      properties:
        valid:
          type: boolean
          description: Whether the supplied pipeline spec passed validation.
          example: false
        diagnostics:
          type: array
          description: Diagnostics that can be rendered by the frontend builder or printed by CLI tooling.
          items:
            $ref: '#/components/schemas/PipelineValidationDiagnostic'
        impact_report:
          $ref: '#/components/schemas/DriftImpactReportPreview'
        data_source_ref_sync:
          $ref: '#/components/schemas/PipelineDataSourceRefSyncResult'
      required:
        - valid
        - diagnostics
        - data_source_ref_sync

    PipelineDataSourceRefSyncResult:
      type: object
      description: Logical data-source refs discovered from a pipeline spec and synced before environment binding resolution.
      properties:
        data_source_refs:
          type: array
          description: Pipeline-scoped logical refs seen in the spec and their idempotent sync result.
          items:
            $ref: '#/components/schemas/PipelineDataSourceRefSyncItem'
      required:
        - data_source_refs

    PipelineDataSourceRefSyncItem:
      type: object
      description: One pipeline logical data-source ref sync result.
      properties:
        pipeline_slug:
          description: Pipeline that owns the logical ref.
          allOf:
            - $ref: '#/components/schemas/Slug'
        data_source_ref_slug:
          $ref: '#/components/schemas/Slug'
        data_source_type:
          allOf:
            - $ref: '#/components/schemas/DataSourceType'
          nullable: true
          description: Inferred concrete data-source type, or null when the spec requirement is intentionally left for explicit binding.
        required_capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceRefCapability'
        status:
          $ref: '#/components/schemas/PipelineDataSourceRefSyncStatus'
      required:
        - pipeline_slug
        - data_source_ref_slug
        - data_source_type
        - required_capabilities
        - status

    PipelineDataSourceRefSyncStatus:
      type: string
      description: Idempotent action taken for one logical ref during spec sync.
      enum:
        - created
        - updated
        - unchanged
      x-enum-varnames:
        - PipelineDataSourceRefSyncStatusCreated
        - PipelineDataSourceRefSyncStatusUpdated
        - PipelineDataSourceRefSyncStatusUnchanged

    PipelineValidationResultSource:
      type: string
      description: Product boundary that recorded the validation result.
      enum:
        - unknown
        - api
        - execute
        - revalidate
      x-enum-varnames:
        - PipelineValidationResultSourceUnknown
        - PipelineValidationResultSourceAPI
        - PipelineValidationResultSourceExecute
        - PipelineValidationResultSourceRevalidate
      example: revalidate

    PipelineValidationResultRecord:
      type: object
      description: Durable validation evidence for one pipeline and runtime target. This is not a run record.
      properties:
        validation_slug:
          $ref: '#/components/schemas/Slug'
        project_slug:
          $ref: '#/components/schemas/Slug'
        environment_slug:
          $ref: '#/components/schemas/Slug'
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        source:
          $ref: '#/components/schemas/PipelineValidationResultSource'
        valid:
          type: boolean
          description: Whether the validation attempt passed.
          example: false
        spec_hash:
          type: string
          description: Hash of the validated canonical spec when available.
          nullable: true
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
        diagnostics:
          type: array
          description: Diagnostics returned by the canonical validation path.
          items:
            $ref: '#/components/schemas/PipelineValidationDiagnostic'
        impact_report_slug:
          $ref: '#/components/schemas/NullableSlug'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - validation_slug
        - project_slug
        - environment_slug
        - pipeline_slug
        - source
        - valid
        - spec_hash
        - diagnostics
        - impact_report_slug
        - created_at
        - updated_at

    PipelineValidationResultListResponse:
      type: object
      description: List of non-run pipeline validation results for one runtime target.
      properties:
        validation_results:
          type: array
          items:
            $ref: '#/components/schemas/PipelineValidationResultRecord'
      required:
        - validation_results

    PipelineValidationDiagnostic:
      type: object
      description: >-
        One validation finding for a submitted pipeline spec. ODCS conversion failures
        use ODCS-prefixed converter codes, identify the affected contract-reference
        port in field and step_slug, and include the safe revision structural path
        and corrective instruction in message. No authored values are returned.
      properties:
        severity:
          type: string
          description: Severity of the validation diagnostic.
          enum:
            - error
            - warning
          x-enum-varnames:
            - PipelineValidationDiagnosticSeverityError
            - PipelineValidationDiagnosticSeverityWarning
          example: error
        code:
          type: string
          description: Stable machine-readable diagnostic code.
          example: PIPELINE_INVALID_INPUT
        field:
          type: string
          description: Best-effort canonical field path for the issue.
          example: steps[0].query
        step_slug:
          $ref: '#/components/schemas/NullableSlug'
        data_source_ref:
          description: Logical data-source reference value from the submitted pipeline spec.
          allOf:
            - $ref: '#/components/schemas/NullableSlug'
        data_source_ref_slug:
          description: Logical data-source ref slug involved in the diagnostic, when resolution reached a ref record.
          allOf:
            - $ref: '#/components/schemas/NullableSlug'
        resolved_data_source_slug:
          description: Concrete data-source slug selected by the environment binding, when resolution succeeded before a later validation failure.
          allOf:
            - $ref: '#/components/schemas/NullableSlug'
        environment_slug:
          description: Project environment used for logical data-source ref resolution.
          allOf:
            - $ref: '#/components/schemas/NullableSlug'
        data_source_type:
          description: Actual connector type involved in the diagnostic, when known.
          allOf:
            - $ref: '#/components/schemas/DataSourceType'
        expected_data_source_type:
          description: Expected connector type declared by the logical data-source ref, when known.
          allOf:
            - $ref: '#/components/schemas/DataSourceType'
        required_capability:
          description: Required data-source capability involved in the diagnostic, when known.
          allOf:
            - $ref: '#/components/schemas/DataSourceRefCapability'
        message:
          type: string
          description: Safe validation message suitable for UI and CLI output.
          example: query target must set exactly one of operation_ref or operation_inline
      required:
        - severity
        - code
        - field
        - message

    ProofObservationPolicyInput:
      type: object
      additionalProperties: false
      description: Per-connector cumulative limits in a rolling hour. Each observation is additionally capped at two requests, 1000 fields and one MiB. No retries or chargeable jobs are allowed.
      required: [enabled, timeout_seconds, evidence_ttl_seconds, max_requests, max_rows, max_bytes]
      properties:
        enabled:
          type: boolean
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 30
        evidence_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
        max_requests:
          type: integer
          format: int64
          minimum: 2
          maximum: 120
        max_rows:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
        max_bytes:
          type: integer
          format: int64
          minimum: 1024
          maximum: 67108864

    ProofObservationPolicy:
      type: object
      required: [version, settings]
      properties:
        version:
          type: string
        settings:
          $ref: '#/components/schemas/ProofObservationPolicyInput'

    ProofObservationTarget:
      description: Exact connector-owned metadata resource. Selectors from another variant are rejected. No records or pipeline operations are executed.
      oneOf:
        - $ref: '#/components/schemas/ProofHubSpotTarget'
        - $ref: '#/components/schemas/ProofBigQueryTarget'
        - $ref: '#/components/schemas/ProofWorkspaceTarget'
        - $ref: '#/components/schemas/ProofPostgresTarget'
        - $ref: '#/components/schemas/ProofMySQLTarget'
        - $ref: '#/components/schemas/ProofS3Target'
        - $ref: '#/components/schemas/ProofMongoDBTarget'
      discriminator:
        propertyName: connector_type
        mapping:
          hubspot: '#/components/schemas/ProofHubSpotTarget'
          bigquery: '#/components/schemas/ProofBigQueryTarget'
          google_workspace: '#/components/schemas/ProofWorkspaceTarget'
          postgres: '#/components/schemas/ProofPostgresTarget'
          mysql: '#/components/schemas/ProofMySQLTarget'
          s3: '#/components/schemas/ProofS3Target'
          mongodb: '#/components/schemas/ProofMongoDBTarget'

    ProofHubSpotTarget:
      type: object
      additionalProperties: false
      required: [connector_type, account_id]
      properties:
        connector_type: {type: string, enum: [hubspot]}
        account_id: {type: integer, format: int64, minimum: 1}

    ProofBigQueryTarget:
      type: object
      additionalProperties: false
      required: [connector_type, project_id, dataset_id, table_id]
      properties:
        connector_type: {type: string, enum: [bigquery]}
        project_id: {type: string, minLength: 1, maxLength: 1024}
        dataset_id: {type: string, minLength: 1, maxLength: 1024}
        table_id: {type: string, minLength: 1, maxLength: 1024}

    ProofWorkspaceTarget:
      oneOf:
        - $ref: '#/components/schemas/ProofWorksheetTarget'
        - $ref: '#/components/schemas/ProofDriveFileTarget'
      discriminator:
        propertyName: resource
        mapping:
          spreadsheet: '#/components/schemas/ProofWorksheetTarget'
          file: '#/components/schemas/ProofDriveFileTarget'
          document: '#/components/schemas/ProofDriveFileTarget'
          presentation: '#/components/schemas/ProofDriveFileTarget'

    ProofWorksheetTarget:
      type: object
      additionalProperties: false
      required: [connector_type, resource, spreadsheet_id, worksheet_id, range]
      properties:
        connector_type: {type: string, enum: [google_workspace]}
        resource: {type: string, enum: [spreadsheet]}
        spreadsheet_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
        worksheet_id: {type: integer, minimum: 0}
        range: {type: string, maxLength: 64, pattern: '^[A-Z]+[1-9][0-9]*:[A-Z]+[1-9][0-9]*$'}

    ProofDriveFileTarget:
      type: object
      additionalProperties: false
      required: [connector_type, resource, file_id, operation]
      properties:

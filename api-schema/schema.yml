      description: >
        Points one project environment at an existing immutable pipeline version.
        Promotion between environments is modeled by deploying the same version
        hash to another environment; deployment does not reread source files or
        create a new pipeline version. Deployment rejects disconnected data-flow
        groups, including in previously stored versions, before updating the
        deployment. Independent flows must be split into separate pipelines or
        connected by an actual data dependency.
      tags:
        - pipelines
      operationId: deployPipeline
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
        - $ref: '#/components/parameters/PipelineSlugParam'

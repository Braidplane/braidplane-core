          $ref: '#/components/schemas/Slug'
        trigger_revision:
          type: integer
          format: int64
          minimum: 1
        delivery_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        payload_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload_size_bytes:
          type: integer
          format: int64
          minimum: 0
        received_at:
          $ref: '#/components/schemas/Timestamp'
        verification_status:
          type: string
          enum: [verified]
          x-enum-varnames:
            - PipelineRunSourceWebhookSummaryVerificationStatusVerified
      required:
        - trigger_slug
        - trigger_revision
        - delivery_id
        - payload_digest
        - payload_size_bytes
        - received_at
        - verification_status


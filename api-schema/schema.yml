        step:
          $ref: '#/components/schemas/NullableSlug'
        status:
          type: string
          example: running
      required:
        - at
        - type
        - step
        - status

    PipelineRunStepInputSnapshot:
      type: object
      description: Sanitized step input metadata captured during execution
      properties:
        organization_slug:
          $ref: '#/components/schemas/Slug'
        environment_slug:
          $ref: '#/components/schemas/Slug'
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        operation_type:
          type: string
          example: sql
        operation_ref:
          $ref: '#/components/schemas/Slug'
        uses_inline:
          type: boolean
          description: Indicates whether the step executed an inline operation instead of a referenced operation.
          example: true
        parameter_keys:
          type: array
          items:
            type: string
        event_input:
          $ref: '#/components/schemas/PipelineRunEventInputSummary'
        sink_replay_strategy:
          type: string
          description: Declared sink replay strategy, without an idempotency key or payload.
          enum: [naturally_idempotent, idempotent_with_key, deduplicated_by_ledger, unsafe]
        sink_replay_method:
          type: string
          description: Connector-safe replay mechanism selected by the runtime.
          example: deterministic_external_write
        sink_replay_decision:
          type: string
          description: Durable decision for this delivery attempt or replay.
          example: skip_ledger_succeeded
        sink_delivery_outcome:
          type: string
          description: Outcome at this attempt. failed means dispatch did not begin; unknown means dispatch may have produced effects. confirmed means ledger-confirmed completion; no_op means explicitly skipped empty input.
          enum: [confirmed, failed, unknown, no_op]
        sink_effect_state:
          type: string
          description: Durable side-effect ledger state when a sink was dispatched.
          enum: [in_progress, succeeded]
      required:
        - organization_slug
        - environment_slug
        - parameter_keys

    PipelineRunEventInputSummary:
      type: object
      additionalProperties: false
      description: Safe metadata for one run-scoped JSON input. Raw input values are never exposed.
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/Slug'
        representation:
          type: string
          enum: [json]
          x-enum-varnames:
            - PipelineRunEventInputSummaryRepresentationJson
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1048576
        digest_algorithm:
          type: string
          enum: [sha256]
          x-enum-varnames:
            - PipelineRunEventInputSummaryDigestAlgorithmSha256
        digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
      required:
        - keys
        - representation
        - size_bytes
        - digest_algorithm
        - digest

    PipelineRunStepOutputSnapshot:
      type: object
      description: Connector-agnostic output metadata for a step with typed result details.
      properties:
        result_type:
          type: string
          example: sql
        vendor_type:
          type: string
          example: postgres
        duration_ms:
          type: integer
          format: int64
          example: 120
        operation_type:
          type: string
          description: Connector-native operation captured when available, such as a MongoDB operation or file/object read/write action.
          example: write
        details:
          $ref: '#/components/schemas/PipelineRunStepOutputDetails'
      required:
        - result_type
        - vendor_type
        - duration_ms
        - details

    PipelineRunStepOutputDetails:
      description: Narrow operator metadata persisted in run-detail snapshots. Do not reuse QueryExecutionResult schemas here; query execution responses can include rows, documents, headers, bodies, and other payload values that run details intentionally exclude.
      oneOf:
        - $ref: '#/components/schemas/PipelineRunUnknownOutputDetails'
        - $ref: '#/components/schemas/PipelineRunRowsOutputDetails'
        - $ref: '#/components/schemas/PipelineRunDocumentsOutputDetails'
        - $ref: '#/components/schemas/PipelineRunHTTPResponseOutputDetails'
        - $ref: '#/components/schemas/PipelineRunFileReadOutputDetails'
        - $ref: '#/components/schemas/PipelineRunFileWriteOutputDetails'
      discriminator:
        propertyName: kind
        mapping:
          unknown: '#/components/schemas/PipelineRunUnknownOutputDetails'
          rows: '#/components/schemas/PipelineRunRowsOutputDetails'
          documents: '#/components/schemas/PipelineRunDocumentsOutputDetails'
          http_response: '#/components/schemas/PipelineRunHTTPResponseOutputDetails'
          file_read: '#/components/schemas/PipelineRunFileReadOutputDetails'
          file_write: '#/components/schemas/PipelineRunFileWriteOutputDetails'

    PipelineRunUnknownOutputDetails:
      type: object
      additionalProperties: false
      description: Placeholder details for result types that did not expose safe operator-facing metadata.
      properties:
        kind:
          type: string
          enum: [unknown]
          x-enum-varnames:
            - PipelineRunUnknownOutputDetailsKindUnknown
          example: unknown
      required:
        - kind

    PipelineRunRowsOutputDetails:
      type: object
      additionalProperties: false
      description: Row-shaped output metadata for SQL, HubSpot, and transform results.
      properties:
        kind:
          type: string
          enum: [rows]
          x-enum-varnames:
            - PipelineRunRowsOutputDetailsKindRows
          example: rows
        row_count:
          type: integer
          description: Number of rows produced by a read or transform result.
          example: 10
        column_names:
          type: array
          items:
            type: string
          example: [id, email]
      required:
        - kind
        - row_count

    PipelineRunDocumentsOutputDetails:
      type: object
      additionalProperties: false
      description: Document-shaped output metadata for MongoDB results.
      properties:
        kind:
          type: string
          enum: [documents]
          x-enum-varnames:
            - PipelineRunDocumentsOutputDetailsKindDocuments
          example: documents
        document_count:
          type: integer
          description: Number of documents produced when the connector reports it.
          example: 2
      required:
        - kind

    PipelineRunHTTPResponseOutputDetails:
      type: object
      additionalProperties: false
      description: HTTP response metadata captured without storing sensitive headers or bodies.
      properties:
        kind:
          type: string
          enum: [http_response]
          x-enum-varnames:
            - PipelineRunHTTPResponseOutputDetailsKindHttpResponse
          example: http_response
        status_code:
          type: integer
          description: HTTP response status code.
          example: 200
        file:
          allOf:
            - $ref: '#/components/schemas/FilePayloadMetadata'
          nullable: true
      required:
        - kind
        - status_code

    PipelineRunFileReadOutputDetails:
      type: object
      additionalProperties: false
      description: File or object read metadata captured without raw bytes.
      properties:
        kind:
          type: string
          enum: [file_read]
          x-enum-varnames:
            - PipelineRunFileReadOutputDetailsKindFileRead
          example: file_read
        target_path:
          type: string
          description: Resolved file path, repository path, or object key used for the read.
          example: exports/users-2026-03-21.csv
        row_count:
          type: integer
          description: Number of rows read when the file/object was parsed as structured data.
          example: 2
        column_names:
          type: array
          items:
            type: string
          example: [id, email]
        file:
          allOf:
            - $ref: '#/components/schemas/FilePayloadMetadata'
          nullable: true
      required:
        - kind

    PipelineRunFileWriteOutputDetails:
      type: object
      additionalProperties: false
      description: File or object write metadata captured without raw bytes.
      properties:
        kind:
          type: string
          enum: [file_write]
          x-enum-varnames:
            - PipelineRunFileWriteOutputDetailsKindFileWrite
          example: file_write
        target_path:
          type: string
          description: Resolved file path, repository path, or object key written by the sink.
          example: golden-path/runs/golden-path-run-001/joined-orders.json
        written_rows:
          type: integer
          description: Number of rows serialized by the write, when the connector reports it.
          example: 2
        written_bytes:
          type: integer
          description: Number of bytes written by the file/object sink, when the connector reports it.
          example: 128
        file:
          allOf:
            - $ref: '#/components/schemas/FilePayloadMetadata'
          nullable: true
      required:
        - kind
        - target_path

    PipelineRunStepSnapshot:
      type: object
      description: Sanitized input/output capture for a single pipeline step
      properties:
        step:
          $ref: '#/components/schemas/Slug'
        kind:
          allOf:
            - $ref: '#/components/schemas/PipelineStepKind'
          description: Pipeline step kind captured so run detail can distinguish sink delivery metadata from source reads.
          example: sink
        input:
          $ref: '#/components/schemas/PipelineRunStepInputSnapshot'
        output:
          allOf:
            - $ref: '#/components/schemas/PipelineRunStepOutputSnapshot'
          nullable: true
      required:
        - step
        - input
        - output

    PipelineRunFailureKind:
      type: string
      description: Broad classification of a pipeline run failure.
      enum: [data_source, platform]
      example: data_source

    PipelineRunFailureSide:
      type: string
      description: Which side of the pipeline step produced the failure.
      enum: [source, sink, transform, connector]
      example: sink

    PipelineRunFailureReasonCode:
      type: string
      description: Stable, secret-safe machine-readable cause for launch-path run failures.
      enum:
        - data_source_credentials_failed
        - data_source_permission_denied
        - data_source_connection_failed
        - data_source_timeout
        - source_query_failed
        - source_query_invalid
        - source_schema_reference_invalid
        - resource_scope_rejected
        - source_result_shape_mismatch
        - transform_runtime_failed
        - transform_contract_mismatch
        - sink_contract_mismatch
        - s3_object_write_failed
        - worker_ownership_lost
        - event_input_rejected
        - destination_constraint_violation
      example: s3_object_write_failed

    PipelineRunContractFailureDiagnostic:
      type: object
      description: Sanitized contract validation failure detail for a failed run.
      properties:
        contract_name:
          type: string
          example: users_rows
        field_name:
          type: string
          example: email
        rule:
          type: string
          example: format
        violation_count:
          type: integer
          minimum: 1
          example: 1
        reason_code:
          type: string
          example: contract_field_validation_failed
      required:
        - contract_name
        - field_name
        - rule
        - violation_count
        - reason_code

    PipelineRunFailureContext:
      type: object
      description: Failure pointer for a failed run
      properties:
        step:
          $ref: '#/components/schemas/Slug'
        error:
          type: string
          example: connector timeout
        at:
          $ref: '#/components/schemas/Timestamp'
        kind:
          $ref: '#/components/schemas/PipelineRunFailureKind'
        side:
          $ref: '#/components/schemas/PipelineRunFailureSide'
        reason_code:
          allOf:
            - $ref: '#/components/schemas/PipelineRunFailureReasonCode'
          nullable: true
          description: Stable, bounded failure reason code for operator triage when the runtime can classify the launch-path cause.
        data_source_slug:
          type: string
          nullable: true
          description: Slug of the data source involved in the failure, when applicable.
          example: acme-mysql
        action_hint:
          type: string
          nullable: true
          description: Short user-actionable hint for the failure category.
          example: "Review the sink insert/upsert behavior or remove duplicate rows before retrying."
        contract:
          allOf:
            - $ref: '#/components/schemas/PipelineRunContractFailureDiagnostic'
          nullable: true
      required:
        - step
        - error
        - at
        - kind
        - side
        - reason_code
        - data_source_slug
        - action_hint
        - contract

    PipelineRunStructuralCheck:
      type: object
      description: Attempt-specific structural conformance only. Missing records are missing evidence; delivery and destination verification remain separate.
      properties:
        id: {type: string}
        step: {$ref: '#/components/schemas/Slug'}
        input: {type: string}
        origin: {type: string, enum: [step, operation]}
        phase: {type: string, enum: [event_admission, producer_output, normalized_input, pre_sink]}
        declaration: {type: string}
        projection_digest: {type: string}
        compiled_plan_digest: {type: string}
        deployment_resolution_digest: {type: string}
        attempt_number: {type: integer, minimum: 1}
        evaluator: {type: string}
        policy: {type: string}
        target: {type: string}
        status: {type: string, enum: [passed, failed, skipped, unavailable, error]}
        reason_code: {type: string, enum: [not_reached, evaluating, conformant, empty_batch, contract_violation, payload_unavailable, evaluator_unavailable, evaluation_error, evaluation_interrupted, persistence_failed, downstream_not_reached, retained_output_reused]}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        contract_failure:
          $ref: '#/components/schemas/PipelineRunContractFailureDiagnostic'
        evidence:
          $ref: '#/components/schemas/PipelineRunCheckEvidence'
        evidence_digest: {type: string}
        reused_from_run: {type: string}
        window:
          $ref: '#/components/schemas/PipelineRunCheckWindow'
      required: [id, step, origin, phase, declaration, projection_digest, attempt_number, evaluator, policy, status, reason_code, window]

    PipelineRunCheckEvidence:
      type: object
      properties:
        rows: {type: integer, minimum: 0, maximum: 1000000000}
        duration_ms: {type: integer, format: int64, minimum: 0, maximum: 86400000}
        empty: {type: boolean}
        batch_scope: {type: string, enum: [observed_batch_completeness_unknown, truncated_batch]}
      required: [rows, duration_ms, empty, batch_scope]

    PipelineRunCheckWindow:
      type: object
      description: Links the run source window without exposing cursor values. Batch checks do not establish table completeness or freshness.
      properties:
        source_steps:
          type: array
          description: Source observations in this exact run attempt; cursor values stay in protected runtime storage.
          items: {$ref: '#/components/schemas/Slug'}
        kind: {type: string, enum: [full, incremental, backfill], x-enum-varnames: [PipelineRunCheckWindowFull, PipelineRunCheckWindowIncremental, PipelineRunCheckWindowBackfill]}
        has_lower_bound: {type: boolean}
        has_upper_bound: {type: boolean}
        backfill_series_slug: {type: string}
        backfill_chunk_index: {type: integer}
      required: [kind, has_lower_bound, has_upper_bound, source_steps]

    PipelineRunProgress:
      type: object
      description: Bounded durable facts for one exact run attempt, without payload values.
      required: [metadata, compiled_plan_digest, deployment_resolution_digest, completed_steps, failed_steps, pending_steps, interrupted_steps, current_step, revision, events, after_event, next_after_event, event_count, has_more, worker_observed_at, worker_liveness, observed_at, server_time]
      properties:
        compiled_plan_digest:
          type: string
          nullable: true
          description: Exact compiled artifact selected by this attempt; null before admission or when not recorded.
        deployment_resolution_digest:
          type: string
          nullable: true
          description: Exact recorded deployment selection; null when not recorded. Never resolved from the current deployment.
        completed_steps:
          type: integer
          minimum: 0
        failed_steps:
          type: integer
          minimum: 0
        pending_steps:
          type: integer
          minimum: 0
          description: Planned steps without a recorded start. A metadata step_count of zero means the plan count was not recorded.
        interrupted_steps:
          type: integer
          minimum: 0
          description: Started steps without recorded completion in a terminal attempt; their provider outcome is not inferred.
        current_step:
          $ref: '#/components/schemas/NullableSlug'
        metadata:
          $ref: '#/components/schemas/PipelineRunMetadata'
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Attempt-local boundary revision. Zero means historical revision evidence is unavailable.
        events:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PipelineRunTimelineEvent'
        after_event:
          type: integer
          format: int64
          minimum: 0
        next_after_event:
          type: integer
          format: int64
          minimum: 0
        event_count:
          type: integer
          format: int64
          minimum: 0
        has_more:
          type: boolean
        worker_observed_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: Last durable report from the runtime, normally every five seconds while admitted.
        worker_liveness:
          type: string
          enum: [recent, stale, unavailable, terminal]
          description: Recent means a report within fifteen seconds. Stale means reporting is overdue, not that the worker is dead. Terminal means no further reports are expected.
        observed_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: Latest recorded event, structural check or worker observation, not an inferred completion time.
        server_time:
          $ref: '#/components/schemas/Timestamp'

    PipelineRunTimeline:
      type: object
      description: Structured lifecycle timeline and diagnostics snapshots for a persisted run.
      properties:
        compiled_plan_digest:
          type: string
          description: Exact compiled artifact admitted by this attempt, absent when not recorded.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Attempt-local boundary revision; absent for historical runs without revision evidence.
        worker_observed_at:
          $ref: '#/components/schemas/Timestamp'
        deployment_resolution_digest:
          type: string
          description: Exact recorded deployment resolution for this attempt. Absent for historical runs without a recorded resolution; never resolved from the current deployment.
        structural_checks:
          type: array
          description: Absent for historical runs without check evidence. Never infer a pass from absence.
          items:
            $ref: '#/components/schemas/PipelineRunStructuralCheck'
        run_slug:
          $ref: '#/components/schemas/Slug'
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        environment_slug:
          $ref: '#/components/schemas/Slug'
        status:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
          x-enum-varnames:
            - PipelineRunTimelineStatusQueued
            - PipelineRunTimelineStatusRunning
            - PipelineRunTimelineStatusSucceeded
            - PipelineRunTimelineStatusFailed
            - PipelineRunTimelineStatusCanceled
        replay_of_run_slug:
          $ref: '#/components/schemas/NullableSlug'
        events:
          type: array
          items:
            $ref: '#/components/schemas/PipelineRunTimelineEvent'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/PipelineRunStepSnapshot'
        failure:
          allOf:
            - $ref: '#/components/schemas/PipelineRunFailureContext'
          nullable: true
      required:
        - run_slug
        - pipeline_slug
        - environment_slug
        - status
        - replay_of_run_slug
        - events
        - snapshots
        - failure

    PipelineRunCompositionInspection:
      type: object
      description: Safe projection of the exact stored deployment selected by this run. Contains no operation bodies, document fields, runtime values or credentials. Historical reads preserve the exact recorded selection.
      required: [status, admission_enabled, pins, operations, targets]
      properties:
        admission_enabled:
          type: boolean
          description: Contract composition is supported. This does not change the recorded selection or grant authority.
        status:
          type: string
          enum: [available, not_recorded, unavailable, unsupported]
        template_digest: {type: string}
        compiled_plan_digest: {type: string}
        deployment_resolution_digest: {type: string}
        source_commit: {type: string}
        pins:
          type: array
          items:
            $ref: '#/components/schemas/PipelineContractPinInspection'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/PipelineOperationInspection'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/PipelineTargetInspection'

    PipelineContractPinInspection:
      type: object
      required: [step, port, origin, contract_slug, revision_slug, schema_object_id, digest, compiler_id, representation, root_shape]
      properties:
        step: {$ref: '#/components/schemas/Slug'}
        port: {type: string}
        origin: {type: string, enum: [step, operation]}
        contract_slug: {$ref: '#/components/schemas/Slug'}
        revision_slug: {$ref: '#/components/schemas/Slug'}
        schema_object_id: {type: string}
        digest: {type: string}
        compiler_id: {type: string}
        representation: {type: string}
        root_shape: {type: string}

    PipelineOperationInspection:
      type: object
      required: [step, role, operation_slug, revision, digest]
      properties:
        resource_scope: {$ref: '#/components/schemas/PipelineResourceScopeInspection'}
        step: {$ref: '#/components/schemas/Slug'}
        role: {type: string}
        operation_slug: {$ref: '#/components/schemas/Slug'}
        revision: {type: string}
        digest: {type: string}

    PipelineTargetInspection:
      type: object
      required: [step, role, reference, data_source_slug, binding_revision]
      properties:
        step: {$ref: '#/components/schemas/Slug'}
        role: {type: string}
        reference: {$ref: '#/components/schemas/Slug'}
        data_source_slug: {$ref: '#/components/schemas/Slug'}
        binding_revision: {type: string}

    PipelineRunRecord:
      type: object
      description: Full persisted run diagnostics record
      properties:
        composition:
          $ref: '#/components/schemas/PipelineRunCompositionInspection'
        metadata:
          $ref: '#/components/schemas/PipelineRunMetadata'
        timeline:
          $ref: '#/components/schemas/PipelineRunTimeline'
        incremental_diagnostics:
          $ref: '#/components/schemas/PipelineRunIncrementalDiagnostics'
        proof_link:
          allOf:
            - $ref: '#/components/schemas/ProofLifecycleLink'
          nullable: true
      required:
        - metadata
        - timeline
        - incremental_diagnostics
        - proof_link

    PipelineRunTriggerRetryAttempt:
      type: object
      description: Durable trigger retry decision and execution handoff diagnostic for a pipeline run retry group.
      additionalProperties: false
      properties:
        attempt_slug:
          $ref: '#/components/schemas/Slug'
        status:
          $ref: '#/components/schemas/PipelineTriggerRetryAttemptStatus'
        decision_reason:
          type: string
          nullable: true
          description: Stable reason for queued, skipped, or exhausted retry decisions.
          example: max_attempts_exhausted
        trigger_slug:
          $ref: '#/components/schemas/Slug'
        trigger_revision:
          type: integer
          format: int64
          description: Trigger revision whose retry policy produced this attempt.
          example: 3
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        root_run_slug:
          $ref: '#/components/schemas/Slug'
        retry_of_run_slug:
          $ref: '#/components/schemas/Slug'
        run_slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
          nullable: true
          description: Reserved retry run slug when execution was queued; null for decision-only rows without a retry run.
        attempt_number:
          type: integer
          minimum: 2
          description: Attempt number within the retry group. Initial runs are attempt 1; retry attempt rows start at 2.
          example: 2
        failure_kind:
          allOf:
            - $ref: '#/components/schemas/PipelineTriggerRetryFailureKind'
          nullable: true
          description: Failure category that drove the retry decision; null when no retryable category was recorded.
        source_event_slug:
          $ref: '#/components/schemas/NullableSlug'
        scheduled_at:
          $ref: '#/components/schemas/Timestamp'
        enqueued_at:
          $ref: '#/components/schemas/NullableTimestamp'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        completed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        error_summary:
          type: string
          nullable: true
          description: Terminal retry execution error summary when the retry attempt failed.
          example: connector timeout
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - attempt_slug
        - status
        - decision_reason
        - trigger_slug
        - trigger_revision
        - pipeline_slug
        - root_run_slug
        - retry_of_run_slug
        - attempt_number
        - failure_kind
        - source_event_slug
        - scheduled_at
        - enqueued_at
        - started_at
        - completed_at
        - error_summary
        - created_at
        - updated_at

    PipelineRunTriggerRetryAttemptListResponse:
      type: object
      description: Trigger retry attempts linked to a pipeline run retry group.
      additionalProperties: false
      properties:
        retry_attempts:
          type: array
          items:
            $ref: '#/components/schemas/PipelineRunTriggerRetryAttempt'
      required:
        - retry_attempts

    PipelineRunListResponse:
      type: object
      description: Paginated list of pipeline runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/PipelineRunMetadata'
        has_more:
          type: boolean
          description: Whether there are more results
          example: false
        next_cursor:
          type: string
          description: Cursor for fetching the next page
          nullable: true
          example: "2026-03-16T18:40:00Z_run-abc123"
        prev_cursor:
          type: string
          description: Cursor for fetching the previous page
          nullable: true
          example: "2026-03-16T18:20:00Z_run-xyz789"
      required:
        - runs
        - has_more

    EventActorType:
      type: string
      enum: [unknown, user, api_key, system, external]
      example: user

    EventClass:
      type: string
      enum: [unknown, activity, security_audit]
      x-enum-varnames:
        - EventClassUnknown
        - EventClassActivity
        - EventClassSecurityAudit
      example: activity

    EventEntityType:
      type: string
      enum:
        - unknown
        - organization
        - member
        - member_invitation
        - role
        - api_key
        - data_source
        - data_source_ref
        - data_source_binding
        - project
        - environment
        - project_environment
        - query
        - query_execution
        - pipeline
        - pipeline_deployment
        - pipeline_version
        - pipeline_run
        - pipeline_checkpoint
        - pipeline_trigger
        - notification
      example: pipeline

    AlertPolicySourceKind:
      allOf:
        - $ref: '#/components/schemas/EventEntityType'
      nullable: true
      description: Optional notification source entity selector. Null or omitted matches any source entity. Source refs match the candidate's generic `source_refs.source_ref` value; pipeline-run notifications also expose pipeline slug refs.
      example: pipeline_run

    AlertPolicySourceAction:
      allOf:
        - $ref: '#/components/schemas/EventAction'
      nullable: true
      description: Optional notification source action selector. Null or omitted matches any source action.
      example: execute

    AlertPolicySourceRef:
      type: string
      nullable: true
      minLength: 1
      maxLength: 100
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      description: Optional selector for the selected source entity/action. Null or omitted matches any source ref.
      example: daily-ledger

    EventAction:
      type: string
      enum:
        - unknown
        - create
        - update
        - delete
        - restore
        - purge
        - execute
        - refresh
        - test_connection
        - rotate
        - revoke
        - reconcile
        - deploy
        - publish
        - enable
        - disable
        - accept
        - decline
        - expire
        - auto_accept
        - acknowledge
        - resolve
        - read
        - validate
      example: update

    EventRecord:
      type: object
      description: Durable event record for organization activity or security-audit history.
      properties:
        schema_version:
          type: integer
          format: int32
          minimum: 1
          description: Version of the stable event record contract.
        event_class:
          $ref: '#/components/schemas/EventClass'
        slug:
          $ref: '#/components/schemas/Slug'
        actor_type:
          $ref: '#/components/schemas/EventActorType'
        actor_slug:
          $ref: '#/components/schemas/NullableSlug'
        entity_type:
          $ref: '#/components/schemas/EventEntityType'
        entity_slug:
          $ref: '#/components/schemas/NullableSlug'
        action:
          $ref: '#/components/schemas/EventAction'
        request_id:
          type: string
          nullable: true
          description: Request correlation identifier when the event originated from a correlated request.
        occurred_at:
          $ref: '#/components/schemas/Timestamp'
        metadata:
          type: object
          additionalProperties: true
          description: Sanitized event metadata safe for display.
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - schema_version
        - event_class
        - slug
        - actor_type
        - actor_slug
        - entity_type
        - entity_slug
        - action
        - request_id
        - occurred_at
        - metadata
        - created_at

    EventListResponse:
      type: object
      description: Paginated list of durable event records
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventRecord'
        has_more:
          type: boolean
          description: Whether there are more results
          example: false
        next_cursor:
          type: string
          description: Cursor for fetching the next page
          nullable: true
          example: "2026-03-16T18:40:00Z_event-abc123"
        prev_cursor:
          type: string
          description: Cursor for fetching the previous page
          nullable: true
          example: "2026-03-16T18:20:00Z_event-xyz789"
        event_log_retention_days:
          type: integer
          minimum: 1
          maximum: 30
          nullable: true
          description: Current online event-history retention boundary. Present on security-audit list responses.
      required:
        - events
        - has_more

    NotificationType:
      type: string
      description: Generic notification type

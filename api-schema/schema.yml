          type: string
          description: File name or logical dataset identifier
          example: "users.csv"
        fields:
          type: array
          description: Inferred tabular fields; empty for raw files or unsuccessful inference. Raw file bytes are never included.
          items:
            $ref: '#/components/schemas/FieldInfo'
      required:

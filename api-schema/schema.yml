          description: Enables or disables personal access token management. Bearer PATs cannot change this field.
      required:
        - name

    PersonalAccessToken:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
          example: "Used by the CLI for draft workflows"
        token_prefix:
          type: string
          description: Safe token prefix for identifying the PAT without exposing the secret.
          example: "xto_pat_abcd1234"
        user_slug:
          $ref: '#/components/schemas/Slug'
        can_manage_personal_access_tokens:
          type: boolean
          description: Whether this PAT may manage personal access tokens owned by the same user.
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        revoked_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_used_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - name
        - token_prefix
        - user_slug
        - can_manage_personal_access_tokens
        - expires_at
        - revoked_at
        - last_used_at
        - created_at
        - updated_at

    PersonalAccessTokenWithToken:
      allOf:
        - $ref: '#/components/schemas/PersonalAccessToken'
        - type: object
          properties:
            token:
              type: string
              description: Raw personal access token. Returned only once on create or rotate.
              example: "xto_pat_0123456789abcdef0123456789abcdef"
          required:
            - token

    PersonalAccessTokenListResponse:
      type: object
      description: Paginated list of personal access tokens
      properties:
        personal_access_tokens:
          type: array
          items:
            $ref: '#/components/schemas/PersonalAccessToken'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
      required:
        - personal_access_tokens
        - has_more

    # Data Source Schemas
    DataSourceType:
      type: string
      description: Type of the data source
      enum: [postgres, mysql, bigquery, google_workspace, snowflake, http, hubspot, mongodb, ftp, git, github, gitlab, s3]
      example: "postgres"

    # PostgreSQL-specific schemas
    PostgresConfig:
      type: object
      description: PostgreSQL connection configuration (no credentials)
      additionalProperties: false
      properties:
        host:
          type: string
          description: PostgreSQL server hostname or IP address
          minLength: 1
          example: "db.example.com"
        port:
          type: integer
          description: PostgreSQL server port
          minimum: 1
          maximum: 65535
          default: 5432
          example: 5432
        database:
          type: string
          description: Database name
          minLength: 1
          example: "app_production"
        ssl_mode:
          type: string
          description: PostgreSQL SSL mode; defaults to verify-full. Other modes require the explicit local development plaintext connector policy.
          enum: [disable, allow, prefer, require, verify-ca, verify-full]
          example: "verify-full"
        connect_timeout:
          type: integer
          description: Connection timeout in seconds (optional, defaults to 5)
          minimum: 1
          maximum: 300
          example: 10
        allow_private_hosts:
          type: boolean
          description: Allow connections to private, loopback, or internal network hosts when private host access is available for the deployment.
          example: false
      required:
        - host
        - port
        - database

    PostgresCredentials:
      type: object
      description: PostgreSQL credentials (write-only, never returned)
      additionalProperties: false
      properties:
        username:
          type: string
          description: PostgreSQL username
          minLength: 1
          example: "app_user"
        password:
          type: string
          description: PostgreSQL password
          minLength: 1
          example: "SecurePass123!"
      required:
        - username
        - password

    # MySQL-specific schemas
    MySQLConfig:
      type: object
      description: MySQL connection configuration (no credentials). Uses certificate-verified TLS unless the explicit local development plaintext policy is enabled.
      additionalProperties: false
      properties:
        host:
          type: string
          description: MySQL server hostname or IP address
          minLength: 1
          example: "mysql.example.com"
        port:
          type: integer
          description: MySQL server port
          minimum: 1
          maximum: 65535
          default: 3306
          example: 3306
        database:
          type: string
          description: Database name
          minLength: 1
          example: "analytics"
        connect_timeout:
          type: integer
          description: Connection timeout in seconds (optional, defaults to 5)
          minimum: 1
          maximum: 300
          example: 10
        allow_private_hosts:
          type: boolean
          description: Allow connections to private, loopback, or internal network hosts when private host access is available for the deployment.
          example: false
      required:
        - host
        - port
        - database

    MySQLCredentials:
      type: object
      description: MySQL credentials (write-only, never returned)
      additionalProperties: false
      properties:
        username:
          type: string
          description: MySQL username
          minLength: 1
          example: "analytics_user"
        password:
          type: string
          description: MySQL password; use an empty string only for an account configured without a password
          example: "SecurePass456!"
      required:
        - username
        - password

    SnowflakeConfig:
      type: object
      description: Snowflake warehouse session configuration (no credentials)
      additionalProperties: false
      properties:
        account:
          type: string
          minLength: 1
          description: Snowflake account identifier
          example: "xy12345.eu-central-1"
        warehouse:
          type: string
          description: Snowflake virtual warehouse used to execute queries and writes
          minLength: 1
          example: "BRAIDPLANE_WH"
        database:
          type: string
          description: Snowflake database containing the configured schema
          minLength: 1
          example: "ANALYTICS"
        schema:
          type: string
          description: Snowflake schema used for the session and schema introspection
          minLength: 1
          example: "PUBLIC"
        role:
          type: string
          description: Optional Snowflake role assumed for the session
          minLength: 1
          example: "BRAIDPLANE_READER"
        wif_objects:
          type: array
          minItems: 1
          maxItems: 100
          description: Explicit table privileges for self-service workload identity onboarding and verification. Requires a dedicated role. No future or wildcard grants.
          items:
            $ref: '#/components/schemas/SnowflakeObjectGrant'
        connect_timeout:
          type: integer
          description: Timeout in seconds for session startup and, separately, connection verification. Defaults to 30 seconds.
          minimum: 1
          maximum: 300
          example: 15
      required: [account, warehouse, database, schema]

    SnowflakeObjectGrant:
      type: object
      additionalProperties: false
      description: An existing table in the configured database and schema. Names are exact, case-sensitive identifiers without SQL quoting or qualification.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        privilege:
          type: string
          enum: [SELECT, INSERT]
          description: SELECT for a source; INSERT for an append-only sink.
      required: [name, privilege]

    SnowflakeOnboarding:
      type: object
      additionalProperties: false
      properties:
        identity_state:
          type: string
          enum: [pending, ready, failed, revoking, disabled]
          x-enum-varnames: [SnowflakeOnboardingIdentityStatePending, SnowflakeOnboardingIdentityStateReady, SnowflakeOnboardingIdentityStateFailed, SnowflakeOnboardingIdentityStateRevoking, SnowflakeOnboardingIdentityStateDisabled]
        active:
          type: boolean
          description: True only after identity readiness and stored connection verification.
        issuer:
          type: string
        subject:
          type: string
        audience:
          type: string
        sql:
          type: string
          description: Customer-admin script. Review and execute only in the exact configured account.
        diagnostic:
          type: string
          description: Safe readiness or verification instructions.
      required: [identity_state, active, issuer, subject, audience, sql, diagnostic]

    SnowflakeCredentials:
      description: Snowflake authentication selection. Password authentication is available where provider policy permits. Workload identity requires a saved organization/connection/account identity and customer-configured Snowflake trust; Braidplane provisions the identity asynchronously and returns the saved connection inactive while provisioning is pending; test the stored connection after identity readiness and Snowflake trust are configured. Tokens and token paths are never customer inputs or returned in responses.
      oneOf:
        - $ref: '#/components/schemas/SnowflakePasswordCredentials'
        - $ref: '#/components/schemas/SnowflakeWorkloadIdentityCredentials'
      discriminator:
        propertyName: auth_type
        mapping:
          password: '#/components/schemas/SnowflakePasswordCredentials'
          workload_identity: '#/components/schemas/SnowflakeWorkloadIdentityCredentials'

    SnowflakePasswordCredentials:
      type: object
      description: Snowflake username and password authentication credentials
      additionalProperties: false
      properties:
        auth_type:
          type: string
          enum: [password]
          x-enum-varnames:
            - SnowflakePasswordCredentialsAuthTypePassword
          example: "password"
        username:
          type: string
          minLength: 1
          writeOnly: true
          description: Snowflake username, required only for password authentication
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: Snowflake password
      required: [auth_type, username, password]

    SnowflakeWorkloadIdentityCredentials:
      type: object
      description: Snowflake workload identity authentication. Save the connection and configure Snowflake trust, then test the stored connection after identity reconciliation is ready. Braidplane provisions and revokes the exact identity automatically. Customer identities use short-lived OIDC tokens obtained at runtime; the staging fixture token-file mode is separate.
      additionalProperties: false
      properties:
        auth_type:
          type: string
          enum: [workload_identity]
          x-enum-varnames:
            - SnowflakeWorkloadIdentityCredentialsAuthTypeWorkloadIdentity
          example: "workload_identity"
      required: [auth_type]

    GoogleWorkspaceAccessMode:
      type: string
      enum: [selected_files]
      x-enum-varnames: [GoogleWorkspaceAccessModeSelectedFiles]
      description: Files explicitly authorized to Braidplane or created by it, through drive.file. Braidplane enforces read_only independently of Google permission.

    GoogleWorkspaceConfig:
      type: object
      additionalProperties: false
      description: Connected Google account with managed OAuth credentials. Resource targets belong to statements.
      properties:
        access_mode:
          $ref: '#/components/schemas/GoogleWorkspaceAccessMode'

    GoogleWorkspacePendingInstallConfig:
      type: object
      additionalProperties: false
      properties:
        access_mode:
          $ref: '#/components/schemas/GoogleWorkspaceAccessMode'

    GoogleWorkspacePicker:
      type: object
      additionalProperties: false
      required: [client_id, developer_key, app_id, account_email, expected_revision]
      properties:
        client_id: {type: string}
        developer_key: {type: string, description: Browser API key restricted by API and HTTP referrer; not an OAuth credential.}
        app_id: {type: string, description: Google Cloud project number containing the Workspace OAuth client.}
        account_email: {type: string, description: Account hint; backend file verification remains authoritative.}
        expected_revision: {type: integer, format: int64}

    GoogleWorkspaceVerificationRequest:
      type: object
      additionalProperties: false
      required: [file_ids, expected_revision]
      properties:
        file_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
        expected_revision: {type: integer, format: int64, minimum: 0}
    GoogleWorkspaceFile:
      type: object
      additionalProperties: false
      required: [file_id, name, mime_type]
      properties:
        file_id: {type: string}
        name: {type: string}
        mime_type: {type: string}
        drive_id: {type: string}
        can_download: {type: boolean}
        can_edit: {type: boolean}
        can_add_children: {type: boolean}

    GoogleWorkspaceFileDiscovery:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          items: {$ref: '#/components/schemas/GoogleWorkspaceFile'}
        next_page_token: {type: string}

    GoogleWorkspaceWorksheet:
      type: object
      additionalProperties: false
      description: Grid worksheet metadata. Statements use worksheet_id and resolve the current title at execution.
      properties:
        worksheet_id: {type: integer, minimum: 0}
        title: {type: string}
        row_count: {type: integer, minimum: 1}
        column_count: {type: integer, minimum: 1}
      required: [worksheet_id, title, row_count, column_count]

    GoogleWorkspaceSchemaResponse:
      type: object
      additionalProperties: false
      properties:
        spreadsheet_id: {type: string}
        title: {type: string}
        worksheets:
          type: array
          items:
            $ref: '#/components/schemas/GoogleWorkspaceWorksheet'
      required: [spreadsheet_id, title, worksheets]

    GoogleWorkspaceStatement:
      type: object
      additionalProperties: false
      description: Per-operation spreadsheet or Drive file target. Creates make a new file; updates use a stable file ID. Writes are not automatically retried. Native Docs/Slides support structured read, blank create, literal text replacement and PDF export; filename upsert and arbitrary provider requests are unsupported.
      required: [type, resource, operation]
      properties:
        type: {type: string, enum: [google_workspace]}
        resource: {type: string, enum: [spreadsheet, file, document, presentation]}
        operation: {type: string, enum: [list, read, create, update, export]}
        spreadsheet_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
        worksheet_id: {type: integer, minimum: 0}
        range: {type: string, maxLength: 64, pattern: '^[A-Z]+[1-9][0-9]*:[A-Z]+[1-9][0-9]*$'}
        columns:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        rows:
          oneOf:
            - type: array
              items: {type: object, additionalProperties: true}
            - type: string
              enum: ["{{input}}"]
        file_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
        folder_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
        drive_id: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
        name: {type: string, minLength: 1, maxLength: 256}
        format: {type: string, enum: [json, csv, file]}
        mime_type: {type: string, maxLength: 256}
        page_token: {type: string, maxLength: 2048}
        delimiter: {type: string, maxLength: 1}
        has_header: {type: boolean}
        match_text: {type: string, minLength: 1, maxLength: 10000}
        content:
          description: Inline content or the exact {{input}} binding for pipeline writes.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items: {}
      oneOf:
        - properties:
            resource: {enum: [spreadsheet]}
            operation: {enum: [read]}
          required: [spreadsheet_id, worksheet_id, range]
        - properties:
            resource: {enum: [spreadsheet]}
            operation: {enum: [update]}
          required: [spreadsheet_id, worksheet_id, range, columns, rows]
        - properties:
            resource: {enum: [file]}
            operation: {enum: [list]}
        - properties:
            resource: {enum: [file]}
            operation: {enum: [read]}
          required: [file_id, format]
        - properties:
            resource: {enum: [file]}
            operation: {enum: [create]}
          required: [folder_id, name, format, content]
        - properties:
            resource: {enum: [file]}
            operation: {enum: [update]}
          required: [file_id, format, content]

        - properties:
            resource: {enum: [document, presentation]}
            operation: {enum: [read, export]}
          required: [file_id]
        - properties:
            resource: {enum: [document, presentation]}
            operation: {enum: [create]}
          required: [folder_id, name]
        - properties:
            resource: {enum: [document, presentation]}
            operation: {enum: [update]}
            content: {type: string}
          required: [file_id, match_text, content]

    # BigQuery-specific schemas
    BigQueryConfig:
      type: object
      description: Google BigQuery connection configuration (no credentials)
      additionalProperties: false
      properties:
        project_id:
          type: string
          description: BigQuery project used for jobs, dataset discovery, and writes
          minLength: 1
          example: "analytics-prod"
        location:
          type: string
          description: Optional BigQuery job location, such as US or EU. Set this when datasets are regional or multi-regional so query jobs and paged result reads run in the same location.
          minLength: 1
          example: "EU"
        default_dataset:
          type: string
          description: Optional BigQuery dataset namespace used when an operation omits dataset. Tables live inside datasets, and fully qualified tables use project.dataset.table.
          minLength: 1
          example: "analytics"
        timeout_seconds:
          type: integer
          description: Request/job timeout in seconds, capped by configured execution limits
          minimum: 1
          maximum: 300
          default: 5
          example: 30
        maximum_bytes_billed:
          type: integer
          format: int64
          description: Per-job BigQuery maximumBytesBilled cost guard. BigQuery bills query jobs by bytes processed/scanned, so this caps provider-side query cost rather than response size.
          minimum: 1
          example: 1000000000
      required:
        - project_id

    BigQueryCredentials:
      type: object
      description: BigQuery service-account credentials (write-only, never returned). The service-account JSON is encrypted at rest and never returned in data source responses.
      additionalProperties: false
      properties:
        service_account_json:
          type: string
          description: Google service-account JSON with BigQuery job and table access
          minLength: 1
          example: "{\"type\":\"service_account\",\"project_id\":\"analytics-prod\",\"client_email\":\"braidplane@analytics-prod.iam.gserviceaccount.com\",\"private_key\":\"-----BEGIN PRIVATE KEY-----\\n...\\n-----END PRIVATE KEY-----\\n\",\"token_uri\":\"https://oauth2.googleapis.com/token\"}"
      required:
        - service_account_json

    # HTTP-specific schemas
    HTTPConfig:
      type: object
      description: HTTP endpoint configuration for connection checks
      additionalProperties: false
      properties:
        base_url:
          type: string
          format: uri
          description: Base URL of the HTTP service. Requires HTTPS unless the explicit local development plaintext policy is enabled.
          minLength: 1
          example: "https://api.example.com"
        health_path:
          type: string
          description: Health endpoint path (defaults to /)
          minLength: 1
          example: "/health"
        timeout_seconds:
          type: integer
          description: Request timeout in seconds (optional, defaults to 5)
          minimum: 1
          maximum: 300
          example: 10
        openapi_url:
          type: string
          format: uri
          description: Optional OpenAPI document URL used for schema import
          minLength: 1
          example: "https://api.example.com/openapi.json"
        openapi_fetch_timeout_seconds:
          type: integer
          description: OpenAPI document fetch timeout in seconds (optional, defaults to 10)
          minimum: 1
          maximum: 60
          example: 10
        allow_private_hosts:
          type: boolean
          description: Allow connections to private, loopback, or internal network hosts when private host access is available for the deployment.
          example: false
      required:
        - base_url

    HTTPCredentials:
      type: object
      description: HTTP authentication credentials (write-only, optional)
      additionalProperties: false
      properties:
        oauth:
          $ref: '#/components/schemas/HTTPOAuthCredentials'
        secret_headers:
          type: object
          writeOnly: true
          minProperties: 1
          maxProperties: 8
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
          description: Named secret HTTP headers, encrypted and write-only. Mutually exclusive with all other authentication methods. Header names are case-insensitive and must be unique; transport, cookie and content headers are reserved. Operation headers must not overlap.
        api_key:
          type: string
          writeOnly: true
          minLength: 1
          description: API key stored through the encrypted credential lifecycle; never put it in a saved operation.
        api_key_header:
          type: string
          enum: [X-Api-Key, Authorization]
          description: Required with api_key. X-Api-Key sends the key directly; Authorization sends ApiKey followed by the key. Mutually exclusive with Bearer, Basic and OAuth authentication.
        bearer_token:
          type: string
          description: Bearer token used as Authorization header
          minLength: 1
          example: "token-123"
        username:
          type: string
          description: Username for HTTP basic authentication
          minLength: 1
          example: "api_user"
        password:
          type: string
          description: Password for HTTP basic authentication
          minLength: 1
          example: "secret"

    HTTPOAuthCredentials:
      type: object
      additionalProperties: false
      description: Write-only organization/source-scoped OAuth app settings. Mutually exclusive with bearer and basic credentials. Saving creates a pending source; connect it to acquire a grant. Endpoints and destination must use HTTPS. Settings are never returned.
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
          description: Required for authorization_code. The provider must return the configured issuer in its callback iss parameter.
        token_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        client_id:
          type: string
          minLength: 1
        client_secret:
          type: string
          minLength: 1
          description: Required for client_credentials; optional for public PKCE clients. Replacing settings requires the complete app configuration, including any client secret.
        grant_type:
          type: string
          enum: [authorization_code, client_credentials]
        scopes:
          type: array
          items: {type: string, minLength: 1}
        audience:
          type: string
          minLength: 1
      required: [issuer, token_endpoint, client_id, grant_type]

    # HubSpot-specific schemas
    HubSpotConfig:
      type: object
      description: HubSpot API configuration (base URL is fixed by the provider)
      additionalProperties: false
      properties:
        timeout_seconds:
          type: integer
          description: Request timeout in seconds (optional, defaults to 5)
          minimum: 1
          maximum: 300
          example: 10

    HubSpotCredentials:
      type: object
      description: HubSpot private app credentials (write-only, never returned)
      additionalProperties: false
      properties:
        private_app_token:
          type: string
          description: HubSpot private app token
          minLength: 1
          example: "pat-na1-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      required:
        - private_app_token

    # MongoDB-specific schemas
    MongoDBConfig:
      type: object
      description: MongoDB connection configuration (no credentials). Uses certificate-verified TLS unless the explicit local development plaintext policy is enabled.
      additionalProperties: false
      properties:
        host:
          type: string
          description: MongoDB server hostname or IP address
          minLength: 1
          example: "mongodb.example.com"
        port:
          type: integer
          description: MongoDB server port
          minimum: 1
          maximum: 65535
          default: 27017
          example: 27017
        database:
          type: string
          description: Database name
          minLength: 1
          example: "app_data"
        auth_database:
          type: string
          description: Authentication database (optional, defaults to admin)
          minLength: 1
          example: "admin"
        connect_timeout:
          type: integer
          description: Connection timeout in seconds (optional, defaults to 5)
          minimum: 1
          maximum: 300
          example: 10
        allow_private_hosts:
          type: boolean
          description: Allow connections to private, loopback, or internal network hosts when private host access is available for the deployment.
          example: false
      required:
        - host
        - port
        - database

    MongoDBCredentials:
      type: object
      description: MongoDB credentials (write-only, never returned)
      additionalProperties: false
      properties:
        username:
          type: string
          description: MongoDB username
          minLength: 1
          example: "app_user"
        password:
          type: string
          description: MongoDB password
          minLength: 1
          example: "SecurePass789!"
      required:
        - username
        - password

    # FTP-specific schemas
    FTPConfig:
      type: object
      description: Explicit FTPS connection configuration (no credentials). Control and passive data channels require verified TLS; raw FTP requires the explicit local development plaintext policy.
      additionalProperties: false
      properties:
        host:
          type: string
          description: FTP server hostname or IP address
          minLength: 1
          example: "ftp.example.com"
        port:
          type: integer
          description: FTP server port
          minimum: 1
          maximum: 65535
          default: 21
          example: 21
        base_path:
          type: string
          description: Optional base path used to resolve relative query paths
          example: "/exports"
        connect_timeout:
          type: integer
          description: Connection timeout in seconds (optional, defaults to 5)
          minimum: 1
          maximum: 300
          example: 10
        allow_private_hosts:
          type: boolean
          description: Allow connections to private, loopback, or internal network hosts when private host access is available for the deployment.
          example: false
      required:
        - host
        - port

    FTPCredentials:
      type: object
      description: FTP credentials (write-only, never returned)
      additionalProperties: false
      properties:
        username:
          type: string
          description: FTP username
          minLength: 1
          example: "ftp_user"
        password:
          type: string
          description: FTP password
          minLength: 1
          example: "SecurePass123!"
      required:
        - username
        - password

    # Git-specific schemas
    GitConfig:
      type: object
      description: Git repository connection configuration (no credentials)
      additionalProperties: false
      properties:
        repo_url:
          type: string
          description: Repository URL (HTTPS or SSH only; plain HTTP unsupported)
          minLength: 1
          example: "https://github.com/example/repo.git"
        default_branch:
          type: string
          description: Default branch to use when none is specified
          minLength: 1
          example: "main"
        base_path:
          type: string
          description: Optional base path within the repository for resolving relative file paths
          example: "data"
        allow_private_hosts:
          type: boolean
          description: Allow connections to private, loopback, or internal network hosts when private host access is available for the deployment.
          example: false
      required:
        - repo_url

    ProviderRepository:
      type: object
      description: Stable provider repository identity and safe display metadata. Native Git endpoints and credentials are resolved internally and are never returned here.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable provider repository or project identifier
          minLength: 1
          example: "123456"
        name:
          type: string
          description: Repository display name
          minLength: 1
          example: "pipelines"
        full_name:
          type: string
          description: Provider namespace and repository display path
          minLength: 1
          example: "acme/pipelines"
        web_url:
          type: string
          format: uri
          description: Safe provider web URL for display and navigation
          example: "https://gitlab.com/acme/pipelines"
        default_branch:
          type: string
          nullable: true
          description: Provider-reported default branch when available
          example: "main"
      required:
        - id
        - name
        - full_name
        - web_url

    ProviderGitConfig:
      type: object
      description: Provider-managed Git repository selection. The native Git endpoint is resolved from the stable provider identity at runtime.
      additionalProperties: false
      properties:
        repository:
          $ref: '#/components/schemas/ProviderRepository'
        base_path:
          type: string
          description: Optional base path within the repository for resolving relative file paths
          example: "data"
      required:
        - repository

    GitHubRepositoryConfig:
      type: object
      description: Organization GitHub App repository selection. Repository metadata and clone credentials are resolved by Braidplane.
      additionalProperties: false
      properties:
        repository_id:
          type: string
          minLength: 1
          description: Stable GitHub repository ID from the organization GitHub App connection
          example: "123456"
        base_path:
          type: string
          description: Optional base path within the repository for resolving relative file paths
          example: "data"
      required:
        - repository_id

    GitLabRepositoryConfig:
      type: object
      description: Organization GitLab OAuth repository selection. The project ID is verified with the shared connection before persistence.
      additionalProperties: false
      properties:
        project_id:
          type: string
          minLength: 1
          description: Stable numeric GitLab project ID
          example: "123456"
        base_path:
          type: string
          description: Optional base path within the repository for resolving relative file paths
          example: "data"
      required:
        - project_id

    SelectProviderRepositoryRequest:
      type: object
      additionalProperties: false
      properties:
        repository_id:
          type: string
          minLength: 1
          description: Stable provider repository or project identifier returned by the repository list endpoint
      required:
        - repository_id

    ProviderRepositoryListResponse:
      type: object
      additionalProperties: false
      properties:
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/ProviderRepository'
      required:
        - repositories

    GitCredentials:
      type: object
      description: Git authentication credentials (write-only, never returned)
      additionalProperties: false
      properties:
        auth_type:
          type: string
          description: Authentication method
          enum: [https, ssh]
          example: "ssh"
        username:
          type: string
          description: Username for HTTPS authentication
          minLength: 1
          example: "git-user"
        token:
          type: string
          description: Personal access token for HTTPS authentication (write-only)
          minLength: 1
          example: "ghp_xxxx"
        ssh_private_key:
          type: string
          description: PEM-encoded SSH private key (write-only)
          minLength: 1
          example: "-----BEGIN OPENSSH PRIVATE KEY-----\n..."
        ssh_passphrase:
          type: string
          description: Optional passphrase for the SSH private key (write-only)
          minLength: 1
          example: "keypassphrase"
        ssh_known_hosts:
          type: string
          description: OpenSSH known_hosts entries trusted for SSH host key verification (required for SSH authentication, write-only)
          minLength: 1
          example: "github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA..."
      required:
        - auth_type

    # S3-specific schemas
    S3Config:
      type: object
      description: S3-compatible object store connection configuration (no credentials)
      additionalProperties: false
      properties:
        endpoint:
          type: string
          format: uri
          description: Optional S3-compatible endpoint URL. Omit for AWS S3; custom endpoints require HTTPS unless the explicit local development plaintext policy is enabled.
          minLength: 1
          example: "https://s3.example.com"
        region:
          type: string
          description: AWS region or S3-compatible signing region
          minLength: 1
          example: "us-east-1"
        bucket:
          type: string
          description: Default bucket used by connection tests, introspection, and operations that omit bucket
          minLength: 1
          example: "braidplane-fixtures"
        prefix:
          type: string
          description: Optional key prefix used for schema introspection and relative operation keys
          example: "exports/"
        force_path_style:
          type: boolean
          description: Force path-style addressing for S3-compatible providers such as MinIO
          example: true
        timeout_seconds:
          type: integer
          description: Request timeout in seconds, capped by configured execution limits
          minimum: 1
          maximum: 300
          default: 5
          example: 10
        allow_private_hosts:
          type: boolean
          description: Allow endpoint hosts that resolve to private, loopback, or internal network addresses when private host access is available for the deployment.
          example: false
      required:
        - region
        - bucket

    S3Credentials:
      type: object
      description: Static S3 access key credentials (write-only, never returned). Access keys are encrypted at rest and never returned in data source responses.
      additionalProperties: false
      properties:
        access_key_id:
          type: string
          description: Static S3 access key ID
          writeOnly: true
          minLength: 1
          example: "AKIA..."
        secret_access_key:
          type: string
          description: Static S3 secret access key
          writeOnly: true
          minLength: 1
          example: "secret"
        session_token:
          type: string
          description: Optional temporary-session token
          writeOnly: true
          minLength: 1
          example: "session-token"
      required:
        - access_key_id
        - secret_access_key

    # Polymorphic config and credentials. Request DTOs carry the data source type
    # discriminator at the request object level so config and credentials stay reusable.
    DataSourceConfig:
      anyOf:
        - $ref: '#/components/schemas/PostgresConfig'
        - $ref: '#/components/schemas/MySQLConfig'
        - $ref: '#/components/schemas/BigQueryConfig'
        - $ref: '#/components/schemas/GoogleWorkspaceConfig'
        - $ref: '#/components/schemas/GoogleWorkspacePendingInstallConfig'
        - $ref: '#/components/schemas/SnowflakeConfig'
        - $ref: '#/components/schemas/HTTPConfig'
        - $ref: '#/components/schemas/HubSpotConfig'
        - $ref: '#/components/schemas/MongoDBConfig'
        - $ref: '#/components/schemas/FTPConfig'
        - $ref: '#/components/schemas/GitConfig'
        - $ref: '#/components/schemas/ProviderGitConfig'
        - $ref: '#/components/schemas/S3Config'

    DataSourceCredentials:
      anyOf:
        - $ref: '#/components/schemas/PostgresCredentials'
        - $ref: '#/components/schemas/MySQLCredentials'
        - $ref: '#/components/schemas/BigQueryCredentials'
        - $ref: '#/components/schemas/SnowflakeCredentials'
        - $ref: '#/components/schemas/HTTPCredentials'
        - $ref: '#/components/schemas/HubSpotCredentials'
        - $ref: '#/components/schemas/MongoDBCredentials'
        - $ref: '#/components/schemas/FTPCredentials'
        - $ref: '#/components/schemas/GitCredentials'
        - $ref: '#/components/schemas/S3Credentials'

    ProviderKey:
      type: string
      description: Backend-registered provider key for connector OAuth2 flows
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_-]*$'
      example: "fakecrm"

    CredentialKind:
      type: string
      description: Credential storage and runtime resolution kind
      enum: [static_secret, oauth2_grant]
      example: "oauth2_grant"

    CredentialStatus:
      type: string
      description: Safe credential lifecycle state
      enum: [pending, active, failed, revoked, rotated]
      example: "active"

    OAuthProviderAccount:
      type: object
      description: Safe provider account metadata. This object must not contain credential values, OAuth codes, state values, provider headers, or raw provider responses.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Provider account identifier when the provider exposes one as safe metadata
          example: "acct-123"
        name:
          type: string
          description: Provider account display name when safe to expose
          example: "Acme CRM"
        email:
          type: string
          format: email
          description: Provider account email when safe to expose
          example: "ops@example.com"

    CredentialOAuthMetadata:
      type: object
      description: Safe OAuth2 provider grant metadata
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/ProviderKey'
        scopes:
          type: array
          description: Granted provider scope names
          items:
            type: string
          example: ["contacts.read"]
        account:
          $ref: '#/components/schemas/OAuthProviderAccount'
        access_token_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Access-token expiry. The token value is never returned.
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: Last successful refresh timestamp
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Provider grant revocation timestamp
        failure_code:
          type: string
          nullable: true
          description: Safe machine-readable provider grant failure code
          example: "invalid_grant"
        failure_message:
          type: string
          nullable: true
          description: Safe operator-facing provider grant failure summary
          example: "Provider grant was revoked"
      required:
        - provider
        - scopes

    CredentialMetadata:
      type: object
      description: Safe, non-secret credential metadata only. Plaintext secrets, OAuth codes, state values, token hashes, encrypted blobs, raw provider headers, and raw provider responses are never returned.
      additionalProperties: false
      properties:
        kind:
          $ref: '#/components/schemas/CredentialKind'
        status:
          $ref: '#/components/schemas/CredentialStatus'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        oauth:
          $ref: '#/components/schemas/CredentialOAuthMetadata'
      required:
        - kind
        - status
        - updated_at

    ProviderInstallIntent:
      type: string
      description: Intent carried by a provider connector install
      enum: [create_grant, rotate_grant]
      example: "create_grant"

    StartProviderConnectorInstallRequest:
      type: object
      description: Starts a provider OAuth2 install for an existing data source grant create or rotation flow. The backend-owned provider adapter selects the requested scopes.
      additionalProperties: false
      properties:
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        intent:
          $ref: '#/components/schemas/ProviderInstallIntent'
        access_mode:
          allOf:
            - $ref: '#/components/schemas/GoogleWorkspaceAccessMode'
          description: Explicit Workspace consent mode. Required when reconnecting. Changing it starts fresh consent bound to the source revision; failed consent preserves the current source. Other providers reject this field.
      required:
        - data_source_slug
        - intent

    StartProviderDataSourceInstallRequest:
      type: object
      description: Starts OAuth-first onboarding for a new provider-backed data source.
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug, generated from the name when omitted
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          type: string
          description: Provider-backed data source type
          enum: [hubspot, bigquery, google_workspace]
          x-enum-varnames:
            - StartProviderDataSourceInstallRequestTypeHubspot
            - StartProviderDataSourceInstallRequestTypeBigquery
            - StartProviderDataSourceInstallRequestTypeGoogleWorkspace
        config:
          anyOf:
            - $ref: '#/components/schemas/HubSpotConfig'
            - $ref: '#/components/schemas/BigQueryConfig'
            - $ref: '#/components/schemas/GoogleWorkspacePendingInstallConfig'
        read_only:
          type: boolean
          description: Whether direct mutating operations and pipeline sink use are blocked for this data source.
          default: true
      required:
        - name
        - type
        - config

    ProviderConnectorInstall:
      type: object
      description: Safe provider connector install metadata. The provider authorization URL carries the opaque state value; Braidplane stores only a hash.
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        provider:
          $ref: '#/components/schemas/ProviderKey'
        authorization_url:
          type: string
          format: uri
          description: Provider authorization URL containing an opaque state value
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        intent:
          $ref: '#/components/schemas/ProviderInstallIntent'
        requested_scopes:
          type: array
          items:
            type: string
      required:
        - slug
        - provider
        - authorization_url
        - expires_at
        - intent
        - requested_scopes

    HTTPOAuthConnection:
      type: object
      additionalProperties: false
      properties:
        data_source:
          $ref: '#/components/schemas/DataSource'
        install:
          $ref: '#/components/schemas/ProviderConnectorInstall'
      required: [data_source]

    ProviderDataSourceInstall:
      type: object
      description: Safe OAuth-first onboarding result. The data source is inactive until the callback stores and validates the provider grant.
      additionalProperties: false
      properties:
        data_source:
          $ref: '#/components/schemas/DataSource'
        install:
          $ref: '#/components/schemas/ProviderConnectorInstall'
      required:
        - data_source
        - install

    DataSource:
      type: object
      description: Data source entity. Secret credential material is never returned; the credential property may include safe, non-sensitive metadata. Detail responses may include cache-only schema status and cached schema metadata; retrieving a data source never performs live provider schema introspection.
      properties:
        connection_revision:
          type: integer
          format: int64
          description: Revision bound to selection and consent; changes invalidate old requests.
        organization_gitlab_connection:
          type: boolean
          description: This source explicitly uses the shared organization GitLab OAuth connection.
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        type:
          $ref: '#/components/schemas/DataSourceType'
        config:
          anyOf:
            - $ref: '#/components/schemas/PostgresConfig'
            - $ref: '#/components/schemas/MySQLConfig'
            - $ref: '#/components/schemas/BigQueryConfig'
            - $ref: '#/components/schemas/GoogleWorkspaceConfig'
            - $ref: '#/components/schemas/SnowflakeConfig'
            - $ref: '#/components/schemas/HTTPConfig'
            - $ref: '#/components/schemas/HubSpotConfig'
            - $ref: '#/components/schemas/MongoDBConfig'
            - $ref: '#/components/schemas/FTPConfig'
            - $ref: '#/components/schemas/GitConfig'
            - $ref: '#/components/schemas/ProviderGitConfig'
            - $ref: '#/components/schemas/S3Config'
        is_active:
          type: boolean
          description: Whether the data source is active
          example: true
        read_only:
          type: boolean
          description: Whether the data source is read-only. Read-only data sources cannot be used as pipeline sinks.
          example: false
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        schema_status:
          $ref: '#/components/schemas/DataSourceSchemaStatus'
        schema_diagnostic:
          $ref: '#/components/schemas/DataSourceSchemaDiagnostic'
        schema:
          $ref: '#/components/schemas/IntrospectSchemaResponse'
        last_tested_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last connection test
          example: "2025-10-04T10:30:00Z"
        test_error:
          type: string
          nullable: true
          description: Error message from the last connection test (null if successful)
          example: null
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - organization_gitlab_connection
        - slug
        - name
        - type
        - config
        - is_active
        - read_only
        - schema_status
        - schema
        - created_at
        - updated_at

    DataSourceSchemaStatus:
      type: string
      description: Cache/import state for schema metadata. Detail reads are cache-only; refresh/import operations move the data source toward ready or return failure diagnostics.
      enum:
        - not_imported
        - importing
        - failed
        - ready
      x-enum-varnames:
        - DataSourceSchemaStatusNotImported
        - DataSourceSchemaStatusImporting
        - DataSourceSchemaStatusFailed
        - DataSourceSchemaStatusReady
      example: ready

    DataSourceSchemaDiagnostic:
      type: object
      description: Safe operator-facing schema diagnostic from a failed import or local cached-schema rendering failure. Credentials and secret material must not be included.
      properties:
        code:
          type: string
          description: Stable diagnostic code. Current schema diagnostic codes are documented in DATA_SOURCES.md.
          example: INVALID_OPENAPI
        message:
          type: string
          description: Sanitized failure message safe to show in the API, UI, and CLI.
          example: failed to parse OpenAPI spec
      required:
        - code
        - message

    DataSourceSchemaImportJob:
      type: object
      description: Queue acceptance metadata for a schema import request.
      properties:
        kind:
          type: string
          example: data_source_schema_import
        queue:
          type: string
          example: data_source_schema_import
        state:
          type: string
          description: Schema import enqueue outcome for this request.
          enum:
            - queued
            - skipped_duplicate
          example: queued
      required:
        - kind
        - queue
        - state

    DataSourceSchemaImportResponse:
      type: object
      description: Durable schema import state after a refresh/import request.
      properties:
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        schema_status:
          $ref: '#/components/schemas/DataSourceSchemaStatus'
        schema_diagnostic:
          $ref: '#/components/schemas/DataSourceSchemaDiagnostic'
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Time the current import attempt started, when one exists.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Time the last terminal import state was recorded, when one exists.
        enqueued:
          type: boolean
          description: True when this request inserted or accepted a new queue job; false when an import was already in flight.
          example: true
        job:
          allOf:
            - $ref: '#/components/schemas/DataSourceSchemaImportJob'
          nullable: true
      required:
        - data_source_slug
        - schema_status
        - enqueued

    CreateDataSourceRequest:
      description: Request to create a new data source
      oneOf:
        - $ref: '#/components/schemas/CreatePostgresDataSourceRequest'
        - $ref: '#/components/schemas/CreateMySQLDataSourceRequest'
        - $ref: '#/components/schemas/CreateBigQueryDataSourceRequest'
        - $ref: '#/components/schemas/CreateSnowflakeDataSourceRequest'
        - $ref: '#/components/schemas/CreateHTTPDataSourceRequest'
        - $ref: '#/components/schemas/CreateHubSpotDataSourceRequest'
        - $ref: '#/components/schemas/CreateMongoDBDataSourceRequest'
        - $ref: '#/components/schemas/CreateFTPDataSourceRequest'
        - $ref: '#/components/schemas/CreateGitDataSourceRequest'
        - $ref: '#/components/schemas/CreateGitHubDataSourceRequest'
        - $ref: '#/components/schemas/CreateGitLabDataSourceRequest'
        - $ref: '#/components/schemas/CreateS3DataSourceRequest'
      discriminator:
        propertyName: type
        mapping:
          postgres: '#/components/schemas/CreatePostgresDataSourceRequest'
          mysql: '#/components/schemas/CreateMySQLDataSourceRequest'
          bigquery: '#/components/schemas/CreateBigQueryDataSourceRequest'
          snowflake: '#/components/schemas/CreateSnowflakeDataSourceRequest'
          http: '#/components/schemas/CreateHTTPDataSourceRequest'
          hubspot: '#/components/schemas/CreateHubSpotDataSourceRequest'
          mongodb: '#/components/schemas/CreateMongoDBDataSourceRequest'
          ftp: '#/components/schemas/CreateFTPDataSourceRequest'
          git: '#/components/schemas/CreateGitDataSourceRequest'
          github: '#/components/schemas/CreateGitHubDataSourceRequest'
          gitlab: '#/components/schemas/CreateGitLabDataSourceRequest'
          s3: '#/components/schemas/CreateS3DataSourceRequest'

    TestDataSourceConnectionRequest:
      description: Request to test data source connection without creating a data source
      oneOf:
        - $ref: '#/components/schemas/TestPostgresDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestMySQLDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestBigQueryDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestSnowflakeDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestHTTPDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestHubSpotDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestMongoDBDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestFTPDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestGitDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestGitHubDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestGitLabDataSourceConnectionRequest'
        - $ref: '#/components/schemas/TestS3DataSourceConnectionRequest'
      discriminator:
        propertyName: type
        mapping:
          postgres: '#/components/schemas/TestPostgresDataSourceConnectionRequest'
          mysql: '#/components/schemas/TestMySQLDataSourceConnectionRequest'
          bigquery: '#/components/schemas/TestBigQueryDataSourceConnectionRequest'
          snowflake: '#/components/schemas/TestSnowflakeDataSourceConnectionRequest'
          http: '#/components/schemas/TestHTTPDataSourceConnectionRequest'
          hubspot: '#/components/schemas/TestHubSpotDataSourceConnectionRequest'
          mongodb: '#/components/schemas/TestMongoDBDataSourceConnectionRequest'
          ftp: '#/components/schemas/TestFTPDataSourceConnectionRequest'
          git: '#/components/schemas/TestGitDataSourceConnectionRequest'
          github: '#/components/schemas/TestGitHubDataSourceConnectionRequest'
          gitlab: '#/components/schemas/TestGitLabDataSourceConnectionRequest'
          s3: '#/components/schemas/TestS3DataSourceConnectionRequest'

    CreatePostgresDataSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens; if collision occurs, a random suffix is appended)
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          type: string
          enum: [postgres]
          x-enum-varnames:
            - CreatePostgresDataSourceRequestTypePostgres
        config:
          $ref: '#/components/schemas/PostgresConfig'
        credentials:
          $ref: '#/components/schemas/PostgresCredentials'
        read_only:
          type: boolean
          description: Whether the data source is read-only.
          default: false
      required:
        - name
        - type
        - config
        - credentials

    CreateMySQLDataSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens; if collision occurs, a random suffix is appended)
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          type: string
          enum: [mysql]
          x-enum-varnames:
            - CreateMySQLDataSourceRequestTypeMysql
        config:
          $ref: '#/components/schemas/MySQLConfig'
        credentials:
          $ref: '#/components/schemas/MySQLCredentials'
        read_only:
          type: boolean
          description: Whether the data source is read-only.
          default: false
      required:
        - name
        - type
        - config
        - credentials


    CreateBigQueryDataSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens; if collision occurs, a random suffix is appended)
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          type: string
          enum: [bigquery]
          x-enum-varnames:
            - CreateBigQueryDataSourceRequestTypeBigquery
        config:
          $ref: '#/components/schemas/BigQueryConfig'
        credentials:
          $ref: '#/components/schemas/BigQueryCredentials'
        read_only:
          type: boolean
          description: Whether the data source is read-only.
          default: false
      required:
        - name
        - type
        - config
        - credentials

    CreateSnowflakeDataSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          $ref: '#/components/schemas/Slug'
        type:
          type: string
          enum: [snowflake]
        config:
          $ref: '#/components/schemas/SnowflakeConfig'
        credentials:
          $ref: '#/components/schemas/SnowflakeCredentials'
        read_only:
          type: boolean
          default: false
      required: [name, type, config, credentials]

    CreateHTTPDataSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens; if collision occurs, a random suffix is appended)
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          type: string
          enum: [http]
          x-enum-varnames:
            - CreateHTTPDataSourceRequestTypeHttp
        config:
          $ref: '#/components/schemas/HTTPConfig'
        credentials:
          $ref: '#/components/schemas/HTTPCredentials'
        read_only:
          type: boolean
          description: Whether the data source is read-only.
          default: false
      required:
        - name
        - type
        - config
        - credentials

    CreateHubSpotDataSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens; if collision occurs, a random suffix is appended)
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          type: string
          enum: [hubspot]
          x-enum-varnames:
            - CreateHubSpotDataSourceRequestTypeHubspot
        config:
          $ref: '#/components/schemas/HubSpotConfig'
        credentials:
          $ref: '#/components/schemas/HubSpotCredentials'
        read_only:
          type: boolean
          description: Whether direct mutating operations and pipeline sink use are blocked for this data source.
          default: true
      required:
        - name
        - type
        - config
        - credentials

    CreateMongoDBDataSourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens; if collision occurs, a random suffix is appended)
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          type: string
          enum: [mongodb]
          x-enum-varnames:

    PipelineRunConnected:
      type: object
      additionalProperties: false
      description: Bounded historical causal component, with logical runs grouping automatic attempts. No global execution outcome is inferred. At most 40 nodes and 100 distinct dispatch decisions are returned. Continue deeper inspection from a visible boundary run using this endpoint; very wide branches may still exceed the decision limit. Missing, denied or retained-away context is omitted without hidden identities or totals.
      properties:
        selected_run_slug:
          $ref: '#/components/schemas/Slug'
        nodes:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/PipelineConnectedRun'
        truncated:
          type: boolean
        context_unavailable:
          type: boolean
      required: [selected_run_slug, nodes, truncated, context_unavailable]

    PipelineConnectedRun:
      type: object
      additionalProperties: false
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        completion:
          $ref: '#/components/schemas/PipelineRunCompletion'
      required: [pipeline_slug, completion]

    PipelineRunCompletion:
      type: object
      additionalProperties: false
      description: Historical evidence for the selected run's logical root. A missing closure is not a failed logical root. Empty decisions never imply a fabricated child run.
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        truncated:
          type: boolean
          description: Additional recorded attempts or dispatch decisions exceed the read limit.
        context_unavailable:
          type: boolean
          description: Some causal context cannot be shown; no hidden identities or totals are exposed.
        root_run_slug:
          $ref: '#/components/schemas/Slug'
        closed:
          type: boolean
        waiting_for_retry:
          type: boolean
          description: A persisted queued or running automatic retry exists for this unclosed root.
        outcome:
          type: string
          nullable: true
          description: Persisted logical closure status, absent until closure.
        final_attempt_run_slug:
          $ref: '#/components/schemas/NullableSlug'
        decision_reason:
          type: string
          nullable: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PipelineCompletionAttempt'
        parent:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PipelineCompletionDecision'
        children:
          type: array
          description: Independently authorized persisted dispatch decisions, including decisions without child runs. No inaccessible total is exposed.
          items:
            $ref: '#/components/schemas/PipelineCompletionDecision'
      required: [root_run_slug, closed, waiting_for_retry, outcome, final_attempt_run_slug, decision_reason, attempts, parent, children]

    PipelineCompletionAttempt:
      type: object
      additionalProperties: false
      properties:
        run_slug:
          $ref: '#/components/schemas/Slug'
        attempt_number:
          type: integer
        status:
          type: string
        version_hash:
          type: string
        deployment_revision:
          type: integer
          format: int64
          nullable: true
      required: [run_slug, attempt_number, status, version_hash, deployment_revision]

    PipelineCompletionDecision:
      type: object
      additionalProperties: false
      description: Safe persisted dispatch projection. No internal IDs, authority facts, materialization or runtime values are exposed. Null child_run_slug means no child was accepted.
      properties:
        trigger_slug:
          $ref: '#/components/schemas/Slug'
        trigger_revision:
          type: integer
          format: int64
        upstream_pipeline_slug:
          $ref: '#/components/schemas/Slug'
        root_run_slug:
          $ref: '#/components/schemas/Slug'
        final_attempt_run_slug:
          $ref: '#/components/schemas/Slug'
        downstream_pipeline_slug:
          $ref: '#/components/schemas/Slug'
        condition:
          description: Captured condition, null after historical configuration retention.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PipelineCompletionCondition'
        state:
          type: string
          description: Persisted dispatch state; separate from child outcome.
        decision_reason:
          type: string
          nullable: true
        child_run_slug:
          $ref: '#/components/schemas/NullableSlug'
        child_status:
          type: string
          nullable: true
          description: Initial accepted child attempt status; a failed attempt can still be waiting for retry.
        child_outcome:
          type: string
          nullable: true
          description: Authoritative child logical closure outcome, absent until its root closes.
        selected_version_hash:
          type: string
          nullable: true
        selected_deployment_revision:
          type: integer
          format: int64
          nullable: true
        selected_resolution_digest:
          type: string
          nullable: true
      required: [trigger_slug, trigger_revision, upstream_pipeline_slug, root_run_slug, final_attempt_run_slug, downstream_pipeline_slug, condition, state, decision_reason, child_run_slug, child_status, child_outcome, selected_version_hash, selected_deployment_revision, selected_resolution_digest]


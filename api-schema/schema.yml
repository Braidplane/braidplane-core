    ProofReceiptSlugParam:
      name: receipt_slug
      in: path
      description: Slug of the immutable Proof Preview receipt
      required: true
      schema:
        $ref: '#/components/schemas/Slug'

    RunSlugParam:
      name: run_slug
      in: path
      description: Run slug of the pipeline execution
      required: true
      schema:
        $ref: '#/components/schemas/Slug'

    PipelineVersionIdParam:
      name: spec_hash
      in: path
      description: Full immutable spec hash or unique short hash prefix for the persisted pipeline version spec.
      required: true
      schema:
        type: string
        minLength: 1
        example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8

  schemas:


    NewODCSContract:
      type: object
      additionalProperties: false
      required: [name, odcs_id]
      properties:
        slug:
          description: Optional resource identifier. Generated from name when omitted; ODCS semantic identity is still required.
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        odcs_id:
          type: string
          minLength: 1
          maxLength: 255

    UpdateODCSContract:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum: [active, archived]

    ODCSContract:
      type: object
      additionalProperties: false
      required: [slug, name, odcs_id, status, created_at, updated_at]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        odcs_id:
          type: string
        status:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ODCSRevisionImpactRequest:
      type: object
      additionalProperties: false
      required: [from_revision_slug, to_revision_slug]
      not:
        oneOf:
          - required: [from_plan]
          - required: [to_plan]
      properties:
        from_plan:
          $ref: '#/components/schemas/ODCSImpactPlanSelection'
        to_plan:
          $ref: '#/components/schemas/ODCSImpactPlanSelection'
        from_revision_slug:
          $ref: '#/components/schemas/Slug'
        to_revision_slug:
          $ref: '#/components/schemas/Slug'
      description: Compare immutable catalog revisions. Supply both exact retained plan selections to compare rich executable projections, including mapping and resolution changes. Never selects a plan by authored hash or resolves current bindings.
    ODCSImpactPlanSelection:
      type: object
      additionalProperties: false
      required: [pipeline_slug, digest]
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        projection_input:
          type: integer
          minimum: 0
          maximum: 63
          description: Exact zero-based projection input from retained plan inspection. Required when the requested object has multiple mappings; omission never chooses the first match.
    ODCSRevisionImpact:
      type: object
      required: [project_slug, contract_slug, from_revision_slug, to_revision_slug, from_digest, to_digest, external_consumers, objects, consumers]
      properties:
        from_plan:
          $ref: '#/components/schemas/ODCSImpactPlanSelection'
        to_plan:
          $ref: '#/components/schemas/ODCSImpactPlanSelection'
        project_slug:
          type: string
        contract_slug:
          type: string
        from_revision_slug:
          type: string
        to_revision_slug:
          type: string
        from_digest:
          type: string
        to_digest:
          type: string
        external_consumers:
          type: string
          enum: [unknown]
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ODCSObjectImpact'
        consumers:
          type: array
          items:
            $ref: '#/components/schemas/ODCSConsumerImpact'
    ODCSImpactDiagnostic:
      type: object
      required: [revision_slug, code, path, message]
      properties:
        property_id:
          type: string
        revision_slug:
          type: string
        code:
          type: string
        path:
          type: string
        message:
          type: string
    ODCSObjectImpact:
      type: object
      required: [schema_object_id, comparison, changes, diagnostics]
      properties:
        comparison_scope:
          type: string
          enum: [flat_revision, selected_projection]
          description: A selected projection compares only the exact retained executable selection. It does not establish runtime conformance or delivery.
        schema_object_id:
          type: string
        comparison:
          type: string
          enum: [supported, unsupported]
        changes:
          type: array
          items:
            $ref: '#/components/schemas/ODCSImpactChange'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ODCSImpactDiagnostic'
    ODCSImpactChange:
      type: object
      required: [kind, path, before, after, severity, reason_code]
      properties:
        kind:
          type: string
        path:
          type: string
        before:
          type: string
        after:
          type: string
        severity:
          $ref: '#/components/schemas/DriftImpactReportSeverity'
        reason_code:
          type: string
        before_property_id:
          type: string
        after_property_id:
          type: string
    ODCSConsumerImpact:
      type: object
      required: [project_slug, pipeline_slug, origin, spec_hash, step_slug, port, revision_slug, schema_object_id, comparison, diagnostics]
      properties:
        project_slug:
          type: string
        pipeline_slug:
          type: string
        origin:
          type: string
          enum: [deployed, candidate, draft]
        environment_slug:
          type: string
        spec_hash:
          type: string
        step_slug:
          type: string
        port:
          type: string
          description: Exact attachment identity, including input, output and input:<name> for independent named requirements.
        revision_slug:
          type: string
        schema_object_id:
          type: string
        comparison:
          type: string
          enum: [supported, unsupported, other_revision]
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ODCSImpactDiagnostic'
        impact:
          $ref: '#/components/schemas/DriftImpactReportPreview'
    ODCSArtifactImport:
      type: object
      required: [commit, applied, artifacts]
      properties:
        commit:
          type: string
        applied:
          type: boolean
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ODCSArtifact'
    ODCSArtifact:
      type: object
      required: [contract_slug, revision_slug, path, format, digest, artifact_digest, original, source_repo, commit]
      properties:
        contract_slug:
          type: string
        revision_slug:
          type: string
        path:
          type: string
        format:
          type: string
          enum: [json, yaml]
        digest:
          type: string
        source_repo:
          type: string
        commit:
          type: string
        artifact_digest:
          type: string
        original:
          type: string
          format: byte
    NewODCSRevision:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        slug:
          description: Optional resource identifier. Generated from revision- plus the document version when omitted; collisions receive a random suffix.
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        document:
          type: object
          description: Inert ODCS v3.2.0 document, validated on admission and preserved as canonical JSON under catalog resource and content restrictions. Recording does not establish execution eligibility.
          additionalProperties: true
          x-go-type: json.RawMessage

    ODCSSchemaObject:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string

    ODCSRevisionMetadata:
      type: object
      required: [slug, digest, odcs_version, document_version, declared_status, status, schema_objects, created_at]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        odcs_version:
          type: string
          enum: [v3.2.0]
        document_version:
          type: string
        declared_status:
          type: string
        status:
          type: string
          enum: [recorded]
        schema_objects:
          description: Index of explicitly identified schema objects. ID-less objects remain in the document and cannot be selected by an executable reference.
          type: array
          items:
            $ref: "#/components/schemas/ODCSSchemaObject"
        created_at:
          type: string
          format: date-time

    ODCSRevision:
      allOf:
        - $ref: "#/components/schemas/ODCSRevisionMetadata"
        - type: object
          required: [document]
          properties:
            document:
              type: object
              additionalProperties: true
              x-go-type: json.RawMessage

    ODCSDeclarationCoverage:
      type: object
      additionalProperties: false
      required: [path, state, reason, applicability]
      properties:
        path:
          type: string
          description: Safe positional declaration identity within the exact revision digest; opaque keys are not echoed.
        state:
          type: string
          enum: [enforced, descriptive, unsupported, unresolved]
        reason:
          type: string
        applicability:
          type: string
          enum: [document, selected_port, not_selected]
        runtime_scope:
          type: string
    ODCSRevisionInspection:
      type: object
      additionalProperties: false
      required: [revision, compiler_id, schema_object_id, document_valid, coverage_complete, projection_available, coverage, diagnostics]
      properties:
        revision:
          $ref: '#/components/schemas/ODCSRevision'
        compiler_id:
          type: string
        schema_object_id:
          type: string
        document_valid:
          type: boolean
        coverage_complete:
          type: boolean
        projection_available:
          type: boolean
          description: A complete selected structural mapping exists; does not mean the complete agreement is enforced or any execution passed.
        shape:
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
          description: Supported flat executable shape for this exact revision digest and selected object. Absent when projection is unavailable. Representation and root shape must be selected explicitly on the pipeline reference. This is structural evidence, not full agreement enforcement or destination delivery.
        coverage:
          type: array
          maxItems: 16384
          items:
            $ref: '#/components/schemas/ODCSDeclarationCoverage'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ODCSInspectionDiagnostic'
    ODCSInspectionDiagnostic:
      type: object
      additionalProperties: false
      required: [code, path, message]
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string

    ODCSContractListResponse:
      type: object
      additionalProperties: false
      required: [contracts, has_more]
      properties:
        contracts:
          type: array
          items:
            $ref: "#/components/schemas/ODCSContract"
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true

    ODCSRevisionListResponse:
      type: object
      additionalProperties: false
      required: [revisions, has_more]
      properties:
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/ODCSRevisionMetadata"
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true

    # Reusable property types
    UUID:
      type: string
      format: uuid
      example: "123e4567-e89b-12d3-a456-426614174000"

    Timestamp:
      type: string
      format: date-time
      example: "2025-10-04T12:34:56Z"

    NullableTimestamp:
      allOf:
        - $ref: '#/components/schemas/Timestamp'
      nullable: true

    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 255
      example: "john.doe@example.com"

    Name:
      type: string
      description: Human-readable display name
      minLength: 1
      maxLength: 255
      example: "Acme Corp"

    Role:
      type: string
      description: Global user role. This is distinct from an organization membership role.
      enum: [user, super_admin]
      example: user

    Password:
      type: string
      minLength: 8
      maxLength: 1024
      example: "SecurePass123!"

    NewSession:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
      required:
        - email
        - password

    MFAChallenge:
      type: object
      additionalProperties: false
      properties:
        challenge_token:
          type: string
          description: Opaque one-time token identifying the pending MFA challenge
          minLength: 1
          example: "mfa_1234567890abcdef"
        expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - challenge_token
        - expires_at

    MFAVerification:
      type: object
      additionalProperties: false
      properties:
        challenge_token:
          type: string
          description: Opaque one-time token returned by the login challenge
          minLength: 1
          example: "mfa_1234567890abcdef"
        code:
          type: string
          description: Six-digit email MFA code
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          example: "123456"
      required:
        - challenge_token
        - code

    NewUser:
      type: object
      additionalProperties: false
      properties:
        full_name:
          $ref: '#/components/schemas/Name'
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
      required:
        - full_name
        - email
        - password

    AuthenticatedUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - authentication_version

    User:
      type: object
      properties:
        authentication_version:
          type: integer
          format: int64
          description: Present only in successful password or MFA login responses. The SSR frontend captures this generation for shared session revocation. Omitted from profile responses.
          example: 1
        slug:
          $ref: '#/components/schemas/Slug'
        full_name:
          $ref: '#/components/schemas/Name'
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/Role'
        locale:
          type: string
          description: User's preferred locale (e.g., en-US, pl)
          example: "en-US"
        avatar_url:
          type: string
          format: uri
          description: Optional profile picture URL
          example: "https://example.com/avatar.jpg"
        phone_number:
          type: string
          description: Optional phone number in a user-entered international format
          maxLength: 32
          example: "+48123123123"
        job_title:
          type: string
          description: Optional job title
          maxLength: 120
          example: "Operations Manager"
        timezone:
          type: string
          description: Optional IANA timezone
          maxLength: 64
          example: "Europe/Warsaw"
        mfa_email_enabled:
          type: boolean
          description: Whether email MFA is enabled for email/password sign-in
          example: true
        has_local_password:
          type: boolean
          description: Whether this account has a local password that can be changed after current-password verification
          example: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - full_name
        - email
        - role
        - locale
        - mfa_email_enabled
        - has_local_password
        - created_at
        - updated_at

    Owner:
      type: object
      description: Owner information without role details
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        email:
          $ref: '#/components/schemas/Email'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - email
        - created_at
        - updated_at

    EmailVerificationRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: The verification token sent to the user's email
          example: "abc123-secure-token-xyz789"
      required:
        - token

    PasswordForgotRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
      required:
        - email

    PasswordResetRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          description: Single-use password reset token sent to the user's email
          example: "reset-token-abc123"
        password:
          $ref: '#/components/schemas/Password'
      required:
        - token
        - password

    AccountDeletionConfirmation:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [DELETE MY ACCOUNT]


    AccountDeletionRequest:
      type: object
      additionalProperties: false
      required: [slug, state, requested_at, ownership_required, organization_removal_required]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        state:
          type: string
          enum: [pending, completed, failed, ownership_required]
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        ownership_required:
          type: array
          items:
            $ref: '#/components/schemas/Slug'
        organization_removal_required:
          description: Organizations where the requester is the only active member; explicitly remove them before deleting the account.
          type: array
          items:
            $ref: '#/components/schemas/Slug'

    UpdateUserPassword:
      type: object
      additionalProperties: false
      properties:
        current_password:
          $ref: '#/components/schemas/Password'
        new_password:
          $ref: '#/components/schemas/Password'
      required:
        - current_password
        - new_password

    ResendVerificationEmailRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
      required:
        - email

    UpdateUserProfile:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        full_name:
          $ref: '#/components/schemas/Name'
        locale:
          type: string
          description: User's preferred locale (BCP 47 language tag)
          example: "pl"
        avatar_url:
          type: string
          format: uri
          description: Optional profile picture URL. Send an empty string to clear it.
          example: "https://example.com/avatar.jpg"
        phone_number:
          type: string
          description: Optional phone number. Send an empty string to clear it.
          maxLength: 32
          example: "+48123123123"
        job_title:
          type: string
          description: Optional job title. Send an empty string to clear it.
          maxLength: 120
          example: "Operations Manager"
        timezone:
          type: string
          description: Optional IANA timezone. Send an empty string to clear it.
          maxLength: 64
          example: "Europe/Warsaw"
        mfa_email_enabled:
          type: boolean
          description: Enables email MFA for email/password sign-in. Requires a session authenticated by password or MFA within the last five minutes; sign in again if proof has expired.

    # Organization Schemas

    Slug:
      type: string
      description: URL-friendly identifier
      minLength: 1
      maxLength: 100
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: "acme-corp"

    NullableSlug:
      allOf:
        - $ref: '#/components/schemas/Slug'
      nullable: true

    MemberRole:
      type: string
      description: Slug of the member's role within the organization. Default roles are 'admin' (full access) and 'viewer' (read-only).
      minLength: 1
      maxLength: 100
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      example: "viewer"

    NewOrganization:
      type: object
      description: Request to create a new organization
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided using lowercase and hyphens)
          allOf:
            - $ref: '#/components/schemas/Slug'
      required:
        - name

    Organization:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          $ref: '#/components/schemas/Slug'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - name
        - slug
        - created_at
        - updated_at

    GitHubAppInstallStart:
      type: object
      additionalProperties: false
      properties:
        authorization_url:
          type: string
          format: uri
      required: [authorization_url]

    GitHubAppExistingInstallationAuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        account_login:
          type: string
          minLength: 1
          maxLength: 39
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
      required: [account_login]

    GitHubAppRepository:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        full_name: { type: string, minLength: 3, maxLength: 256 }
        owner_login: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 100 }
      required: [id, full_name, owner_login, name]

    GitHubAppConnection:
      type: object
      additionalProperties: false
      properties:
        repository_setup:
          $ref: '#/components/schemas/ProjectRepositorySetup'
        organization_slug:
          $ref: '#/components/schemas/Slug'
        installation_id: { type: integer, format: int64, minimum: 1 }
        account_id: { type: integer, format: int64, minimum: 1 }
        account_login: { type: string, minLength: 1, maxLength: 100 }
        account_type: { type: string, minLength: 1, maxLength: 50 }
        repository_selection: { type: string, enum: [all, selected] }
        repositories:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/GitHubAppRepository'
        suspended_at:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          nullable: true
        deleted_at:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          nullable: true
      required: [organization_slug, installation_id, account_id, account_login, account_type, repository_selection, repositories]

    OrganizationWithRole:
      type: object
      description: Organization with the current user's membership role
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          properties:
            member_role:
              $ref: '#/components/schemas/MemberRole'
          required:
            - member_role

    UpdateOrganization:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
      required:
        - name

    OrganizationRetentionPolicy:
      type: object
      description: Organization-owned runtime retention policy. Project and pipeline overrides are not supported.
      additionalProperties: false
      properties:
        query_execution_retention_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of days to retain saved query executions.
        replay_checkpoint_retention_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of days to retain replay checkpoints.
        run_history_retention_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of days to retain completed pipeline runs.
        event_log_retention_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of days to retain durable event logs.
      required:
        - query_execution_retention_days
        - replay_checkpoint_retention_days
        - run_history_retention_days
        - event_log_retention_days

    OrganizationRetentionSchedule:
      type: object
      description: Product-owned retention maintenance schedule.
      additionalProperties: false
      properties:
        cadence:
          type: string
          enum: [daily]
          x-enum-varnames:
            - OrganizationRetentionScheduleCadenceDaily
        timezone:
          type: string
          enum: [UTC]
          x-enum-varnames:
            - OrganizationRetentionScheduleTimezoneUTC
        next_run_at:
          type: string
          format: date-time
      required:
        - cadence
        - timezone
        - next_run_at

    OrganizationRetentionOutcome:
      type: object
      description: Product-level records removed by one retention maintenance attempt.
      additionalProperties: false
      properties:
        query_executions_deleted:
          type: integer
          format: int64
          minimum: 0
        replay_checkpoints_deleted:
          type: integer
          format: int64
          minimum: 0
        pipeline_runs_deleted:
          type: integer
          format: int64
          minimum: 0
        event_logs_deleted:
          type: integer
          format: int64
          minimum: 0
      required:
        - query_executions_deleted
        - replay_checkpoints_deleted
        - pipeline_runs_deleted
        - event_logs_deleted

    OrganizationRetentionRun:
      type: object
      description: Sanitized tenant-facing outcome of a system-managed retention maintenance attempt.
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        status:
          type: string
          enum: [succeeded, failed]
          x-enum-varnames:
            - OrganizationRetentionRunStatusSucceeded
            - OrganizationRetentionRunStatusFailed
        attempt:
          type: integer
          minimum: 1
        policy_snapshot:
          allOf:
            - $ref: '#/components/schemas/OrganizationRetentionPolicy'
          nullable: true
        outcome:
          $ref: '#/components/schemas/OrganizationRetentionOutcome'
        failure_code:
          type: string
          enum: [maintenance_failed, invalid_policy]
          x-enum-varnames:
            - OrganizationRetentionRunFailureCodeMaintenanceFailed
            - OrganizationRetentionRunFailureCodeInvalidPolicy
          nullable: true
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      required:
        - slug
        - status
        - attempt
        - policy_snapshot
        - outcome
        - failure_code
        - started_at
        - completed_at

    OrganizationRetentionRunList:
      type: object
      description: Recent system-managed retention maintenance history for one organization.
      additionalProperties: false
      properties:
        schedule:
          $ref: '#/components/schemas/OrganizationRetentionSchedule'
        runs:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationRetentionRun'
      required:
        - schedule
        - runs

    # Project Schemas

    NewProject:
      type: object
      description: Request to create a new project
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided)
          allOf:
            - $ref: '#/components/schemas/Slug'
      required:
        - name

    ProjectPipelineBackend:
      type: object
      description: Project-owned git backend identity for Git-authored pipelines.
      additionalProperties: false
      properties:
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        repo:
          type: string
          description: Normalized remote repository URL resolved from the configured git-compatible data source.
          example: https://github.com/Braidplane/acme-pipelines.git
        tracked_branch:
          type: string
          description: Writable tracked branch used for reconcile, publish, transfer, and delete routing.
          minLength: 1
          maxLength: 255
          example: main
        pipeline_dir:
          type: string
          description: Repository-relative directory containing canonical pipeline specs.
          minLength: 1
          maxLength: 1024
          example: pipelines
        first_commit_sha:
          type: string
          nullable: true
          description: Exact repository commit first validated when this backend was registered.
          minLength: 7
          maxLength: 64
      required:
        - data_source_slug
        - repo
        - tracked_branch
        - pipeline_dir
        - first_commit_sha

    SetProjectPipelineBackendCreateWithoutOwner:
      type: object
      description: Validation-only shape rejected because repository creation requires provider_owner.
      properties:
        mode:
          type: string
          enum: [create_from_template]
      required:
        - mode
      not:
        required:
          - provider_owner

    SetProjectPipelineBackendCreateWithoutRepositoryName:
      type: object
      description: Validation-only shape rejected because repository creation requires repository_name.
      properties:
        mode:
          type: string
          enum: [create_from_template]
      required:
        - mode
      not:
        required:
          - repository_name

    CreateProjectRepositoryRequest:
      type: object
      additionalProperties: false
      required: [provider, owner, repository_name, create_private_repository]
      properties:
        provider:
          type: string
          enum: [github, gitlab]
        owner:
          type: string
          description: Customer-owned user or nested group namespace.
          minLength: 1
          maxLength: 255
        repository_name:
          type: string
          minLength: 1
          maxLength: 100
        tracked_branch:
          type: string
          default: main
          minLength: 1
          maxLength: 255
        pipeline_dir:
          type: string
          default: pipelines
          minLength: 1
          maxLength: 1024
        create_private_repository:
          type: boolean
          enum: [true]
          description: Explicit consent to create and initialize this private repository.

    ProjectRepositoryGitHubAuthorization:
      type: object
      additionalProperties: false
      required: [state, code, installation_id]
      properties:
        state: { type: string, minLength: 32, maxLength: 256 }
        code: { type: string, minLength: 1, maxLength: 1024 }
        installation_id: { type: integer, format: int64, minimum: 1 }

    AbandonProjectRepositorySetupRequest:
      type: object
      additionalProperties: false
      required: [setup_slug, preserve_resources]
      properties:
        setup_slug:
          $ref: '#/components/schemas/Slug'
        preserve_resources:
          type: boolean
          enum: [true]
          description: Acknowledge that existing or partially created resources remain in the customer's account.

    PipelineCreationProposalListResponse:
      type: object
      required: [pipeline_creations, has_more]
      properties:
        pipeline_creations:
          type: array
          items: { $ref: '#/components/schemas/PipelineCreationProposal' }
        has_more: { type: boolean }
        next_cursor: { $ref: '#/components/schemas/Slug' }

    PipelineCreationProposal:
      type: object
      required: [slug, project_slug, pipeline_slug, initiating_member, source_path, spec_hash, spec, status]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        project_slug: { $ref: '#/components/schemas/Slug' }
        pipeline_slug: { $ref: '#/components/schemas/Slug' }
        initiating_member: { $ref: '#/components/schemas/Slug' }
        source_path: { type: string }
        spec_hash:
          type: string
          description: Hash of the normalized proposed definition; not a canonical version identity.
        spec:
          allOf:
            - $ref: '#/components/schemas/PipelineSpec'
          description: Immutable proposed definition for review and exact retry; not a canonical imported version.
        status:
          type: string
          enum: [publish_queued, proposal_open, branch_pushed, publish_failed]
          x-enum-varnames: [CreationPublishQueued, CreationProposalOpen, CreationBranchPushed, CreationPublishFailed]
          description: Last recorded publication status, not live provider state or deployment readiness.
        failure_code: { type: string }
        proposal_url: { type: string }
        proposal_provider: { type: string }
        proposal_state: { type: string }
        branch_name: { type: string }
        branch_head_sha: { type: string }

    ProjectRepositorySetup:
      type: object
      required: [slug, project_slug, request, status, data_source_slug]
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        project_slug:
          $ref: '#/components/schemas/Slug'
        request:
          $ref: '#/components/schemas/CreateProjectRepositoryRequest'
        status:
          type: string
          enum: [pending, repository_created, source_created, attached]
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        repository_id:
          type: string
          description: Immutable provider identity, never a Braidplane database ID.
        repository_url:
          type: string
        first_commit_sha:
          type: string
          description: Initial complete template head, which may follow multiple provider bootstrap commits.
        authorization_url:
          type: string
          description: Temporary provider authorization link returned only when starting consent.
        failure_code:
          type: string
          description: Last incomplete stage. source_test_required means test the saved data source connection successfully before resubmitting the same request; other stages may require correcting provider access.
        abandoned_at:
          type: string
          format: date-time
          readOnly: true
          description: Present only for an archived attempt; it cannot resume or authorize provider work.

    SetProjectPipelineBackendRequest:
      type: object
      description: |
        Request to attach a project's git pipeline backend.
        A managed GitHub App attachment also binds the verified installation's publishing identity
        as a project-scoped organization service proposal authority.
      additionalProperties: false
      not:
        anyOf:
          - $ref: '#/components/schemas/SetProjectPipelineBackendCreateWithoutOwner'
          - $ref: '#/components/schemas/SetProjectPipelineBackendCreateWithoutRepositoryName'
      properties:
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        tracked_branch:
          type: string
          description: Writable tracked branch for the project backend.
          minLength: 1
          maxLength: 255
          example: main
        pipeline_dir:
          type: string
          description: Repository-relative directory containing canonical pipeline specs.
          minLength: 1
          maxLength: 1024
          example: pipelines
        provider_owner:
          type: string
          description: Provider user or organization that will own a newly created repository.
          minLength: 1
          maxLength: 255
        repository_name:
          type: string
          description: Name of a private repository to create from the current Braidplane template.
          minLength: 1
          maxLength: 100
        mode:
          type: string
          description: |
            Required backend attach mode.
            `adopt_existing` makes the target repo/branch authoritative and imports the pipeline files already present there.
            `create_from_template` creates a private repository through an unmanaged GitHub connection and then imports its exact first commit.
            Managed GitHub App sources use `adopt_existing` because each source is bound to one selected repository.
          enum:
            - adopt_existing
            - create_from_template
          example: adopt_existing
      required:
        - data_source_slug
        - tracked_branch
        - pipeline_dir
        - mode

    Project:
      type: object
      description: Organization-scoped workspace for future apps and pipelines
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        pipeline_backend:
          allOf:
            - $ref: '#/components/schemas/ProjectPipelineBackend'
          nullable: true
          description: Project-owned git backend identity, or null when unset.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - name
        - pipeline_backend
        - created_at
        - updated_at

    UpdateProject:
      type: object
      description: Request to update a project
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
      required:
        - name


    # Environment Schemas

    EnvironmentDescription:
      type: string
      description: Optional environment description for operators.
      maxLength: 2000
      example: "Protected production runtime target"

    EnvironmentColor:
      type: string
      description: Controlled visual palette color for runtime environment identity.
      enum:
        - blue
        - amber
        - red
        - green
        - purple
        - gray
      x-enum-varnames:
        - EnvironmentColorBlue
        - EnvironmentColorAmber
        - EnvironmentColorRed
        - EnvironmentColorGreen
        - EnvironmentColorPurple
        - EnvironmentColorGray
      example: "blue"

    NewEnvironment:
      type: object
      description: Request to create a new runtime environment catalog entry.
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided)
          allOf:
            - $ref: '#/components/schemas/Slug'
        description:
          $ref: '#/components/schemas/EnvironmentDescription'
        color:
          $ref: '#/components/schemas/EnvironmentColor'
        protected:
          type: boolean
          description: Whether this catalog environment requires explicit confirmation before protected runtime-changing operations.
          default: false
          example: true
      required:
        - name
        - color

    UpdateEnvironment:
      type: object
      description: Request to update runtime environment catalog metadata.
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/EnvironmentDescription'
        color:
          $ref: '#/components/schemas/EnvironmentColor'
        protected:
          type: boolean
          description: Whether this catalog environment requires explicit confirmation before protected runtime-changing operations.
          default: false
          example: true
        protected_environment_confirmation:
          $ref: '#/components/schemas/NullableSlug'
      required:
        - name
        - color
        - protected

    Environment:
      type: object
      description: Organization-owned runtime target catalog entry.
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        description:
          allOf:
            - $ref: '#/components/schemas/EnvironmentDescription'
          nullable: true
        color:
          $ref: '#/components/schemas/EnvironmentColor'
        protected:
          type: boolean
          description: Whether protected runtime-changing operations require explicit confirmation.
        deleted_at:
          $ref: '#/components/schemas/NullableTimestamp'
        delete_reason:
          type: string
          maxLength: 2000
          nullable: true
          example: "Superseded by prod"
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - name
        - description
        - color
        - protected
        - deleted_at
        - delete_reason
        - created_at
        - updated_at

    EnableProjectEnvironmentRequest:
      type: object
      description: Request to enable an environment for a project.
      additionalProperties: false
      properties:
        is_default:
          type: boolean
          description: Whether this environment should become the project's default environment.
          default: false
          example: true
        protected_environment_confirmation:
          $ref: '#/components/schemas/NullableSlug'

    ProjectEnvironment:
      type: object
      description: Environment enabled for a project.
      properties:
        environment_slug:
          $ref: '#/components/schemas/Slug'
        environment_name:
          $ref: '#/components/schemas/Name'
        environment_description:
          allOf:
            - $ref: '#/components/schemas/EnvironmentDescription'
          nullable: true
        environment_color:
          $ref: '#/components/schemas/EnvironmentColor'
        environment_protected:
          type: boolean
          description: Whether protected runtime-changing operations require explicit confirmation for this environment.
        is_default:
          type: boolean
          description: Whether this is the project's default environment.
          example: true
        enabled_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - environment_slug
        - environment_name
        - environment_description
        - environment_color
        - environment_protected
        - is_default
        - enabled_at
        - updated_at

    RuntimeVariableValueType:
      type: string
      description: Scalar runtime variable value type.
      enum:
        - text
        - integer
        - boolean
        - date
        - uuid
      x-enum-varnames:
        - RuntimeVariableValueTypeText
        - RuntimeVariableValueTypeInteger
        - RuntimeVariableValueTypeBoolean
        - RuntimeVariableValueTypeDate
        - RuntimeVariableValueTypeUUID
      example: text

    RuntimeVariableKey:
      type: string
      description: Runtime variable key referenced as `{{runtime.env.key}}` in pipeline specs.
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
      maxLength: 100
      example: s3_prefix

    RuntimeVariableDescription:
      type: string
      description: Optional operator description for a non-secret runtime variable.
      maxLength: 2000
      example: "S3 prefix used by this project environment"

    UpsertRuntimeVariable:
      type: object
      description: Request to create or replace a non-secret runtime variable for an organization runtime environment.
      additionalProperties: false
      properties:
        value_type:
          $ref: '#/components/schemas/RuntimeVariableValueType'
        value:
          type: string
          description: String representation of the scalar value. It is validated according to value_type.
          minLength: 1
          maxLength: 4000
          example: "dev/dir"
        description:
          $ref: '#/components/schemas/RuntimeVariableDescription'
        protected_environment_confirmation:
          $ref: '#/components/schemas/NullableSlug'
      required:
        - value_type
        - value

    RuntimeVariable:
      type: object
      description: Non-secret runtime variable scoped to one organization runtime environment.
      properties:
        environment_slug:
          $ref: '#/components/schemas/Slug'
        key:
          $ref: '#/components/schemas/RuntimeVariableKey'
        value_type:
          $ref: '#/components/schemas/RuntimeVariableValueType'
        value:
          type: string
          description: String representation of the scalar value.
          example: "dev/dir"
        description:
          allOf:
            - $ref: '#/components/schemas/RuntimeVariableDescription'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - environment_slug
        - key
        - value_type
        - value
        - description
        - created_at
        - updated_at

    EnvironmentSecretKey:
      type: string
      description: Environment secret key referenced as `{{runtime.secrets.KEY}}` in pipeline specs.
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
      maxLength: 100
      example: API_TOKEN

    EnvironmentSecretDescription:
      type: string
      description: Optional operator description for a write-only environment secret.
      maxLength: 2000
      example: "API token used by this runtime environment"

    UpsertEnvironmentSecret:
      type: object
      description: Request to create or replace a write-only environment secret for an organization runtime environment.
      additionalProperties: false
      properties:
        value:
          type: string
          writeOnly: true
          description: Plaintext secret value accepted only on create or update. It is encrypted and never returned by read APIs.
          minLength: 1
          maxLength: 20000
          example: "secret-value"
        description:
          $ref: '#/components/schemas/EnvironmentSecretDescription'
        protected_environment_confirmation:
          $ref: '#/components/schemas/NullableSlug'
      required:
        - value

    EnvironmentSecret:
      type: object
      description: Safe metadata for a write-only environment secret scoped to one organization runtime environment. Plaintext values are never returned.
      properties:
        environment_slug:
          $ref: '#/components/schemas/Slug'
        key:
          $ref: '#/components/schemas/EnvironmentSecretKey'
        description:
          allOf:
            - $ref: '#/components/schemas/EnvironmentSecretDescription'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - environment_slug
        - key
        - description
        - created_at
        - updated_at

    DataSourceRefCapability:
      type: string
      description: Required behavior a concrete data source must support to satisfy a logical ref.
      enum:
        - pipeline_source
        - pipeline_sink
      x-enum-varnames:
        - DataSourceRefCapabilityPipelineSource
        - DataSourceRefCapabilityPipelineSink
      example: pipeline_source

    NewDataSourceRef:
      type: object
      description: Request to create a pipeline-scoped logical data source reference.
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided)
          allOf:
            - $ref: '#/components/schemas/Slug'
        data_source_type:
          $ref: '#/components/schemas/DataSourceType'
        required_capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DataSourceRefCapability'
      required:
        - name
        - data_source_type
        - required_capabilities

    UpdateDataSourceRef:
      type: object
      description: Request to update a pipeline-scoped logical data source reference.
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        data_source_type:
          $ref: '#/components/schemas/DataSourceType'
        required_capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DataSourceRefCapability'
        protected_environment_confirmation:
          description: Exact protected environment slug required when the ref is bound in a protected environment.
          allOf:
            - $ref: '#/components/schemas/NullableSlug'
      required:
        - name
        - data_source_type
        - required_capabilities

    DataSourceRef:
      type: object
      description: Pipeline-scoped logical data source reference used by portable pipeline specs.
      properties:
        pipeline_slug:
          description: Pipeline that owns this logical ref.
          allOf:
            - $ref: '#/components/schemas/Slug'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        data_source_type:
          allOf:
            - $ref: '#/components/schemas/DataSourceType'
          nullable: true
          description: Concrete data-source type required by this ref, or null when the ref was synced from a pipeline spec whose operation type maps to multiple connector families.
        required_capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceRefCapability'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - pipeline_slug
        - slug
        - name
        - data_source_type
        - required_capabilities
        - created_at
        - updated_at

    DataSourceRefListResponse:
      type: object
      description: Paginated aggregate list of pipeline-scoped logical data source references in a project.
      properties:
        data_source_refs:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceRef'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the next page
        prev_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the previous page
      required:
        - data_source_refs
        - has_more

    UpsertDataSourceBinding:
      type: object
      description: Request to bind a logical data source ref to a concrete organization-owned data source.
      additionalProperties: false
      properties:
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        protected_environment_confirmation:
          $ref: '#/components/schemas/NullableSlug'
      required:
        - data_source_slug

    DataSourceBinding:
      type: object
      description: Environment-specific binding from a pipeline-scoped logical data source ref to a concrete data source.
      properties:
        pipeline_slug:
          description: Pipeline that owns the logical ref.
          allOf:
            - $ref: '#/components/schemas/Slug'
        data_source_ref_slug:
          $ref: '#/components/schemas/Slug'
        data_source_ref_name:
          $ref: '#/components/schemas/Name'
        environment_slug:
          $ref: '#/components/schemas/Slug'
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        data_source_name:
          $ref: '#/components/schemas/Name'
        data_source_type:
          $ref: '#/components/schemas/DataSourceType'
        data_source_active:
          type: boolean
          description: Whether the bound concrete data source is active.
        data_source_read_only:
          type: boolean
          description: Whether the bound concrete data source is read-only.
        bound_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - pipeline_slug
        - data_source_ref_slug
        - data_source_ref_name
        - environment_slug
        - data_source_slug
        - data_source_name
        - data_source_type
        - data_source_active
        - data_source_read_only
        - bound_at
        - updated_at

    DataSourceBindingListResponse:
      type: object
      description: Paginated list of environment-specific data source bindings.
      properties:
        data_source_bindings:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceBinding'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the next page
        prev_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the previous page
      required:
        - data_source_bindings
        - has_more

    NewMember:
      type: object
      additionalProperties: false
      properties:

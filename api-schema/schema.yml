          minLength: 1
          description: Raw invitation token from the email link. This value is never returned by API responses.
          example: "invitation-token-abc123"
      required:
        - token

    MemberInvitation:
      type: object
      description: Organization member invitation. Raw invitation tokens are never included in this response.
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        organization_slug:
          $ref: '#/components/schemas/Slug'
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/MemberRole'
        status:

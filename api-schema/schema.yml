  /webhooks/pipelines/{receiver_id}:
    post:
      summary: Accept a generic pipeline webhook delivery
      description: Verifies the exact raw request body before parsing it, then durably accepts one bounded JSON delivery for asynchronous pipeline execution. The opaque receiver resolves all tenant and pipeline identity; raw bodies and signature material are never exposed by read APIs.
      tags:
        - webhooks
      operationId: receivePipelineWebhook
      security:
        - WebhookSignature: []
      parameters:
        - name: receiver_id
          in: path
          required: true
          description: Opaque receiver identity issued with the webhook trigger.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
        - name: Braidplane-Webhook-Key-Version
          in: header
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        - name: Braidplane-Webhook-Timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        - name: Braidplane-Webhook-Delivery-ID
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:-]+$'
        - name: Braidplane-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^v1=[0-9a-f]{64}$'
      responses:
        '202':
          description: Delivery durably accepted or already accepted identically
        '400':
          description: Malformed headers, JSON, or input mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Delivery verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receiver is missing or disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Delivery identity was already used with different bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds the webhook delivery limit
          content:
            application/json:

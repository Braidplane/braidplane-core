  /organizations/{slug}/projects/{project_slug}/pipelines/{pipeline_slug}/versions/{spec_hash}/compiled-plans:
    post:
      summary: Compile an exact retained pipeline version
      description: Compile only the full immutable version hash, using its retained authored snapshot, source commit and path. No source provenance or authored body is accepted.
      tags: [pipelines]
      operationId: compilePipelineVersion
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/PipelineSlugParam'
        - name: spec_hash
          in: path
          required: true
          description: Full immutable retained authored version hash; prefixes are not accepted.
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: environment_slug
          in: query
          description: Environment whose bindings select saved-operation definitions for this explicit compilation. Required when the retained version references saved operations. Captured operation content remains portable; deployment resolves its own targets.
          schema:
            $ref: '#/components/schemas/Slug'
      requestBody:
        required: false
        description: Optional explicit rich projection selection. Catalog documents and source provenance are resolved from retained project-owned records, never supplied here. Mapping declarations are compilation inputs, not provider observations or runtime conformance evidence. Values must be non-secret.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineCompilationRequest'
      responses:
        '200':
          description: Safe retained identity summary, excluding authored bodies and template values.
          headers:
            Cache-Control:
              description: Retained identity summaries must not be cached.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineCompiledPlan'
        '400':
          description: Invalid version, unsupported input or unavailable provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Requested retained identity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


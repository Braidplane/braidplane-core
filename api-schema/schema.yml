      x-enum-varnames:
        - MemberInvitationStatusPending
        - MemberInvitationStatusAccepted
        - MemberInvitationStatusDeclined
        - MemberInvitationStatusRevoked
        - MemberInvitationStatusExpired
      example: pending

    NewMemberInvitation:
      type: object
      description: Request to invite an email address to an organization role
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/MemberRole'
      required:

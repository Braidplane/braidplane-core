        - payload
        - duration_ms
        - success

    ObjectRowsExecutionResult:
      type: object
      description: Result of a row-normalized object/API operation
      properties:
        result_type:
          allOf:
            - $ref: '#/components/schemas/ExecutionResultResultType'
            - type: string
              enum: [object_rows]
          description: Type discriminator for object-row results
          example: object_rows
        type:
          type: string
          description: Object/API connector vendor type
          example: hubspot
        payload:
          type: object
          description: Object-row result data
          properties:
            object_type:
              type: string
              description: Provider object API name
              example: contacts
            operation:
              type: string
              description: Connector operation that produced the object rows
              example: search
            rows:
              type: array
              description: Normalized result rows
              items:
                type: object
                additionalProperties: true
              example:
                - hs_object_id: "123"
                  email: "alice@example.com"
                  firstname: "Alice"
                - hs_object_id: "456"
                  email: "bob@example.com"
                  firstname: "Bob"
            row_count:
              type: integer
              description: Number of rows returned in this page
              example: 2
            column_names:
              type: array
              description: Column names present in the rows
              items:
                type: string
              example: [hs_object_id, email, firstname]
            next_cursor:
              type: string
              nullable: true
              description: Opaque provider cursor or next token for the next page, when available
              example: "1024"
            has_more:
              type: boolean
              description: Whether another page is available
              example: true
            provider_metadata:
              type: object
              description: Provider-safe execution metadata for diagnostics. Credentials, tokens, and secret values are never included.
              additionalProperties: true
          required:
            - object_type
            - rows
            - row_count
            - column_names
            - next_cursor
            - has_more
        duration_ms:
          type: integer
          description: Execution duration in milliseconds
          example: 310
        success:
          type: boolean
          description: Whether execution succeeded
          example: true
        error:
          type: string
          description: Error message (only present if success is false)
          example: "HubSpot rate limit exceeded"
      required:
        - result_type
        - type
        - payload
        - duration_ms
        - success


        source_seeds:
          type: object
          minProperties: 1
          additionalProperties:
            type: object
            additionalProperties: true
            x-go-type: json.RawMessage
      required: [request_slug, source_seeds]

    PipelineBackfillRequest:
      type: object
      additionalProperties: false
      description: One bounded historical run. Every incremental source requires a window. Replay-safe sinks are required. Never advances normal checkpoints. Reusing a run_slug returns a conflict rather than executing twice.
      properties:
        source_windows:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/PipelineBackfillWindow'
      required: [source_windows]

    PipelineBackfillWindow:
      type: object
      additionalProperties: false
      description: Source bounds in normalized checkpoint envelopes; use value for watermarks or cursor for opaque cursors. Source operations must bind both runtime.incremental bounds.
      properties:
        lower_bound:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        upper_bound:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
      required: [lower_bound, upper_bound]

    QueryExecutionResult:
      oneOf:
        - $ref: '#/components/schemas/SQLExecutionResult'
        - $ref: '#/components/schemas/MongoDBExecutionResult'
        - $ref: '#/components/schemas/HTTPExecutionResult'
        - $ref: '#/components/schemas/ObjectRowsExecutionResult'
        - $ref: '#/components/schemas/FTPExecutionResult'
        - $ref: '#/components/schemas/GitExecutionResult'
        - $ref: '#/components/schemas/S3ExecutionResult'
        - $ref: '#/components/schemas/WorkspaceFileExecutionResult'
      discriminator:
        propertyName: result_type
        mapping:
          sql: '#/components/schemas/SQLExecutionResult'
          mongodb: '#/components/schemas/MongoDBExecutionResult'
          http: '#/components/schemas/HTTPExecutionResult'
          object_rows: '#/components/schemas/ObjectRowsExecutionResult'
          ftp: '#/components/schemas/FTPExecutionResult'
          git: '#/components/schemas/GitExecutionResult'
          s3: '#/components/schemas/S3ExecutionResult'
          workspace_file: '#/components/schemas/WorkspaceFileExecutionResult'

    ExecutionResultResultType:
      type: string
      description: Type discriminator for query execution results
      enum: [sql, mongodb, http, object_rows, ftp, git, s3, workspace_file]
      example: "http"

    SQLExecutionResult:
      type: object
      description: Result of SQL-shaped query execution (PostgreSQL, MySQL, BigQuery)
      properties:
        result_type:
          allOf:
            - $ref: '#/components/schemas/ExecutionResultResultType'
            - type: string
              enum: [sql]
          description: Type discriminator for SQL results
          example: "sql"
        type:
          type: string
          description: Vendor type (postgres, mysql, bigquery)
          example: "postgres"
        payload:
          type: object
          description: SQL-specific result data
          properties:
            file:
              $ref: '#/components/schemas/FilePayloadMetadata'
            rows:
              type: array
              description: Result rows (each row is a key-value map). Empty for file output; records are serialized in the retained file instead.
              items:
                type: object
                additionalProperties: true
              example:
                - id: 1
                  email: "user1@example.com"
                  last_login_at: "2026-02-15T10:30:00Z"
                - id: 2
                  email: "user2@example.com"
                  last_login_at: "2026-02-18T14:25:00Z"
            row_count:
              type: integer
              description: Number of rows returned or serialized in the retained file
              example: 2
            column_names:
              type: array
              description: Column names (optional metadata)
              items:
                type: string
              example: ["id", "email", "last_login_at"]
          required:
            - rows
            - row_count
        duration_ms:
          type: integer
          description: Execution duration in milliseconds
          example: 245
        success:
          type: boolean
          description: Whether execution succeeded
          example: true
        error:
          type: string
          description: Error message (only present if success is false)
          example: "Database connection timeout"
      required:
        - result_type
        - type
        - payload
        - duration_ms
        - success

    MongoDBExecutionResult:
      type: object
      description: Result of MongoDB operation execution
      properties:
        result_type:
          allOf:
            - $ref: '#/components/schemas/ExecutionResultResultType'
            - type: string
              enum: [mongodb]
          description: Type discriminator for MongoDB results
          example: "mongodb"
        type:
          type: string
          description: Vendor type (mongodb)
          example: "mongodb"
        payload:
          type: object
          description: MongoDB-specific result data
          properties:
            operation_type:
              type: string
              description: MongoDB operation that was executed
              enum: [find, aggregate, count_documents, insert_one, update_one, delete_one, update_many, delete_many]
              example: "find"
            documents:
              type: array
              description: Result documents (for find/aggregate operations)
              items:
                type: object
                additionalProperties: true
              example:
                - _id: "507f1f77bcf86cd799439011"
                  name: "Alice"
                  email: "alice@example.com"
            document_count:
              type: integer
              description: Document count (for count_documents operation)
              example: 42
            inserted_id:
              description: Inserted document ID (for insert_one operation)
              example: "507f1f77bcf86cd799439011"
            matched_count:
              type: integer
              format: int64
              description: Number of documents matched (for update operations)
              example: 1
            modified_count:
              type: integer
              format: int64
              description: Number of documents modified (for update operations)
              example: 1
            deleted_count:
              type: integer
              format: int64
              description: Number of documents deleted (for delete operations)
              example: 3
            upserted_id:
              description: Upserted document ID (for update operations with upsert)
              example: null
            upserted_count:
              type: integer
              format: int64
              description: Number of documents upserted (for update operations)
              example: 0
          required:
            - operation_type
        duration_ms:
          type: integer
          description: Execution duration in milliseconds
          example: 125
        success:
          type: boolean
          description: Whether execution succeeded
          example: true
        error:
          type: string
          description: Error message (only present if success is false)
          example: "Connection to MongoDB lost"
      required:
        - result_type
        - type
        - payload
        - duration_ms
        - success

    HTTPExecutionResult:
      type: object
      description: Result of HTTP API request execution
      properties:
        result_type:
          allOf:
            - $ref: '#/components/schemas/ExecutionResultResultType'
            - type: string
              enum: [http]
          description: Type discriminator for HTTP results
          example: "http"
        type:
          type: string
          description: Vendor type (always http)
          example: "http"
        payload:
          type: object
          description: HTTP-specific result data
          properties:
            status_code:
              type: integer

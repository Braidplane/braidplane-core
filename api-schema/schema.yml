        diagnostics:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProofDiagnostic'
      required:
        - identity
        - description
        - required_evidence_level
        - actual_evidence_level
        - observed_at
        - expires_at
        - verdict
        - evidence
        - diagnostics


          $ref: '#/components/schemas/ProofClaimIdentity'
        operation:
          type: string
          enum: [hubspot.contact_metadata, bigquery.table_metadata, google_workspace.worksheet_metadata, google_workspace.file_metadata, postgres.table_metadata, mysql.table_metadata, s3.object_metadata, mongodb.collection_metadata]
          x-enum-varnames: [ProofObservationOperationContactMetadata, ProofObservationOperationTableMetadata, ProofObservationOperationWorksheetMetadata, ProofObservationOperationFileMetadata, ProofObservationOperationPostgresTableMetadata, ProofObservationOperationMySQLTableMetadata, ProofObservationOperationS3ObjectMetadata, ProofObservationOperationMongoDBCollectionMetadata]
        metadata_expires_at:
          type: string
          format: date-time
        rate_window_seconds:
          type: integer
        target:
          $ref: '#/components/schemas/ProofObservationTarget'
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        credential_version:
          type: string
        policy_version:
          type: string
        expires_at:
          type: string
          format: date-time
        evidence_expires_at:
          type: string
          format: date-time
        timeout_seconds:
          type: integer
        max_rows:
          type: integer
          format: int64
        max_bytes:
          type: integer
          format: int64
        max_requests:
          type: integer
          format: int64

    ProofObservationIntent:
      type: object
      additionalProperties: false
      description: Explicit confirmation of this user's unexpired preview. Current authorization, policy, candidate, bindings, target and credential are checked again. Replay returns the same job without dispatching it twice.
      required: [intent_token, request_digest]
      properties:
        intent_token:
          type: string

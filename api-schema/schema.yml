      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - name: file_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
      responses:
        '200':
          description: Target metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoogleWorkspaceFile'}
        '403':
          description: Permission denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Target not accessible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /organizations/{slug}/data-sources/{ds_slug}/google-workspace/spreadsheets/{file_id}/worksheets:
    get:
      summary: Read target metadata without contents
      operationId: getGoogleWorkspaceWorksheets
      tags: [data-sources]
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - name: file_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256, pattern: '^[A-Za-z0-9_-]+$'}
      responses:
        '200':
          description: Target metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoogleWorkspaceSchemaResponse'}
        '403':
          description: Permission denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Target not accessible
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Provider unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /organizations/{slug}/provider-connectors/{provider}/installs:
    post:
      summary: Start provider connector install
      description: Creates a time-bound, single-use OAuth2 install and returns a provider authorization URL. Provider client secrets are backend configuration and are never supplied in this request.
      tags:
        - data-sources
      operationId: startProviderConnectorInstall
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - name: provider
          in: path
          required: true
          description: Provider key registered by the backend
          schema:
            $ref: '#/components/schemas/ProviderKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProviderConnectorInstallRequest'
      responses:
        '201':
          description: Provider install started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnectorInstall'
        '400':
          description: Invalid install request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to install provider connectors for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization or data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/provider-connectors/{provider}/data-source-installs:
    post:
      summary: Start provider-backed data source onboarding
      description: Creates an inactive data source with a pending OAuth2 credential owner and starts a time-bound, single-use provider install. No static credential or token material is persisted before the callback succeeds.
      tags:
        - data-sources
      operationId: startProviderDataSourceInstall
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - name: provider
          in: path
          required: true
          description: Provider key registered by the backend
          schema:
            $ref: '#/components/schemas/ProviderKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProviderDataSourceInstallRequest'
      responses:
        '201':
          description: Pending data source and provider install created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderDataSourceInstall'
        '400':
          description: Invalid provider-backed data source request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to create data sources for this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Data source slug already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /provider-connectors/{provider}/callback:
    get:
      summary: Complete provider connector OAuth callback
      description: Validates the callback state, exchanges the authorization code, stores the encrypted provider grant, and redirects to the product surface. OAuth codes, state values, tokens, provider headers, and raw provider responses are never returned.
      tags:
        - data-sources
      operationId: handleProviderConnectorCallback
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider key registered by the backend
          schema:
            $ref: '#/components/schemas/ProviderKey'
        - name: code
          in: query
          required: false
          description: Authorization code returned by the provider
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: false
          description: Opaque callback state. The value is validated against a stored hash and is never persisted or logged in plaintext.
          schema:
            type: string
            minLength: 1
        - name: error
          in: query
          required: false
          description: Provider error code when consent fails
          schema:
            type: string
            minLength: 1
        - name: iss
          in: query
          required: false
          description: Authorization server issuer. Configurable HTTP OAuth requires an exact match with the issuer saved when authorization started.
          schema:
            type: string
            minLength: 1
      responses:
        '302':
          description: Redirect to the data-source surface with a safe success or failure status
          headers:
            Location:
              description: Product URL
              schema:
                type: string
                format: uri

  /organizations/{slug}/data-sources/{ds_slug}/http-oauth/connect:
    post:
      summary: Connect or reconnect an HTTP OAuth source
      description: Uses the encrypted app settings saved on this source. Authorization-code apps return a single-use consent URL. Client-credentials apps acquire a token and test the destination before returning. No stored app settings or token material are returned.
      operationId: connectDataSourceHTTPOAuth
      tags: [data-sources]
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
      responses:
        '200':
          description: Consent required or machine connection tested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPOAuthConnection'
        '400':
          description: Invalid HTTP OAuth setup or destination test failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Permission denied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Source not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /organizations/{slug}/data-sources/{ds_slug}/provider-grant/refresh:
    post:
      summary: Refresh data source provider grant
      description: Forces an OAuth2 provider grant refresh and returns safe credential metadata only.
      tags:
        - data-sources
      operationId: refreshDataSourceProviderGrant
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
      responses:
        '200':
          description: Provider grant refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '400':
          description: Data source does not use an OAuth2 provider grant or refresh failed with a safe validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to refresh this provider grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source or credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/data-sources/{ds_slug}/provider-grant/revoke:
    post:
      summary: Revoke data source provider grant
      description: Revokes an OAuth2 provider grant, clears runtime usability, and returns safe credential metadata only.
      tags:
        - data-sources
      operationId: revokeDataSourceProviderGrant
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
      responses:
        '200':
          description: Provider grant revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '400':
          description: Data source does not use an OAuth2 provider grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to revoke this provider grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source or credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/data-sources/{ds_slug}/provider-grant/rotate:
    post:
      summary: Rotate data source provider grant
      description: Starts a new OAuth2 install for the existing data source. The current grant remains active until the callback succeeds or the user revokes it.
      tags:
        - data-sources
      operationId: rotateDataSourceProviderGrant
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - name: access_mode
          in: query
          description: Workspace file access mode. Defaults to selected_files. Other providers reject this parameter.
          schema:
            $ref: '#/components/schemas/GoogleWorkspaceAccessMode'
      responses:
        '201':
          description: Provider grant rotation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConnectorInstall'
        '400':
          description: Data source does not use an OAuth2 provider grant or rotation cannot be started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to rotate this provider grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source or credential not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/data-sources/{ds_slug}/schema:
    get:
      summary: Get cached data source schema
      description: Returns cached schema metadata without contacting the provider. When no cache has been imported yet, the response is the connector-appropriate empty schema shape. Use POST on this endpoint to perform a live refresh/import.
      tags:
        - data-sources
      operationId: introspectDataSourceSchema
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
      responses:
        '200':
          description: Cached schema returned, or an empty connector schema when no cache exists yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectSchemaResponse'
              examples:
                SQLSchema:
                  summary: SQL schema (PostgreSQL, MySQL, BigQuery, SQLite) with tables and columns
                  value:
                    schema_type: "sql"
                    type: "postgres"
                    tables:
                      - name: "users"
                        columns:
                          - name: "id"
                            type: "integer"
                          - name: "email"
                            type: "varchar"
                          - name: "created_at"
                            type: "timestamp"
                      - name: "orders"
                        columns:
                          - name: "id"
                            type: "integer"
                          - name: "user_id"
                            type: "integer"
                          - name: "total"
                            type: "numeric"
                HTTPSchema:
                  summary: HTTP/OpenAPI schema with operations
                  value:
                    schema_type: "http"
                    operations:
                      - id: "listUsers"
                        path: "/users"
                        method: "GET"
                        description: "List all users"
                      - id: "createUser"
                        path: "/users"
                        method: "POST"
                        description: "Create a new user"
                DocumentSchema:
                  summary: Document database schema with collections (MongoDB, etc.)
                  value:
                    schema_type: "document"
                    type: "mongodb"
                    collections:
                      - name: "users"
                        fields:
                          - name: "_id"
                            type: "objectid"
                          - name: "email"
                            type: "string"
                          - name: "created_at"
                            type: "date"
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Cached schema could not be decoded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Refresh data source schema
      description: Queues live connector schema refresh/import work. Reads remain cache-only; the worker updates cached schema metadata and import state after provider work completes. Duplicate requests while an import is already running return the existing importing state without enqueueing another job.
      tags:
        - data-sources
      operationId: refreshDataSourceSchema
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
      responses:
        '202':
          description: Schema import accepted or already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceSchemaImportResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/data-sources/{ds_slug}/queries:
    get:
      summary: List queries
      description: List all queries for a data source in the organization
      tags:
        - queries
      operationId: listQueries
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/QueryFieldParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
        - name: include_deleted
          in: query
          description: Include soft-deleted queries in the result set. Requires query restore permission.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a query
      description: Create a new query for the data source
      tags:
        - queries
      operationId: createQuery
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewQuery'
            examples:
              PostgreSQLQuery:
                summary: PostgreSQL query example
                value:
                  slug: "get-active-users"
                  name: "Get Active Users"
                  description: "Fetch all users who logged in within the last 30 days"
                  query_statement:
                    type: "postgres"
                    sql: "SELECT id, email, last_login_at FROM users WHERE last_login_at > {{min_login_date}} AND is_active = {{is_active}} LIMIT {{limit}}"
                  parameters:
                    - slug: "min-login-date"
                      name: "min_login_date"
                      data_type: "date"
                      is_required: true
                      default_value: "2026-01-24"
                    - slug: "is-active"
                      name: "is_active"
                      data_type: "boolean"
                      is_required: true
                      default_value: "true"
                    - slug: "limit"
                      name: "limit"
                      data_type: "integer"
                      is_required: false
                      default_value: "100"
                  row_limit: 1000
                  timeout_seconds: 30
              MongoDBQuery:
                summary: MongoDB query example
                value:
                  slug: "find-active-users"
                  name: "Find Active Users"
                  description: "Find users with status active"
                  query_statement:
                    type: "mongodb"
                    collection: "users"
                    operation: "find"
                    filter: {"status": "{{user_status}}", "created_at": {"$gte": "{{min_date}}"}}
                    projection: {"_id": 1, "email": 1, "created_at": 1}
                    sort: {"created_at": -1}
                    limit_value: 100
                  parameters:
                    - slug: "user-status"
                      name: "user_status"
                      data_type: "text"
                      is_required: true
                      default_value: "active"
                    - slug: "min-date"
                      name: "min_date"
                      data_type: "text"
                      is_required: false
                      default_value: "2026-01-01"
                  row_limit: 1000
                  timeout_seconds: 30
      responses:
        '201':
          description: Query created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '400':
          description: Bad request (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization or data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Query already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/data-sources/{ds_slug}/queries/{query_slug}:
    get:
      summary: Get a query
      description: Retrieve details of a specific query including parameter definitions
      tags:
        - queries
      operationId: getQuery
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - $ref: '#/components/parameters/QuerySlugParam'
      responses:
        '200':
          description: Query details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Query or organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a query
      description: Update an existing query (full replacement)
      tags:
        - queries
      operationId: updateQuery
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - $ref: '#/components/parameters/QuerySlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuery'
            example:
              name: "Get Recent Active Users"
              description: "Updated description"
              query_statement:
                type: postgres
                sql: "SELECT id, email, last_login_at FROM users WHERE last_login_at > NOW() - INTERVAL '7 days' LIMIT 500"
              row_limit: 500
              timeout_seconds: 15
      responses:
        '200':
          description: Query updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Query'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Query not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a query
      description: Soft-deletes a query. Normal query list, get, update, and execute paths treat deleted queries as not found.
      tags:
        - queries
      operationId: deleteQuery
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - $ref: '#/components/parameters/QuerySlugParam'
      responses:
        '204':
          description: Query deleted successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Query not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/data-sources/{ds_slug}/queries/{query_slug}/restore:
    post:
      summary: Restore a query
      description: Restores a previously soft-deleted query and preserves its execution history.
      tags:

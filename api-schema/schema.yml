  /organizations/{slug}/projects/{project_slug}/contracts/{contract_slug}/impact:
    post:
      summary: Preview ODCS revision impact
      description: Shows which pipelines in this project may be affected by a contract revision change. Identifies breaking changes, warnings, and changes that cannot be assessed. Impact on external consumers is unknown.
      tags: [contracts]
      operationId: previewODCSRevisionImpact
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/ContractSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ODCSRevisionImpactRequest'
      responses:
        '200':
          description: Revision changes and affected pipeline ports
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODCSRevisionImpact'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Catalog resource or project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal access token or organization API key. Permissions and principal restrictions still apply.
    SessionAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: Browser session. Unsafe cookie-authenticated requests also require X-CSRF-Token from an authenticated safe request.
    WebhookSignature:
      type: apiKey
      in: header
      name: Braidplane-Webhook-Signature
      description: HMAC-SHA256 signature over key version, timestamp, delivery ID and exact raw body. Key version, timestamp and delivery ID headers are also required; this is not a bearer credential.

  parameters:
    ContractSlugParam:
      name: contract_slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

    RevisionSlugParam:
      name: revision_slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"

    # Reusable pagination parameters
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return (default 20, max 100)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    CursorParam:
      name: cursor
      in: query
      description: Cursor for pagination (from previous response's next_cursor). Format depends on sort_by parameter.
      required: false
      schema:
        type: string
        example: "2025-10-04T12:34:56Z_987e6543-e21b-34c5-d678-123456789abc"

    OrderParam:
      name: order
      in: query
      description: Sort order (asc for ascending, desc for descending)
      required: false
      schema:
        type: string
        enum: [asc, desc]
        x-enum-varnames: [Asc, Desc]
        default: desc
        example: desc

    PageDirectionParam:
      name: direction
      in: query
      description: Page direction (next for forward navigation, prev for backward navigation)
      required: false
      schema:
        type: string
        enum: [next, prev]
        x-enum-varnames: [Next, Prev]
        default: next
        example: next

    # Field selection parameters for each list endpoint type
    OrganizationsFieldParam:
      name: sort_by
      in: query
      description: Field to sort by
      required: false
      schema:
        type: string
        enum: [organization_created_at, organization_updated_at, organization_name]
        default: organization_created_at
        example: organization_created_at

    MembersFieldParam:
      name: sort_by
      in: query
      description: Field to sort by
      required: false

          minLength: 1
        retryable:
          type: boolean
      required:
        - code
        - summary
        - remediation
        - retryable

    ProofClaim:
      type: object
      description: One immutable clause result with explicit evidence requirement, actual level, freshness, verdict, and sanitized references.
      additionalProperties: false
      properties:

  /organizations/{slug}/projects/{project_slug}/repository-setup:
    get:
      summary: Inspect resumable project repository setup
      tags: [projects]
      operationId: getProjectRepositorySetup
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
      responses:
        '200':
          description: Durable setup progress without provider credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepositorySetup'
        '204':
          description: No repository setup has started
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create and attach a private pipeline repository
      description: |
        Explicitly creates a private customer-owned GitHub or GitLab repository, initializes the
        versioned template, creates a managed connection and attaches it to this project.
        GitHub starts the App authorization flow and returns an authorization URL before creation.
        GitLab returns its existing organization OAuth consent flow when API write access is missing or revoked.
        Complete provider consent in a browser, then use the callback or GitHub authorization operation.
        Repeating the same request resumes the same setup and preserves created resources.
        Requires organization update, project update and data source create permissions.
        A different target or an existing unrelated backend is never replaced.
      tags: [projects]
      operationId: createProjectRepository
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRepositoryRequest'
      responses:
        '200':
          description: Durable setup progress, with a GitHub authorization URL when user consent is needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepositorySetup'
        '400':
          description: Invalid target or missing explicit creation consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing Braidplane or provider creation permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another setup is running, the target differs, or a repository already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/projects/{project_slug}/repository-setup/abandon:
    post:
      summary: Keep existing resources and choose a new repository target
      description: |
        Archives the exact incomplete attempt without deleting its repository or connection.
        Requires organization update, project update and explicit resource preservation consent.
        A running attempt or an attached pipeline backend cannot be abandoned.
        Previous consent cannot authorize a new attempt. The returned attempt remains readable by its slug.
      tags: [projects]
      operationId: abandonProjectRepositorySetup
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbandonProjectRepositorySetupRequest'
      responses:
        '200':
          description: Archived attempt with retained resource provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectRepositorySetup'
        '400':
          description: Missing explicit preservation consent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Required permission missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Attempt not found in this project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Attempt is running, attached or no longer current
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


          type: string
          description: API endpoint path
          example: "/users"
        method:
          type: string
          description: HTTP method
          enum: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS, TRACE]
          example: "GET"
        description:
          type: string
          description: Operation description
          example: "List all users"
        draft:
          $ref: '#/components/schemas/HTTPOperationDraft'
        diagnostics:
          type: array
          description: Reasons this operation cannot safely generate a query draft. Refresh older imports to generate draft metadata.
          items:
            type: string
        request_body:
          $ref: '#/components/schemas/OperationRequestBodyInfo'
        responses:
          type: object

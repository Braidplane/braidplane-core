        database: {type: string, minLength: 1, maxLength: 128}
        schema: {type: string, minLength: 1, maxLength: 128}
        table: {type: string, minLength: 1, maxLength: 128}

    ProofMySQLTarget:
      type: object
      additionalProperties: false
      description: Selected table on the bound data source. Host, port and database must match its configuration; native metadata does not execute the pipeline's SQL.
      required: [connector_type, host, port, database, schema, table]
      properties:
        connector_type: {type: string, enum: [mysql]}
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        database: {type: string, minLength: 1, maxLength: 128}
        schema: {type: string, minLength: 1, maxLength: 128}
        table: {type: string, minLength: 1, maxLength: 128}

    ProofS3Target:

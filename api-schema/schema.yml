        - user_slug
        - role

    Member:
      type: object
      properties:
        user_slug:
          $ref: '#/components/schemas/Slug'
        email:
          $ref: '#/components/schemas/Email'
        role:
          $ref: '#/components/schemas/MemberRole'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - user_slug

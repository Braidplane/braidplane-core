        - $ref: '#/components/parameters/QuerySlugParam'
      responses:
        '204':
          description: Query restored successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Query not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/data-sources/{ds_slug}/queries/{query_slug}/purge:
    delete:
      summary: Permanently purge a deleted query
      description: Permanently deletes a soft-deleted query and its execution history. Active queries must be soft-deleted before purge.
      tags:
        - queries
      operationId: purgeQuery
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/DataSourceSlugParam'
        - $ref: '#/components/parameters/QuerySlugParam'
      responses:
        '204':
          description: Query purged successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Query not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Query must be soft-deleted before purge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/query-execution-summary:
    get:
      summary: Get latest successful saved-query execution

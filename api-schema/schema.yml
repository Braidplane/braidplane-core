              example: 200
            headers:
              type: object
              description: HTTP response headers
              additionalProperties:
                type: string
              example:
                Content-Type: "application/json"
                X-RateLimit-Remaining: "42"
            body:
              nullable: true
              description: JSON-safe HTTP response body for JSON/text/CSV responses. Native file responses omit raw bytes and use file metadata instead.
              example:

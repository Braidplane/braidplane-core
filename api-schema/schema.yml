        slug:
          $ref: '#/components/schemas/Slug'
        state:
          type: string
          enum: [pending, running, finished]
          x-enum-varnames: [ProofObservationJobStatePending, ProofObservationJobStateRunning, ProofObservationJobStateFinished]
        request_digest:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'

        deadline_at:
          type: string
          format: date-time
        cancellation_requested:
          type: boolean
        outcome:
          $ref: '#/components/schemas/ProofObservationOutcome'

    ProofObservationOutcome:
      type: string
      enum: [complete, unsupported, denied, unreachable, rate_limited, timed_out, over_budget, canceled, worker_lost, partial, provider_error, attestation_failed, cleanup_uncertain]
      x-enum-varnames: [ProofObservationOutcomeComplete, ProofObservationOutcomeUnsupported, ProofObservationOutcomeDenied, ProofObservationOutcomeUnreachable, ProofObservationOutcomeRateLimited, ProofObservationOutcomeTimedOut, ProofObservationOutcomeOverBudget, ProofObservationOutcomeCanceled, ProofObservationOutcomeWorkerLost, ProofObservationOutcomePartial, ProofObservationOutcomeProviderError, ProofObservationOutcomeAttestationFailed, ProofObservationOutcomeCleanupUncertain]


  /organizations/{slug}/projects/{project_slug}/environments/{environment_slug}/runs/{run_slug}/progress:
    get:
      summary: Read durable pipeline execution progress
      description: >
        Read an append-only event page for one exact attempt. after_event is the
        number of events already consumed; start or resynchronize with zero.
        A cursor beyond retained history returns 400. Reconnect with the last
        next_after_event; duplicate observations are safe to discard by offset.
        Revision orders boundary snapshots; worker observations can advance
        independently. Poll no faster than once per second, normally every two
        seconds, and stop after a terminal attempt and all pages are consumed.
        Recent worker telemetry is not evidence of completed provider effects.
        Stale or unavailable observations do not prove worker death. Retention
        is the same as run history; a missing run returns 404.
      tags:
        - pipelines
      operationId: getPipelineRunProgress
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
        - $ref: '#/components/parameters/RunSlugParam'
        - name: after_event
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Durable progress page for one pipeline run attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunProgress'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - caller not authorized to access this environment-scoped resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Pipeline run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /organizations/{slug}/projects/{project_slug}/environments/{environment_slug}/runs/{run_slug}:recover:
    post:
      summary: Recover sink delivery from pinned inputs
      description: >
        Synchronously recovers a failed sink workflow from retained checkpoint inputs.
        Requires pipeline execute permission and protected-environment confirmation.
        Keeps the original environment, version, source windows and effect identity;
        skips confirmed safe effects and refuses unsafe or unknown ledger-only retries.
        Terminal worker-loss runs require fenced queue ownership and complete retained
        outputs with repeat-safe sinks. Missing input checkpoints and other
        source/transform failures are unsupported.
      tags: [pipelines]
      operationId: recoverPipelineRun
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
        - $ref: '#/components/parameters/RunSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverPipelineRunRequest'
      responses:
        '200':
          description: Recovery run with terminal delivery diagnostics, including failed recovery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineRunRecord'
        '400':
          description: Unsupported recovery or unsafe replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Run or retained checkpoint not found in the requested scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


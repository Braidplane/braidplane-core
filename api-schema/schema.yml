        - email
        - role
        - status
        - invited_by_user_slug
        - accepted_user_slug
        - expires_at
        - last_sent_at
        - accepted_at
        - declined_at
        - revoked_at
        - expired_at
        - created_at
        - updated_at

    MemberInvitationAcceptance:

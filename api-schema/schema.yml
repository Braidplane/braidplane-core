  /organizations/{slug}/projects/{project_slug}/pipelines:reconcile:
    post:
      summary: Reconcile Git-authored pipelines
      description: |
        Reconciles pipeline specs from the project's git pipeline source into DB-canonical storage.
        Apply registers the imported logical data-source references for binding without deploying a runtime version.
        Preview does not change references or bindings. Existing references and bindings remain available to deployed versions.
        The operation is synchronous for the MVP and returns a concrete per-pipeline reconciliation report.
      tags:
        - pipelines
      operationId: reconcilePipelines
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineReconcileRequest'
            example:
              dry_run: true
              pipeline_dir: pipelines
              pipeline_slugs:
                - acme-users-sync
      responses:
        '200':
          description: Pipeline reconcile completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineReconcileResponse'
        '400':
          description: Invalid input (validation error, malformed JSON, malformed slug)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The Git source changed since preview; request a fresh preview before applying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Git source unavailable or unsupported for reconciliation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


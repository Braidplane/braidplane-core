      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/APIKeySlugParam'
      responses:
        '204':
          description: Revoked API key metadata deleted
        '400':
          description: API key must be revoked before deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to delete API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/api-keys/{api_key_slug}/rotate:
    post:
      summary: Rotate an API key token
      description: Replaces the API key token hash and returns the new raw token once. The API key slug, role, metadata, and management capability remain unchanged. A management-enabled API key may rotate only keys with its own role. Revoked API keys cannot be rotated.
      tags:
        - api-keys
      operationId: rotateAPIKey
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/APIKeySlugParam'
      responses:
        '200':
          description: API key token rotated
          content:
            application/json:

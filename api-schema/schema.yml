          type: string
        before:
          $ref: '#/components/schemas/DriftImpactValue'
        after:
          $ref: '#/components/schemas/DriftImpactValue'
        severity:
          $ref: '#/components/schemas/DriftImpactReportSeverity'
        reason_code:
          type: string
      required:
        - kind
        - path
        - before
        - after
        - severity
        - reason_code

    DriftImpactImpact:
      type: object
      properties:
        kind:
          type: string
          enum:
            - pipeline
            - step
            - edge
            - sink
            - run
            - unknown_consumer
        pipeline_slug:
          $ref: '#/components/schemas/NullableSlug'
        step_slug:
          $ref: '#/components/schemas/NullableSlug'
        edge_slug:
          type: string
        severity:
          $ref: '#/components/schemas/DriftImpactReportSeverity'
        message:
          type: string
      required:
        - kind
        - severity
        - message

    DriftImpactReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/DriftImpactReport'
      required:
        - reports

    PipelineReconcileRequest:
      type: object
      description: Request to reconcile Git-authored pipeline specs into DB-canonical storage.
      additionalProperties: false
      properties:
        expected_source:
          $ref: '#/components/schemas/PipelineReconcileExpectedSource'
        dry_run:
          type: boolean
          description: When true, computes the reconciliation report without mutating DB state or writing to git.
          default: false
          example: true
        pipeline_dir:
          type: string
          description: Directory inside the git repository to scan for pipeline specs.
          minLength: 1
          default: pipelines
          example: pipelines
        pipeline_slugs:
          type: array
          description: Optional filter limiting reconciliation to these pipeline slugs. Unselected git specs are reported as skipped and do not cause stale DB rows to be deleted.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Slug'
          example:
            - acme-users-sync

    PipelineReconcileExpectedSource:
      type: object
      additionalProperties: false
      description: Optional preview precondition. Reconciliation returns 409 without applying changes if the resolved source differs. Omit to reconcile the current tracked source.
      required: [data_source_slug, repo, ref, commit]
      properties:
        data_source_slug:
          $ref: '#/components/schemas/Slug'
        repo:
          type: string
          minLength: 1
          description: Normalized repository from the preview.
        ref:
          type: string
          minLength: 1
          description: Tracked ref from the preview.
        commit:
          type: string
          minLength: 1
          description: Immutable commit from the preview.

    PipelineReconcileResponse:
      type: object
      description: Result of a synchronous git pipeline reconciliation operation.
      properties:
        dry_run:
          type: boolean
          description: Whether the operation was executed without mutations.
          example: true
        pipeline_dir:
          type: string
          description: Directory scanned inside the git repository.
          example: pipelines
        requested_pipeline_slugs:
          type: array
          description: Pipeline slug filter requested by the caller.
          items:
            $ref: '#/components/schemas/Slug'
        source:
          $ref: '#/components/schemas/PipelineReconcileSourceMetadata'
        summary:
          $ref: '#/components/schemas/PipelineReconcileSummary'
        synced:
          type: array
          description: Pipelines that were synchronized, or would be synchronized when dry_run is true.
          items:
            $ref: '#/components/schemas/PipelineReconcileSyncedPipeline'
        deleted:
          type: array
          description: Git-authored DB pipelines deleted as stale, or that would be deleted when dry_run is true.
          items:
            $ref: '#/components/schemas/PipelineReconcileDeletedPipeline'
        skipped:
          type: array
          description: Git specs or DB rows intentionally skipped with a concrete reason.
          items:
            $ref: '#/components/schemas/PipelineReconcileSkippedPipeline'
        drift_resets:
          type: array
          description: Drifted Git-authored DB specs reset back to the git source.
          items:
            $ref: '#/components/schemas/PipelineReconcileDriftReset'
        failures:
          type: array
          description: Per-pipeline failures collected during reconciliation.
          items:
            $ref: '#/components/schemas/PipelineReconcileFailure'
      required:
        - dry_run
        - pipeline_dir
        - requested_pipeline_slugs
        - source
        - summary
        - synced
        - deleted
        - skipped
        - drift_resets
        - failures

    PipelineReconcileSourceMetadata:
      type: object
      description: Git source metadata used for the reconcile operation.
      properties:
        data_source_slug:
          $ref: '#/components/schemas/NullableSlug'
        repo:
          type: string
          nullable: true
          description: Normalized source repository URL recorded on reconciled pipeline specs.
          example: https://github.com/Braidplane/acme-pipelines.git
        ref:
          type: string
          nullable: true
          description: Git ref recorded on reconciled pipeline specs.
          example: refs/heads/main
        commit:
          type: string
          nullable: true
          description: Commit SHA recorded as the latest applied source revision.
          example: f4a1920c8e6b66e9a07a3f1a4ec67631a7de91ef
      required:
        - data_source_slug

    PipelineReconcileSummary:
      type: object
      description: Count summary for one reconcile operation.
      properties:
        scanned:
          type: integer
          minimum: 0
          description: Number of git pipeline spec files considered.
          example: 3
        synced:
          type: integer
          minimum: 0
          description: Number of pipelines synchronized, or that would be synchronized when dry_run is true.
          example: 1
        deleted:
          type: integer
          minimum: 0
          description: Number of stale Git-authored DB pipelines deleted, or that would be deleted when dry_run is true.
          example: 1
        skipped:
          type: integer
          minimum: 0
          description: Number of pipelines skipped intentionally.
          example: 1
        failed:
          type: integer
          minimum: 0
          description: Number of pipeline-level failures collected.
          example: 1
        drift_reset:
          type: integer
          minimum: 0
          description: Number of drifted Git-authored DB specs reset to git content.
          example: 1
      required:
        - scanned
        - synced
        - deleted
        - skipped
        - failed
        - drift_reset

    PipelineReconcileSyncedPipeline:
      type: object
      description: Pipeline synchronized from git into DB-canonical storage.
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        source_path:
          type: string
          description: Pipeline spec path inside the git repository.
          example: pipelines/acme-users-sync.pipeline.yaml
        spec_hash:
          type: string
          description: Hash of the applied canonical spec JSON.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
      required:
        - pipeline_slug
        - source_path
        - spec_hash

    PipelineReconcileDeletedPipeline:
      type: object
      description: Stale Git-authored DB pipeline removed because it no longer exists in the git source.
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        previous_source_path:
          type: string
          nullable: true
          description: Previously recorded git source path, when known.
          example: pipelines/legacy-sync.pipeline.yaml
      required:
        - pipeline_slug

    PipelineReconcileSkippedReason:
      type: string
      description: Reason a pipeline was intentionally skipped during reconcile.
      enum:
        - filtered_out
        - not_git_managed
      x-enum-varnames:
        - PipelineReconcileSkippedReasonFilteredOut
        - PipelineReconcileSkippedReasonNotGitManaged
      example: filtered_out

    PipelineReconcileSkippedPipeline:
      type: object
      description: Pipeline skipped intentionally during reconcile.
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        source_path:
          type: string
          nullable: true
          description: Git path associated with the skipped pipeline, when known.
          example: pipelines/other.pipeline.yaml
        reason:
          $ref: '#/components/schemas/PipelineReconcileSkippedReason'
      required:
        - pipeline_slug
        - reason

    PipelineReconcileDriftReset:
      type: object
      description: Drifted Git-authored DB pipeline reset to the git source.
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        source_path:
          type: string
          description: Pipeline spec path inside the git repository.
          example: pipelines/acme-users-sync.pipeline.yaml
        previous_spec_hash:
          type: string
          description: DB spec hash before reconcile reset the drift.
          example: drifted-hash
        applied_spec_hash:
          type: string
          description: Git spec hash applied by reconcile.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
      required:
        - pipeline_slug
        - source_path
        - previous_spec_hash
        - applied_spec_hash

    PipelineReconcileFailure:
      type: object
      description: Pipeline-level reconcile failure that did not necessarily abort the whole operation.
      properties:
        pipeline_path:
          type: string
          nullable: true
          description: Git path that failed, when known.
          example: pipelines/broken.pipeline.yaml
        pipeline_slug:
          $ref: '#/components/schemas/NullableSlug'
        stage:
          type: string
          description: Reconcile stage that failed.
          enum:
            - read
            - load
            - marshal
            - transaction
            - source
          x-enum-varnames:
            - PipelineReconcileFailureStageRead
            - PipelineReconcileFailureStageLoad
            - PipelineReconcileFailureStageMarshal
            - PipelineReconcileFailureStageTransaction
            - PipelineReconcileFailureStageSource
          example: load
        message:
          type: string
          description: Safe failure detail suitable for API clients.
          example: pipeline metadata.slug is required
      required:
        - stage
        - message

    PipelineCompilationRequest:
      type: object
      additionalProperties: false
      properties:
        projection:
          $ref: '#/components/schemas/ODCSProjectionSelection'
        resource_scopes:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/PipelineResourceScopeSelection'}
    PipelineResourceScopeSelection:
      type: object
      additionalProperties: false
      required: [step, role, scope]
      properties:
        step: {$ref: '#/components/schemas/Slug'}
        role: {type: string, enum: [query, sink]}
        scope:
          $ref: '#/components/schemas/PipelineResourceScope'
    PipelineResourceScope:
      type: object
      additionalProperties: false
      description: Explicit non-secret S3 confinement policy for an exact project-owned contract object and logical saved operation. Never supplies credentials or grants authority.
      required: [policy_id, data_source, operation, contract, revision, object_id, representation, s3]
      properties:
        policy_id: {type: string, enum: [s3/relative-key/v1]}
        data_source: {$ref: '#/components/schemas/Slug'}
        operation: {$ref: '#/components/schemas/Slug'}
        contract: {$ref: '#/components/schemas/Slug'}
        revision:
          allOf:
            - $ref: '#/components/schemas/Slug'
            - not: {enum: [latest]}
        object_id: {type: string, minLength: 1, maxLength: 4096}
        representation: {type: string, enum: [rows]}
        s3:
          type: object
          additionalProperties: false
          required: [endpoint, region, bucket, prefix, dynamic_key, force_path_style]
          properties:
            endpoint: {type: string, minLength: 1, maxLength: 4096}
            region: {type: string, minLength: 1, maxLength: 256}
            bucket: {type: string, minLength: 1, maxLength: 256}
            prefix: {type: string, maxLength: 4096, x-go-type: '*string'}
            dynamic_key: {type: boolean, x-go-type: '*bool'}
            force_path_style: {type: boolean, x-go-type: '*bool'}
    PipelineResourceScopeInspection:
      type: object
      description: Retained scope identity only. Endpoint, region, bucket, prefix and selector values are omitted.
      required: [policy_id, data_source, operation, contract, revision, object_id, representation]
      properties:
        policy_id: {type: string}
        data_source: {type: string}
        operation: {type: string}
        contract: {type: string}
        revision: {type: string}
        object_id: {type: string}
        representation: {type: string}
    ODCSProjectionSelection:
      type: object
      additionalProperties: false
      required: [inputs]
      properties:
        inputs:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ODCSProjectionInputSelection'
        relationships:
          type: array
          maxItems: 16384
          items:
            type: object
            additionalProperties: false
            required: [input, target, path]
            properties:
              input: {type: integer, minimum: 0, maximum: 63}
              target: {type: integer, minimum: 0, maximum: 63}
              path: {type: string, minLength: 1, maxLength: 4096}
    ODCSProjectionInputSelection:
      type: object
      additionalProperties: false
      required: [contract_slug, revision_slug, schema_object_id, digest, mapping]
      properties:
        contract_slug:
          $ref: '#/components/schemas/Slug'
        revision_slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
            - not: {enum: [latest]}
        schema_object_id: {type: string, minLength: 1, maxLength: 4096}
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        mapping:
          $ref: '#/components/schemas/ODCSProjectionMapping'
        variables:
          type: object
          maxProperties: 128
          additionalProperties:
            type: object
            additionalProperties: false
            required: [value, revision]
            properties:
              value: {type: string, maxLength: 1048576}
              revision: {type: string, minLength: 1, maxLength: 4096}
    ODCSProjectionMapping:
      type: object
      additionalProperties: false
      description: Explicit versioned capability/mapping declaration captured in the plan. This does not grant data-source authority or establish provider behavior. Unsupported or conflicting declarations fail compilation.
      required: [id, representation, types]
      properties:
        id: {type: string, minLength: 1, maxLength: 4096}
        representation: {type: string, enum: [rows, json, csv]}
        root_shape: {type: string, enum: [array, object], description: Required for JSON; omitted for rows and CSV.}
        types:
          type: array
          minItems: 1
          maxItems: 14
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ODCSStructuralKind'
        physical:
          type: object
          maxProperties: 16384
          additionalProperties:
            type: object
            additionalProperties: false
            required: [logical_type, kind]
            properties:
              logical_type: {type: string, minLength: 1, maxLength: 4096}
              kind:
                $ref: '#/components/schemas/ODCSStructuralKind'
              bits: {type: integer, minimum: 0, maximum: 128}
              precision: {type: integer, minimum: 0, maximum: 1000}
              scale: {type: integer, minimum: 0, maximum: 1000}
    ODCSStructuralKind:
      type: string
      enum: [object, array, map, vector, string, boolean, integer, decimal, number, date, local_time, local_datetime, instant]

    PipelineProjectionInspection:
      type: object
      required: [input, contract_slug, revision_slug, schema_object_id, digest, resolved_digest, mapping_id, representation, root_shape]
      properties:
        input: {type: integer}
        contract_slug: {type: string}
        revision_slug: {type: string}
        schema_object_id: {type: string}
        digest: {type: string}
        resolved_digest: {type: string}
        mapping_id: {type: string}
        representation: {type: string}
        root_shape: {type: string}
    PipelineCompiledPlan:
      type: object
      description: Exact portable compiled identity. Contains no authored bodies, operation bodies, secret values or template values.
      required: [digest, spec_hash, pipeline_slug, status, admission_enabled, pins, operations]
      properties:
        digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        spec_hash: {type: string}
        pipeline_slug: {$ref: '#/components/schemas/Slug'}
        status: {type: string, enum: [available, unsupported]}
        admission_enabled: {type: boolean}
        source_commit: {type: string}
        source_path: {type: string}
        compiler_id: {type: string}
        structural_policy_id: {type: string}
        pins:
          type: array
          items: {$ref: '#/components/schemas/PipelineContractPinInspection'}
        projections:
          type: array
          description: Safe retained projection selectors. Resolution values, declarations and physical mapping contents are omitted.
          items: {$ref: '#/components/schemas/PipelineProjectionInspection'}
        operations:
          type: array
          items: {$ref: '#/components/schemas/PipelineOperationInspection'}

    PipelineVersionRef:
      type: object
      description: Persisted immutable version metadata for a pipeline.
      properties:
        spec_hash:
          type: string
          description: Immutable hash of the persisted pipeline version.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
        short_spec_hash:
          type: string
          description: Short display prefix derived from spec_hash. The full spec_hash remains the canonical identifier.
          example: 6d7b6f5f6c8
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        git_commit_sha:
          type: string
          nullable: true
          description: Source git commit for Git-authored pipeline versions when available.
          example: "f4a1920c8e6b66e9a07a3f1a4ec67631a7de91ef"
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - spec_hash
        - short_spec_hash
        - pipeline_slug
        - created_at

    PipelineVersion:
      allOf:
        - $ref: '#/components/schemas/PipelineVersionRef'
        - type: object
          properties:
            composition_admission_enabled:
              type: boolean
              description: Contract composition is supported, independently of this immutable authored snapshot.
            spec:
              $ref: '#/components/schemas/PipelineSpec'
          required:
            - spec
            - composition_admission_enabled

    PipelineVersionListResponse:
      type: object
      description: List of persisted versions for a pipeline.
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PipelineVersionRef'
      required:
        - versions

    DeploymentResolutionInput:
      type: object
      description: Explicit non-secret string input for a declared ODCS template parameter. Values never come from process environment or credential storage.
      additionalProperties: false
      properties:
        value:
          type: string
          maxLength: 4000
        revision:
          type: string
          minLength: 1
          maxLength: 255
      required:
        - value
        - revision

    PipelineDeploymentRequest:
      type: object
      description: Request to deploy an existing immutable pipeline version to one environment.
      additionalProperties: false
      allOf:
        - not:
            required: [resolution_digest, resolution_inputs]
        - not:
            required: [resolution_digest, compiled_plan_digest]
      properties:
        spec_hash:
          type: string
          minLength: 1
          description: Full immutable pipeline version hash, or a unique short hash prefix.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
        expected_current_spec_hash:
          type: string
          nullable: true
          description: Optional optimistic concurrency guard for the currently deployed version in the target environment. Accepts a full immutable version hash or unique short hash prefix.
          example: 5c6d7e8f9a0b
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: Compare-and-swap guard independent of spec hash. Zero requires no existing deployment; a positive revision must match the current deployment, including same-spec updates.
        resolution_inputs:
          type: object
          description: Values and source revisions for parameter names declared by the selected portable template. Rollback reloads its stored inputs and cannot override them.
          maxProperties: 128
          additionalProperties:
            $ref: '#/components/schemas/DeploymentResolutionInput'
        compiled_plan_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
          description: Exact stored portable compiled plan selected for a new resolution. Requires contract composition to be enabled.
        resolution_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          example: sha256:6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
          description: Exact stored resolution to revalidate and select for future work. Used for rollback; never rewinds writes, replay identity or checkpoints.
        source_environment_slug:
          $ref: '#/components/schemas/NullableSlug'
        protected_environment_confirmation:
          $ref: '#/components/schemas/NullableSlug'
        proof_receipt_slug:
          $ref: '#/components/schemas/NullableSlug'
      required:
        - spec_hash

    PipelineOperationalCapabilities:
      type: object
      description: Supported operational capabilities and producer selectors.
      additionalProperties: false
      properties:
        successful_run_recency:
          type: boolean
          description: Whether this server supports successful-run recency, independent of each target's opt-in expectation.
        notification_types:
          type: array
          items:
            $ref: '#/components/schemas/NotificationType'
      required: [successful_run_recency, notification_types]

    SuccessfulRunRecencyUpdate:
      type: object
      description: Whole-second window, optimistic concurrency revision and enabled state.
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775806
        maximum_age_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036
        enabled:
          type: boolean
      required: [expected_revision, maximum_age_seconds, enabled]

    SuccessfulRunRecencyEpisode:
      type: object
      description: Immutable recorded episode. Resolution can retire an expectation without proving recovery; only qualifying_success identifies recovery.
      additionalProperties: false
      properties:
        notification_slug:
          $ref: '#/components/schemas/Slug'
        expectation_revision:
          type: integer
          format: int64
        maximum_age_seconds:
          type: integer
          format: int64
        enabled_at:
          $ref: '#/components/schemas/Timestamp'
        deployment_revision:
          type: integer
          format: int64
        version_spec_hash:
          type: string
        resolution_digest:
          type: string
          nullable: true
        deployed_at:
          $ref: '#/components/schemas/Timestamp'
        deadline_at:
          $ref: '#/components/schemas/Timestamp'
        breached_at:
          $ref: '#/components/schemas/Timestamp'
        last_success_run_slug:
          type: string
          nullable: true
        last_success_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        resolved_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        resolution_reason:
          type: string
          nullable: true
        recovery_run_slug:
          type: string
          nullable: true
        recovery_succeeded_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
      required: [notification_slug, expectation_revision, maximum_age_seconds, enabled_at, deployment_revision, version_spec_hash, resolution_digest, deployed_at, deadline_at, breached_at, last_success_run_slug, last_success_at, resolved_at, resolution_reason, recovery_run_slug, recovery_succeeded_at]

    SuccessfulRunRecency:
      type: object
      description: State calculated at evaluated_at from retained exact-deployment success evidence; this read does not create notifications.
      additionalProperties: false
      properties:
        capability_enabled:
          type: boolean
          description: Server support for successful-run recency, separate from the expectation's enabled state.
        configured:
          type: boolean
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
        maximum_age_seconds:
          type: integer
          format: int64
          nullable: true
        enabled_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        deployment_revision:
          type: integer
          format: int64
          nullable: true
        version_spec_hash:
          type: string
          nullable: true
        resolution_digest:
          type: string
          nullable: true
        deployed_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        success_run_slug:
          type: string
          nullable: true
        succeeded_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        deadline_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        evaluated_at:
          $ref: '#/components/schemas/Timestamp'
        outcome:
          type: string
          enum: [grace, healthy, breached, unavailable]
        unavailable_reason:
          type: string
          nullable: true
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/SuccessfulRunRecencyEpisode'
        has_more_episodes:
          type: boolean
      required: [capability_enabled, configured, enabled, revision, maximum_age_seconds, enabled_at, deployment_revision, version_spec_hash, resolution_digest, deployed_at, success_run_slug, succeeded_at, deadline_at, evaluated_at, outcome, unavailable_reason, episodes, has_more_episodes]

    PipelineDeployment:
      type: object
      description: Current deployed pipeline version for one project environment.
      properties:
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        project_slug:
          $ref: '#/components/schemas/Slug'
        environment_slug:
          $ref: '#/components/schemas/Slug'
        revision:
          type: integer
          format: int64
          description: Monotonically increasing deployment revision, including same-spec changes.
        current_resolution_digest:
          type: string
          nullable: true
          description: Exact immutable target resolution; absent for historical flat deployments.
        previous_resolution_digest:
          type: string
          nullable: true
          description: Prior target resolution, retained for explicit revalidation and rollback.
        current_version_spec_hash:
          type: string
          description: Immutable pipeline version hash currently deployed to the environment.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
        current_version_short_spec_hash:
          type: string
          description: Short display prefix derived from current_version_spec_hash.
          example: 6d7b6f5f6c8d
        previous_version_spec_hash:
          type: string
          nullable: true
          description: Immutable pipeline version hash that was deployed before the latest deployment update.
          example: 5c6d7e8f9a0b1c2d3e4f
        previous_version_short_spec_hash:
          type: string
          nullable: true
          description: Short display prefix derived from previous_version_spec_hash.
          example: 5c6d7e8f9a0b
        deployed_by_actor_type:
          $ref: '#/components/schemas/EventActorType'
        deployed_by_actor_slug:
          $ref: '#/components/schemas/NullableSlug'
        deployed_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        data_source_ref_sync:
          $ref: '#/components/schemas/PipelineDataSourceRefSyncResult'
        proof_link:
          allOf:
            - $ref: '#/components/schemas/ProofLifecycleLink'
          nullable: true
      required:
        - pipeline_slug
        - project_slug
        - environment_slug
        - revision
        - current_resolution_digest
        - previous_resolution_digest
        - current_version_spec_hash
        - current_version_short_spec_hash
        - deployed_by_actor_type
        - deployed_at
        - updated_at
        - data_source_ref_sync
        - proof_link

    PipelineDeploymentListResponse:
      type: object
      description: List of pipeline deployments by environment.
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/PipelineDeployment'
      required:
        - deployments

    PipelineTriggerType:
      type: string
      description: Persisted trigger family.
      enum: [schedule, webhook, completion]
      x-enum-varnames:
        - PipelineTriggerTypeSchedule
        - PipelineTriggerTypeWebhook
        - PipelineTriggerTypeCompletion
      example: schedule

    PipelineTriggerVersionPolicyMode:
      type: string
      description: Version selector used by a pipeline trigger.
      enum: [latest_deployed, pinned]
      x-enum-varnames:
        - PipelineTriggerVersionPolicyModeLatestDeployed
        - PipelineTriggerVersionPolicyModePinned
      example: latest_deployed

    PipelineTriggerLatestDeployedVersionPolicyWithPinnedHash:
      type: object
      description: Validation-only shape rejected because latest_deployed triggers must not include pinned_version_hash.
      properties:
        mode:
          type: string
          enum: [latest_deployed]
          x-enum-varnames:
            - PipelineTriggerLatestDeployedVersionPolicyWithPinnedHashModeLatestDeployed
      required:
        - mode
        - pinned_version_hash

    PipelineTriggerPinnedVersionPolicyWithoutHash:
      type: object
      description: Validation-only shape rejected because pinned triggers must include pinned_version_hash.
      properties:
        mode:
          type: string
          enum: [pinned]
          x-enum-varnames:
            - PipelineTriggerPinnedVersionPolicyWithoutHashModePinned
      required:
        - mode
      not:
        required:
          - pinned_version_hash

    PipelineTriggerVersionPolicy:
      type: object
      description: Selects which immutable pipeline version a trigger should run.
      additionalProperties: false
      not:
        anyOf:
          - $ref: '#/components/schemas/PipelineTriggerLatestDeployedVersionPolicyWithPinnedHash'
          - $ref: '#/components/schemas/PipelineTriggerPinnedVersionPolicyWithoutHash'
      properties:
        mode:
          $ref: '#/components/schemas/PipelineTriggerVersionPolicyMode'
        pinned_version_hash:
          type: string
          minLength: 1
          description: Full immutable pipeline version hash, or a unique short hash prefix, when mode is pinned. Omit for latest_deployed. The persisted trigger stores the resolved full hash.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
      required:
        - mode

    PipelineTriggerResolvedLatestDeployedVersionPolicyWithPinnedHash:
      type: object
      description: Validation-only shape rejected because resolved latest_deployed trigger responses must not include pinned_version_hash.
      properties:
        mode:
          type: string
          enum: [latest_deployed]
          x-enum-varnames:
            - PipelineTriggerResolvedLatestDeployedVersionPolicyWithPinnedHashModeLatestDeployed
      required:
        - mode
        - pinned_version_hash

    PipelineTriggerResolvedPinnedVersionPolicyWithoutHash:
      type: object
      description: Validation-only shape rejected because resolved pinned trigger responses must include pinned_version_hash.
      properties:
        mode:
          type: string
          enum: [pinned]
          x-enum-varnames:
            - PipelineTriggerResolvedPinnedVersionPolicyWithoutHashModePinned
      required:
        - mode
      not:
        required:
          - pinned_version_hash

    PipelineTriggerResolvedVersionPolicy:
      type: object
      description: Resolved version policy returned by trigger read APIs. Pinned policies always return the full immutable pipeline version hash.
      additionalProperties: false
      not:
        anyOf:
          - $ref: '#/components/schemas/PipelineTriggerResolvedLatestDeployedVersionPolicyWithPinnedHash'
          - $ref: '#/components/schemas/PipelineTriggerResolvedPinnedVersionPolicyWithoutHash'
      properties:
        mode:
          $ref: '#/components/schemas/PipelineTriggerVersionPolicyMode'
        pinned_version_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Full immutable pipeline version hash when mode is pinned. Omitted for latest_deployed.
          example: 6d7b6f5f6c8d9b77f7a4a6c8d8b9f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8
      required:
        - mode

    PipelineTriggerBackoffStrategy:
      type: string
      description: Retry delay strategy for a pipeline trigger.
      enum: [none, fixed, exponential]
      x-enum-varnames:
        - PipelineTriggerBackoffStrategyNone
        - PipelineTriggerBackoffStrategyFixed
        - PipelineTriggerBackoffStrategyExponential
      example: exponential

    PipelineTriggerRetryFailureKind:
      type: string
      description: Safe run failure category that can be retried by a trigger.
      enum: [data_source, platform]
      x-enum-varnames:
        - PipelineTriggerRetryFailureKindDataSource
        - PipelineTriggerRetryFailureKindPlatform
      example: data_source

    PipelineTriggerRetryAttemptStatus:
      type: string
      description: Durable retry decision or execution state for a trigger-backed run retry.
      enum: [queued, skipped, exhausted, running, succeeded, failed]
      x-enum-varnames:
        - PipelineTriggerRetryAttemptStatusQueued
        - PipelineTriggerRetryAttemptStatusSkipped
        - PipelineTriggerRetryAttemptStatusExhausted
        - PipelineTriggerRetryAttemptStatusRunning
        - PipelineTriggerRetryAttemptStatusSucceeded
        - PipelineTriggerRetryAttemptStatusFailed
      example: queued

    PipelineTriggerRetryPolicy:
      type: object
      description: Persisted retry policy used by durable trigger retry orchestration.
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Whether trigger retry orchestration is enabled.
          example: true
        max_attempts:
          type: integer
          minimum: 1
          maximum: 10
          description: Maximum attempts in a retry group, including the initial run.
          example: 3
        backoff_strategy:
          $ref: '#/components/schemas/PipelineTriggerBackoffStrategy'
        initial_delay_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Delay before the first retry attempt. Fixed backoff reuses this delay for each retry; exponential backoff starts here and grows up to max_delay_seconds.
          example: 60
        max_delay_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          description: Upper bound for retry delays when backoff is fixed or exponential. For backoff_strategy=none, both delay fields must be 0.
          example: 3600
        retryable_failure_kinds:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PipelineTriggerRetryFailureKind'
        max_elapsed_seconds:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2592000
          description: Optional upper bound on elapsed retry time.
          example: 86400
      required:
        - enabled
        - max_attempts
        - backoff_strategy
        - initial_delay_seconds
        - max_delay_seconds
        - retryable_failure_kinds

    PipelineTriggerScheduleMisfirePolicy:
      type: string
      description: Policy for handling missed scheduled fire times, such as fires that become due while the scheduler is stopped, delayed, or backlogged.
      enum: [skip, fire_once]
      x-enum-varnames:
        - PipelineTriggerScheduleMisfirePolicySkip
        - PipelineTriggerScheduleMisfirePolicyFireOnce
      example: fire_once

    PipelineRunScheduleMisfireResult:
      type: string
      description: Executed scheduled-run misfire result exposed in run history. Skipped scheduled fires are persisted as schedule-fire diagnostics without creating a pipeline run.
      enum: [on_time, fire_once]
      x-enum-varnames:
        - PipelineRunScheduleMisfireResultOnTime
        - PipelineRunScheduleMisfireResultFireOnce
      example: on_time

    PipelineScheduleFireStatus:
      type: string
      description: Durable execution state for a persisted schedule fire diagnostic.
      enum: [claimed, running, succeeded, failed, skipped]
      x-enum-varnames:
        - PipelineScheduleFireStatusClaimed
        - PipelineScheduleFireStatusRunning
        - PipelineScheduleFireStatusSucceeded
        - PipelineScheduleFireStatusFailed
        - PipelineScheduleFireStatusSkipped
      example: succeeded

    PipelineScheduleFireMisfireResult:
      type: string
      description: Misfire handling result for one persisted scheduled fire, including skipped fires that did not create a run.
      enum: [on_time, skipped, fire_once]
      x-enum-varnames:
        - PipelineScheduleFireMisfireResultOnTime
        - PipelineScheduleFireMisfireResultSkipped
        - PipelineScheduleFireMisfireResultFireOnce
      example: on_time

    PipelineCompletionCondition:
      type: string
      description: Authoritative logical-root outcome after automatic retries.
      enum: [success, final_failure]
      x-enum-varnames:
        - PipelineCompletionConditionSuccess
        - PipelineCompletionConditionFinalFailure

    PipelineTriggerCompletionConfig:
      type: object
      description: Same-project and same-environment upstream dependency. No payload is transferred. Each revision carries a revocable execution grant issued by the authorizing actor; false revokes pending execution authority.
      additionalProperties: false
      properties:
        upstream_pipeline_slug:
          $ref: '#/components/schemas/Slug'
        condition:
          $ref: '#/components/schemas/PipelineCompletionCondition'
        execution_grant_enabled:
          type: boolean
      required: [upstream_pipeline_slug, condition, execution_grant_enabled]

    PipelineTriggerCompletionWithoutCompletionConfig:
      type: object
      description: Validation-only shape rejected because completion triggers require completion config.
      properties:
        type:
          type: string
          enum: [completion]
      required: [type]
      not:
        required: [completion]

    PipelineTriggerCompletionWithOtherConfig:
      type: object
      description: Validation-only shape rejected because completion triggers cannot include schedule or webhook config.
      properties:
        type:
          type: string
          enum: [completion]
      required: [type]
      anyOf:
        - required: [schedule]
        - required: [webhook]

    PipelineTriggerOtherWithCompletionConfig:
      type: object
      description: Validation-only shape rejected because schedule and webhook triggers cannot include completion config.
      properties:
        type:
          type: string
          enum: [schedule, webhook]
      required: [type, completion]

    PipelineTriggerScheduleConfig:
      type: object
      description: Schedule trigger configuration.
      additionalProperties: false
      properties:
        cron:
          type: string
          minLength: 1
          maxLength: 255
          description: Five-field cron expression evaluated in timezone.
          example: "*/15 * * * *"
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone used for schedule evaluation.
          example: Europe/Warsaw
        misfire_policy:
          $ref: '#/components/schemas/PipelineTriggerScheduleMisfirePolicy'
      required:
        - cron
        - timezone
        - misfire_policy

    PipelineTriggerScheduleWithoutScheduleConfig:
      type: object
      description: Validation-only shape rejected because schedule triggers must include schedule config.
      properties:
        type:
          type: string
          enum: [schedule]
          x-enum-varnames:
            - PipelineTriggerScheduleWithoutScheduleConfigTypeSchedule
      required:
        - type
      not:
        required:
          - schedule

    PipelineTriggerWebhookWithoutWebhookConfig:
      type: object
      description: Validation-only shape rejected because webhook triggers must include webhook config.
      properties:
        type:
          type: string
          enum: [webhook]
          x-enum-varnames:
            - PipelineTriggerWebhookWithoutWebhookConfigTypeWebhook
      required:
        - type
      not:
        required:
          - webhook

    PipelineTriggerScheduleWithWebhookConfig:
      type: object
      description: Validation-only shape rejected because schedule triggers cannot include webhook config.
      properties:
        type:
          type: string
          enum: [schedule]
        webhook:
          type: object
      required: [type, webhook]

    PipelineTriggerWebhookWithScheduleConfig:
      type: object
      description: Validation-only shape rejected because webhook triggers cannot include schedule config.
      properties:
        type:
          type: string
          enum: [webhook]
        schedule:
          type: object
      required: [type, schedule]

    PipelineWebhookInputMapping:
      type: object
      description: Maps one JSON Pointer in a verified webhook body to one declared runtime input.
      additionalProperties: false
      properties:
        json_pointer:
          type: string
          maxLength: 500
          pattern: '^(|/.*)$'
        runtime_input_key:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          maxLength: 100
      required: [json_pointer, runtime_input_key]

    PipelineWebhookConfigInput:
      type: object
      description: Generic webhook configuration. Receiver identity and verification keys are product-issued.
      additionalProperties: false
      properties:
        input_mappings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PipelineWebhookInputMapping'
      required: [input_mappings]

    PipelineWebhookVerificationStrategy:
      type: string
      enum: [hmac_sha256]
      x-enum-varnames:
        - PipelineWebhookVerificationStrategyHmacSha256

    PipelineWebhookConfig:
      type: object
      description: Safe generic webhook configuration without verification secret values.
      additionalProperties: false
      properties:
        receiver_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{32,128}$'
        verification_strategy:
          $ref: '#/components/schemas/PipelineWebhookVerificationStrategy'
        input_mappings:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PipelineWebhookInputMapping'
        enabled_key_versions:
          type: array
          items:
            type: integer
            minimum: 1
        secret_configured:
          type: boolean
      required: [receiver_id, verification_strategy, input_mappings, enabled_key_versions, secret_configured]

    PipelineWebhookSecretIssuance:
      type: object
      description: Webhook verification key material returned once on issuance.
      additionalProperties: false
      properties:
        key_version:
          type: integer
          minimum: 1
        value:
          type: string
          minLength: 43
          maxLength: 128
      required: [key_version, value]

    NewPipelineTrigger:
      type: object
      description: Request to create an environment-scoped schedule, webhook or completion trigger definition.
      additionalProperties: false
      not:
        anyOf:
          - $ref: '#/components/schemas/PipelineTriggerScheduleWithoutScheduleConfig'
          - $ref: '#/components/schemas/PipelineTriggerWebhookWithoutWebhookConfig'
          - $ref: '#/components/schemas/PipelineTriggerCompletionWithoutCompletionConfig'
          - $ref: '#/components/schemas/PipelineTriggerCompletionWithOtherConfig'
          - $ref: '#/components/schemas/PipelineTriggerOtherWithCompletionConfig'
          - $ref: '#/components/schemas/PipelineTriggerScheduleWithWebhookConfig'
          - $ref: '#/components/schemas/PipelineTriggerWebhookWithScheduleConfig'
      properties:
        completion:
          $ref: '#/components/schemas/PipelineTriggerCompletionConfig'
        name:
          $ref: '#/components/schemas/Name'
        slug:
          description: Optional slug (auto-generated from name if not provided)
          allOf:
            - $ref: '#/components/schemas/Slug'
        type:
          $ref: '#/components/schemas/PipelineTriggerType'
        enabled:
          type: boolean
          description: Whether the trigger can submit future runs. Enabling requires a valid target version policy.
          example: true
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        version_policy:
          $ref: '#/components/schemas/PipelineTriggerVersionPolicy'
        runtime_input_keys:
          type: array
          uniqueItems: true
          description: Safe per-run input keys this trigger may provide. Runtime input values are never persisted on the trigger.
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
            maxLength: 100
          example: [tenant_id, dry_run]
        retry_policy:
          $ref: '#/components/schemas/PipelineTriggerRetryPolicy'
        schedule:
          $ref: '#/components/schemas/PipelineTriggerScheduleConfig'
        webhook:
          $ref: '#/components/schemas/PipelineWebhookConfigInput'
      required:
        - name
        - type
        - enabled
        - pipeline_slug
        - version_policy
        - runtime_input_keys
        - retry_policy

    UpdatePipelineTrigger:
      type: object
      description: Request to fully replace mutable fields for an environment-scoped pipeline trigger definition.
      additionalProperties: false
      not:
        anyOf:
          - $ref: '#/components/schemas/PipelineTriggerScheduleWithoutScheduleConfig'
          - $ref: '#/components/schemas/PipelineTriggerWebhookWithoutWebhookConfig'
          - $ref: '#/components/schemas/PipelineTriggerCompletionWithoutCompletionConfig'
          - $ref: '#/components/schemas/PipelineTriggerCompletionWithOtherConfig'
          - $ref: '#/components/schemas/PipelineTriggerOtherWithCompletionConfig'
          - $ref: '#/components/schemas/PipelineTriggerScheduleWithWebhookConfig'
          - $ref: '#/components/schemas/PipelineTriggerWebhookWithScheduleConfig'
      properties:
        completion:
          $ref: '#/components/schemas/PipelineTriggerCompletionConfig'
        name:
          $ref: '#/components/schemas/Name'
        type:
          $ref: '#/components/schemas/PipelineTriggerType'
        enabled:
          type: boolean
          description: Whether the trigger can submit future runs. Enabling requires a valid target version policy.
          example: true
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        version_policy:
          $ref: '#/components/schemas/PipelineTriggerVersionPolicy'
        runtime_input_keys:
          type: array
          uniqueItems: true
          description: Safe per-run input keys this trigger may provide. Runtime input values are never persisted on the trigger.
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
            maxLength: 100
          example: [tenant_id, dry_run]
        retry_policy:
          $ref: '#/components/schemas/PipelineTriggerRetryPolicy'
        schedule:
          $ref: '#/components/schemas/PipelineTriggerScheduleConfig'
        webhook:
          $ref: '#/components/schemas/PipelineWebhookConfigInput'
      required:
        - name
        - type
        - enabled
        - pipeline_slug
        - version_policy
        - runtime_input_keys
        - retry_policy

    PipelineTrigger:
      type: object
      description: Environment-scoped pipeline trigger definition. Runtime input and webhook secret values are omitted from read APIs.
      additionalProperties: false
      not:
        anyOf:
          - $ref: '#/components/schemas/PipelineTriggerScheduleWithoutScheduleConfig'
          - $ref: '#/components/schemas/PipelineTriggerWebhookWithoutWebhookConfig'
          - $ref: '#/components/schemas/PipelineTriggerCompletionWithoutCompletionConfig'
          - $ref: '#/components/schemas/PipelineTriggerCompletionWithOtherConfig'
          - $ref: '#/components/schemas/PipelineTriggerOtherWithCompletionConfig'
      properties:
        completion:
          $ref: '#/components/schemas/PipelineTriggerCompletionConfig'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        type:
          $ref: '#/components/schemas/PipelineTriggerType'
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Monotonically increasing trigger definition revision.
          example: 3
        environment_slug:
          $ref: '#/components/schemas/Slug'
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        version_policy:
          $ref: '#/components/schemas/PipelineTriggerResolvedVersionPolicy'
        runtime_input_keys:
          type: array
          items:
            type: string
          description: Sorted runtime input keys this trigger may provide. Values are never persisted here.
        retry_policy:
          $ref: '#/components/schemas/PipelineTriggerRetryPolicy'
        schedule:
          $ref: '#/components/schemas/PipelineTriggerScheduleConfig'
        webhook:
          $ref: '#/components/schemas/PipelineWebhookConfig'
        created_by_actor_type:
          $ref: '#/components/schemas/EventActorType'
        created_by_actor_slug:
          $ref: '#/components/schemas/NullableSlug'
        updated_by_actor_type:
          $ref: '#/components/schemas/EventActorType'
        updated_by_actor_slug:
          $ref: '#/components/schemas/NullableSlug'
        disabled_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - name
        - type
        - enabled
        - revision
        - environment_slug
        - pipeline_slug
        - version_policy
        - runtime_input_keys
        - retry_policy
        - created_by_actor_type
        - updated_by_actor_type
        - disabled_at
        - created_at
        - updated_at

    PipelineTriggerIssuanceResponse:
      type: object
      description: Newly created trigger plus optional one-time webhook secret issuance.
      additionalProperties: false
      properties:
        pipeline_trigger:
          $ref: '#/components/schemas/PipelineTrigger'
        webhook_secret:
          $ref: '#/components/schemas/PipelineWebhookSecretIssuance'
      required: [pipeline_trigger]

    PipelineTriggerListResponse:
      type: object
      description: Paginated list of environment-scoped pipeline trigger definitions.
      properties:
        pipeline_triggers:
          type: array
          items:
            $ref: '#/components/schemas/PipelineTrigger'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the next page
        prev_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the previous page
      required:
        - pipeline_triggers
        - has_more

    PipelineScheduleFire:
      type: object
      description: Operator-safe diagnostic record for one persisted schedule fire.
      additionalProperties: false
      properties:
        fire_slug:
          $ref: '#/components/schemas/Slug'
        trigger_slug:
          $ref: '#/components/schemas/Slug'
        trigger_revision:
          type: integer
          format: int64
          minimum: 1
          description: Trigger definition revision that produced this fire.
          example: 3
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        scheduled_fire_at:
          $ref: '#/components/schemas/Timestamp'
        actual_fire_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          $ref: '#/components/schemas/PipelineScheduleFireStatus'
        misfire_result:
          $ref: '#/components/schemas/PipelineScheduleFireMisfireResult'
        run_slug:
          $ref: '#/components/schemas/NullableSlug'
        source_event_slug:
          $ref: '#/components/schemas/NullableSlug'
        error_summary:
          type: string
          nullable: true
          maxLength: 1000
          description: Safe error summary captured for failed scheduled fires.
          example: Pipeline version was unavailable at dispatch time.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - fire_slug
        - trigger_slug
        - trigger_revision
        - pipeline_slug
        - scheduled_fire_at
        - actual_fire_at
        - status
        - misfire_result
        - run_slug
        - source_event_slug
        - error_summary
        - created_at
        - updated_at

    PipelineScheduleFireListResponse:
      type: object
      description: Paginated list of schedule-fire diagnostics for one pipeline trigger.
      properties:
        schedule_fires:
          type: array
          items:
            $ref: '#/components/schemas/PipelineScheduleFire'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the next page
        prev_cursor:
          type: string
          nullable: true
          description: Cursor for fetching the previous page
      required:
        - schedule_fires
        - has_more

    PipelineWebhookDeliveryStatus:
      type: string
      description: Safe durable delivery execution state.
      enum: [queued, running, succeeded, failed, rejected]
      x-enum-varnames:
        - PipelineWebhookDeliveryStatusQueued
        - PipelineWebhookDeliveryStatusRunning
        - PipelineWebhookDeliveryStatusSucceeded
        - PipelineWebhookDeliveryStatusFailed
        - PipelineWebhookDeliveryStatusRejected

    PipelineWebhookDelivery:
      type: object
      description: Operator-safe generic pipeline webhook delivery diagnostic. Request bodies, mapped values, headers, signatures, credentials, and encrypted envelopes are never returned.
      additionalProperties: false
      properties:
        receiver_id:
          type: string
          minLength: 1
          maxLength: 128
        delivery_id:
          type: string
          minLength: 1
          maxLength: 128
        payload_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        payload_size_bytes:
          type: integer
          format: int64
          minimum: 0
        trigger_slug:
          $ref: '#/components/schemas/Slug'
        trigger_revision:
          type: integer
          format: int64
          minimum: 1
        pipeline_slug:
          $ref: '#/components/schemas/Slug'
        status:
          $ref: '#/components/schemas/PipelineWebhookDeliveryStatus'
        mapped_input_names:
          type: array
          description: Input names supplied by mapping; values are never exposed.
          items:
            type: string
        linked_run_slug:
          $ref: '#/components/schemas/NullableSlug'
        attempt_number:
          type: integer
          minimum: 1
          maximum: 10
        duplicate_count:
          type: integer
          minimum: 0
        failure_kind:
          type: string
          nullable: true
          enum: [data_source, platform]
        failure_reason:
          type: string
          nullable: true
          maxLength: 100
          description: Sanitized machine-readable failure reason.
        next_retry_at:
          $ref: '#/components/schemas/NullableTimestamp'
        received_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        completed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_duplicate_at:
          $ref: '#/components/schemas/NullableTimestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        replay_available:
          type: boolean
        replay_unavailable_reason:
          type: string
          nullable: true
          maxLength: 100
      required:
        - receiver_id
        - delivery_id
        - payload_digest
        - payload_size_bytes
        - trigger_slug
        - trigger_revision
        - pipeline_slug
        - status
        - mapped_input_names
        - linked_run_slug
        - attempt_number
        - duplicate_count
        - failure_kind
        - failure_reason
        - next_retry_at
        - received_at
        - started_at
        - completed_at
        - last_duplicate_at
        - updated_at
        - replay_available
        - replay_unavailable_reason

    PipelineWebhookDeliveryListResponse:
      type: object
      description: Paginated operator-safe webhook delivery diagnostics for one trigger.
      properties:
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/PipelineWebhookDelivery'
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        prev_cursor:
          type: string
          nullable: true
      required: [deliveries, has_more]

    PipelineSpec:
      type: object
      description: >
        Canonical pipeline spec persisted in pipeline storage. Executable pipelines
        require one weakly connected data-flow graph; multiple sources and sinks
        are allowed. Draft save and formatting preserve incomplete/disconnected
        work without executable validation.
      properties:
        metadata:
          description: Stable pipeline identity used by runtime and storage indexing.
          allOf:
            - $ref: '#/components/schemas/PipelineMetadata'
        steps:
          type: array
          description: Ordered executable steps. A sink step is optional for query-only pipelines; runtime validation requires at least one sink when any transform step exists.
          minItems: 1
          items:
            $ref: '#/components/schemas/PipelineStep'
      required:
        - metadata
        - steps

    PipelineSpecFormatRequest:
      type: object
      description: Request to format serialized pipeline spec data without runtime validation.
      properties:
        format:
          type: string
          description: Serialization format for the request data and response data.
          enum: [json, yaml]
          x-enum-varnames: [PipelineSpecFormatRequestFormatJson, PipelineSpecFormatRequestFormatYaml]
          example: yaml
        data:
          type: string
          description: Serialized pipeline spec in the declared format.
      required:
        - format
        - data

    PipelineSpecFormatDiagnostic:
      type: object
      description: Non-fatal formatter diagnostic produced when spec-local structure affects canonical ordering.
      properties:
        code:
          type: string
          description: Stable formatter diagnostic code.
          enum: [unresolved_step_reference]
          example: unresolved_step_reference
        message:
          type: string
          description: Safe diagnostic message for editor, builder, preview, and CLI callers.
          example: step reference could not be resolved while formatting the pipeline spec
        step_slug:
          type: string
          description: Raw step slug text that produced the diagnostic. This may be malformed in draft specs.
          example: fetch_users
        referenced_step_slug:
          type: string
          description: Raw unresolved step reference text. This may be malformed in draft specs.
          example: fetch_users
      required:
        - code
        - message
        - step_slug
        - referenced_step_slug

    PipelineSpecFormatResponse:
      type: object
      description: Formatted pipeline spec data and non-fatal formatter diagnostics.
      properties:
        format:
          type: string
          description: Serialization format of the formatted data.
          enum: [json, yaml]
          x-enum-varnames:
            - PipelineSpecFormatResponseFormatJson
            - PipelineSpecFormatResponseFormatYaml
          example: yaml
        data:
          type: string
          description: Formatted pipeline spec serialized in the declared format.
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/PipelineSpecFormatDiagnostic'
      required:
        - format
        - data
        - diagnostics

    PipelineSpecUpdate:
      type: object
      description: Pipeline spec payload used for updates.
      properties:
        metadata:
          description: Mutable metadata fields for update operations.
          allOf:
            - $ref: '#/components/schemas/PipelineMetadataUpdate'
        steps:
          type: array
          description: Ordered executable steps. A sink step is optional for query-only pipelines; runtime validation requires at least one sink when any transform step exists.
          minItems: 1
          items:
            $ref: '#/components/schemas/PipelineStep'
      required:
        - metadata
        - steps

    PipelineMetadata:
      type: object
      description: Human and machine identifiers for the pipeline.
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
      required:
        - slug
        - name

    PipelineMetadataUpdate:
      type: object
      description: Mutable pipeline metadata for update operations.
      properties:
        name:
          $ref: '#/components/schemas/Name'
      required:
        - name

    PipelineSchemaContractValidationLiteral:
      description: Literal value used by contract field enum validations.
      oneOf:
        - type: string
        - type: integer
          format: int64
        - type: number
          format: double
          not:
            type: integer
        - type: boolean
      example: active

    PipelineSchemaContractValidationBound:
      description: Numeric or RFC3339 datetime bound used by min/max validations.
      oneOf:
        - type: integer
          format: int64
        - type: number
          format: double
          not:
            type: integer
        - type: string
          format: date-time
      example: "2026-01-01T00:00:00Z"

    PipelineSchemaContractFieldValidations:
      type: object
      description: Optional field-level contract validations enforced as contract failures.
      additionalProperties: false
      properties:
        format:
          type: string
          description: Known string format constraint.
          enum: [email, uuid, url]
          x-enum-varnames:
            - PipelineSchemaContractFieldValidationsFormatEmail
            - PipelineSchemaContractFieldValidationsFormatUuid
            - PipelineSchemaContractFieldValidationsFormatUrl
          example: email
        enum:
          type: array
          minItems: 1
          description: Accepted literal values for string, number, integer, or boolean fields.
          items:
            $ref: '#/components/schemas/PipelineSchemaContractValidationLiteral'
          example: [active, paused]
        min:
          $ref: '#/components/schemas/PipelineSchemaContractValidationBound'
        max:
          $ref: '#/components/schemas/PipelineSchemaContractValidationBound'
        min_length:
          type: integer
          minimum: 0
          description: Minimum string or array length.
          example: 1
        max_length:
          type: integer
          minimum: 0
          description: Maximum string or array length.
          example: 255
        unique:
          type: boolean
          description: Requires field values to be unique within row-like payloads when runtime data is available.
          example: true

    PipelineSchemaContractField:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          example: email
        type:
          type: string
          description: Logical field type used by pipeline contracts.
          enum: [string, number, integer, decimal, boolean, object, array, datetime]
          example: string
        precision:
          type: integer
          minimum: 1
          maximum: 38
          description: Required for decimal fields; maximum coefficient digits at the declared scale.
        scale:
          type: integer
          minimum: 0
          maximum: 38
          description: Required for decimal fields; fractional digits, at most precision. Decimal contract validation rejects inexact values; SQL casts quantize half-even explicitly.
        required:
          type: boolean
          example: true
        nullable:
          type: boolean
          example: false
        description:
          type: string
          example: User email address
        validations:
          $ref: '#/components/schemas/PipelineSchemaContractFieldValidations'
      required:
        - name
        - type
        - required

    FilePayloadMetadata:
      type: object
      description: Safe metadata for native file/blob payloads. Raw bytes are never included in API responses, run metadata, or diagnostics.
      properties:
        filename:
          type: string
          description: Best-effort file name without path context, when supplied by the source.
          example: users.pdf
        mime_type:
          type: string
          description: Normalized media type for the file payload.
          example: application/pdf
        size_bytes:
          type: integer
          format: int64
          description: Exact file payload size in bytes.
          example: 2048
        digest_algorithm:
          type: string
          description: Digest algorithm used for the digest value.
          example: sha256
        digest:
          type: string
          description: Hex-encoded digest of the file payload bytes.
          example: 9b74c9897bac770ffc029102a200c5de
      required:
        - mime_type
        - size_bytes
        - digest_algorithm
        - digest

    PipelineSchemaContract:
      type: object
      description: Optional structural contract for runtime validation and diagnostics.
      properties:
        name:
          type: string
          description: Optional source-level contract label; an empty value represents an unnamed contract.
          example: users_rows
        representation:
          type: string
          description: Output payload representation expected at this boundary.
          enum: [rows, json, csv, file, multipart_form]
          x-enum-varnames:
            - PipelineSchemaContractRepresentationRows
            - PipelineSchemaContractRepresentationJson
            - PipelineSchemaContractRepresentationCsv
            - PipelineSchemaContractRepresentationFile
            - PipelineSchemaContractRepresentationMultipartForm
          example: rows
        root_shape:
          type: string
          description: Expected root container shape for JSON payloads.
          enum: [array, object]
          example: array
        fields:
          type: array
          minItems: 1
          description: Field-level schema. Required by rows, json, and csv contracts; omitted for file contracts because validation uses file metadata.
          items:
            $ref: '#/components/schemas/PipelineSchemaContractField'
      required:
        - name

    PipelineODCSContractRef:
      type: object
      description: Exact project-owned ODCS schema object pinned to one immutable revision. Resolution occurs on the server.
      additionalProperties: false
      required: [contract_slug, revision_slug, schema_object_id]
      properties:
        contract_slug:
          $ref: '#/components/schemas/Slug'
        revision_slug:
          allOf:
            - $ref: '#/components/schemas/Slug'
            - not:
                enum: [latest]
        schema_object_id:
          type: string
          minLength: 1
        representation:
          type: string
          enum: [rows, json, csv, file, multipart_form]
        root_shape:
          type: string
          enum: [array, object]

    PipelineIncrementalSourceContract:
      type: object
      description: Optional source-step checkpoint contract for incremental execution. Only query steps can own source checkpoints; absence of this object means a full source read.
      properties:
        checkpoint_kind:
          type: string
          description: Checkpoint value shape used by the connector operation.
          enum: [watermark, cursor]
          x-enum-varnames:
            - PipelineIncrementalSourceContractCheckpointKindWatermark
            - PipelineIncrementalSourceContractCheckpointKindCursor
          example: watermark
        field:
          type: string
          description: Source field used for watermark comparisons.
          example: updated_at
        cursor:
          type: string
          description: Connector-native cursor token name for cursor checkpoint operations.
          example: next_page_token
        lookback_window:
          type: string
          description: Optional positive duration overlap for watermark reads to tolerate late-arriving records.
          example: 15m
        ordering:
          type: array
          description: Stable ordering fields used when the watermark field alone is not unique.
          items:
            type: string
          example: [updated_at, id]
        dedupe_key:
          type: string
          description: Optional record identity used by downstream transforms or sinks to tolerate overlap.
          example: id

    PipelineInputSpecWithNonJSONOutputContract:
      type: object
      description: Validation-only shape rejected because pipeline event input supports only JSON output contracts.
      properties:
        output_contract:
          type: object
          properties:
            representation:
              type: string
              not:
                enum: [json]
          required:
            - representation
      required:
        - output_contract

    PipelineInputSpec:
      type: object
      additionalProperties: false
      description: Declares the one run-scoped JSON payload accepted by this pipeline.
      not:
        anyOf:
          - $ref: '#/components/schemas/PipelineInputSpecWithNonJSONOutputContract'
      properties:
        output_contract:
          $ref: '#/components/schemas/PipelineSchemaContract'
        output_contract_ref:
          description: Exact ODCS reference with JSON representation and an explicit object or array root_shape.
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
            - type: object
              required: [representation, root_shape]
              properties:
                representation:
                  type: string
                  enum: [json]
      oneOf:
        - required: [output_contract]
        - required: [output_contract_ref]

    PipelineInputContractAttachment:
      type: object
      additionalProperties: false
      description: Independent requirement for one named transform input. Property names belong to the dataset, without SQL relation prefixes.
      oneOf:
        - required: [contract]
        - required: [contract_ref]
      properties:
        contract:
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
            - type: object
              properties:
                representation:
                  type: string
                  enum: [rows, json, csv]
        contract_ref:
          allOf:
            - $ref: '#/components/schemas/PipelineODCSContractRef'
            - type: object
              properties:
                representation:
                  type: string
                  enum: [rows, json, csv]

    PipelineQueryRef:
      type: object
      allOf:
        - not:
            required: [output_contract, output_contract_ref]
      description: Defines the data source operation to execute in a query step. Supports saved queries (operation_ref), inline definitions (operation_inline), and all connector types.
      properties:
        data_source_ref:
          description: Pipeline-scoped logical data-source reference resolved through environment bindings.
          allOf:
            - $ref: '#/components/schemas/Slug'
        operation_type:
          type: string
          description: Operation type identifier. Must match the connector type of the referenced data source.
          enum: [sql, bigquery, google_workspace, snowflake, http, hubspot, ftp, mongodb, git, s3]
          example: sql
        operation_ref:
          $ref: '#/components/schemas/Slug'
        operation_inline:
          type: object
          description: Optional inline operation definition.
          additionalProperties: true
        output_contract:
          $ref: '#/components/schemas/PipelineSchemaContract'
        output_contract_ref:
          $ref: '#/components/schemas/PipelineODCSContractRef'
        parameters:
          type: object
          description: Query parameter map. Values may be literals or runtime step references.
          additionalProperties: true
        incremental:
          $ref: '#/components/schemas/PipelineIncrementalSourceContract'
      required:
        - data_source_ref
        - operation_type

    PipelineTransformSpec:
      type: object
      allOf:
        - not:
            required: [input_contracts, input_contract]
        - not:
            required: [input_contracts, input_contract_ref]
        - not:
            required: [input_contract, input_contract_ref]
        - not:
            required: [output_contract, output_contract_ref]
      description: SQL transform definition executed against upstream step output.
      properties:
        sql:
          type: string
          description: >-
            SQL SELECT statement for transform execution. Bounded normalization supports
            searched CASE, COALESCE, NULLIF, one-argument TRIM, LOWER, UPPER, explicit
            DECIMAL casts, and STR_TO_DATE/DATE_FORMAT with literal %Y-%m-%d or
            %d.%m.%Y calendar-date formats. Calendar dates are ISO date strings without
            a timezone; timestamp parsing is not supported. Unsupported functions and
            date formats reject before execution.
          minLength: 1
          example: SELECT id, email FROM input_rows
        output_kind:
          type: string
          description: CSV uses projection-order columns, comma delimiters, a header even for empty results, UTF-8 and LF. Use ORDER BY on projected fields for deterministic row order.
          enum: [rows, json, csv]
          x-enum-varnames:
            - PipelineTransformSpecOutputKindRows
            - PipelineTransformSpecOutputKindJson
            - PipelineTransformSpecOutputKindCsv
          example: rows
        inputs:
          type: object
          description: Named upstream step outputs available to transform SQL as virtual input relations. Map keys must be valid unquoted SQL relation identifiers and values are input, query, or transform step slugs.
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/Slug'
          example:
            orders: fetch-orders
            accounts: fetch-accounts
        input_contracts:
          type: object
          minProperties: 1
          description: Requirements keyed by existing `inputs` names. Mutually exclusive with the combined input contract/reference, including single-input transforms.
          additionalProperties:
            $ref: '#/components/schemas/PipelineInputContractAttachment'
        input_contract:
          description: Optional expected schema of the transform input payload.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        input_contract_ref:
          $ref: '#/components/schemas/PipelineODCSContractRef'
        output_contract:
          description: Optional schema assertion applied to transform output.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        output_contract_ref:
          $ref: '#/components/schemas/PipelineODCSContractRef'
      required:
        - sql
        - output_kind
        - inputs

    RecoverPipelineRunRequest:
      type: object
      additionalProperties: false
      properties:
        protected_environment_confirmation:
          $ref: '#/components/schemas/NullableSlug'

    PipelineSinkSpec:
      type: object
      allOf:
        - not:
            required: [input_contract, input_contract_ref]
      description: Optional delivery definition for terminal pipeline output.
      properties:
        input:
          description: Slug of an input, query, or transform step consumed by this sink.
          allOf:
            - $ref: '#/components/schemas/Slug'
        input_contract:
          description: Optional expected schema of sink input payload.
          allOf:
            - $ref: '#/components/schemas/PipelineSchemaContract'
        input_contract_ref:
          $ref: '#/components/schemas/PipelineODCSContractRef'
        data_source_ref:
          description: Pipeline-scoped logical data-source reference resolved through environment bindings.
          allOf:
            - $ref: '#/components/schemas/Slug'
        operation_type:
          type: string
          description: Operation type identifier for sink delivery. Must match the connector type of the referenced data source and determines delivery routing.
          enum: [sql, bigquery, google_workspace, snowflake, http, hubspot, ftp, mongodb, git, s3]
          example: sql
        operation_ref:
          $ref: '#/components/schemas/Slug'
        operation_inline:
          type: object
          description: Optional inline operation definition.
          additionalProperties: true
        config:
          type: object
          description: Backend-specific sink options. FTP and Git file sinks accept path, format, delimiter, has_header, overwrite, sheet, and range. S3 sinks accept key, bucket, format, delimiter, has_header, overwrite, sheet, range, content_type, and metadata.
          additionalProperties: true
        empty_input_policy:
          type: string
          description: Explicit policy for zero-row input. skip records a no-op without dispatch; reject fails before dispatch. Omission retains connector behavior (SQL skips empty rows). Does not override input-contract validation.
          enum: [skip, reject]
        idempotency_class:
          type: string
          description: Required replay strategy for the sink operation. See doc/PIPELINE_DATA_MODEL.md#idempotency-and-replay-safety for the canonical class definitions, provider evidence requirements, and retry decisions. naturally_idempotent repeats the same deterministic external effect; idempotent_with_key passes a stable provider key; deduplicated_by_ledger blocks re-delivery after an uncertain durable attempt; unsafe is never retried automatically after an attempt begins.
          enum: [naturally_idempotent, idempotent_with_key, deduplicated_by_ledger, unsafe]
          example: idempotent_with_key
      required:
        - input
        - data_source_ref
        - operation_type
        - idempotency_class

    PipelineStepKind:
      type: string
      enum: [input, query, transform, sink]
      example: query

    PipelineStepBase:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/PipelineStepKind'
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
      required:
        - kind
        - slug

    PipelineInputStep:
      allOf:
        - $ref: '#/components/schemas/PipelineStepBase'
        - type: object
          properties:
            kind:
              type: string
              enum: [input]
              example: input
            input:
              $ref: '#/components/schemas/PipelineInputSpec'
          required:
            - kind
            - input

    PipelineQueryStep:
      allOf:
        - $ref: '#/components/schemas/PipelineStepBase'
        - type: object
          properties:
            kind:
              type: string
              enum: [query]
              example: query
            query:
              $ref: '#/components/schemas/PipelineQueryRef'
          required:
            - kind
            - query

    PipelineTransformStep:
      allOf:
        - $ref: '#/components/schemas/PipelineStepBase'
        - type: object
          properties:
            kind:
              type: string
              enum: [transform]
              example: transform
            transform:
              $ref: '#/components/schemas/PipelineTransformSpec'
          required:
            - kind
            - transform

    PipelineSinkStep:
      allOf:
        - $ref: '#/components/schemas/PipelineStepBase'
        - type: object
          properties:
            kind:
              type: string
              enum: [sink]
              x-enum-varnames:
                - PipelineSinkStepKindSink
              example: sink
            sink:
              $ref: '#/components/schemas/PipelineSinkSpec'
          required:
            - kind
            - sink

    PipelineStep:
      oneOf:
        - $ref: '#/components/schemas/PipelineInputStep'
        - $ref: '#/components/schemas/PipelineQueryStep'
        - $ref: '#/components/schemas/PipelineTransformStep'
        - $ref: '#/components/schemas/PipelineSinkStep'
      discriminator:
        propertyName: kind
        mapping:
          input: '#/components/schemas/PipelineInputStep'
          query: '#/components/schemas/PipelineQueryStep'
          transform: '#/components/schemas/PipelineTransformStep'
          sink: '#/components/schemas/PipelineSinkStep'

    PipelineRunMode:
      type: string
      description: Operator-facing pipeline run execution mode.
      enum: [full, incremental, backfill]
      example: incremental

    PipelineRunCheckpointStatus:
      type: string
      description: Run-level checkpoint promotion status.
      enum: [not_applicable, committed, blocked, unchanged, skipped]
      example: committed

    PipelineRunReplaySafetyStatus:
      type: string
      description: Whether automatic replay is considered safe for this run.
      enum: [safe, blocked]
      example: safe

    PipelineRunIncrementalSummary:
      type: object
      description: Sanitized run-level incremental execution summary.
      properties:
        mode:
          $ref: '#/components/schemas/PipelineRunMode'
        checkpoint_status:
          $ref: '#/components/schemas/PipelineRunCheckpointStatus'
        source_step_slug:
          type: string
          example: fetch-users
        blocked_reason:
          type: string
          example: sink write failed
        replay_safety_status:
          $ref: '#/components/schemas/PipelineRunReplaySafetyStatus'
        replay_blocked_reason:
          type: string
          example: sink write failed
        backfill_series_slug:
          type: string
          example: users-backfill-202605
        backfill_chunk_index:
          type: integer
          example: 1
        backfill_chunk_count:
          type: integer
          example: 10
      required:
        - mode
        - checkpoint_status
        - source_step_slug
        - blocked_reason
        - replay_safety_status
        - replay_blocked_reason
        - backfill_series_slug
        - backfill_chunk_index
        - backfill_chunk_count

    PipelineRunCheckpointSummary:
      type: object
      description: Compact sanitized checkpoint display value. Raw checkpoint bodies are not exposed.
      properties:
        summary:
          type: string
          example: up to 2026-05-24T11:00:00Z
        display_metadata:
          type: object
          additionalProperties: true
        raw_value_exposed:
          type: boolean
          example: false
      required:
        - summary
        - raw_value_exposed

    PipelineRunSourceWindowSummary:
      type: object
      description: Compact sanitized effective source read window.
      properties:
        summary:
          type: string
          example: 2026-05-01 to 2026-05-02
        lower_bound:
          type: string
          example: 2026-05-01
        upper_bound:
          type: string
          example: 2026-05-02
        display_metadata:
          type: object
          additionalProperties: true
        raw_value_exposed:
          type: boolean
          example: false
      required:
        - summary
        - raw_value_exposed

    PipelineRunCheckpointCommitResult:
      type: object
      description: Checkpoint commit outcome for one incremental source.
      properties:
        status:
          $ref: '#/components/schemas/PipelineRunCheckpointStatus'
        blocked_by_step:
          type: string
          example: persist-users
        blocked_reason:
          type: string
          example: sink write failed
      required:
        - status
        - blocked_by_step
        - blocked_reason

    PipelineRunIncrementalSourceDiagnostic:
      type: object
      description: Sanitized per-source incremental execution diagnostics.
      properties:
        source_step_slug:
          type: string
          example: fetch-users
        checkpoint_kind:
          type: string
          example: watermark
        previous_checkpoint:
          $ref: '#/components/schemas/PipelineRunCheckpointSummary'
        window:
          $ref: '#/components/schemas/PipelineRunSourceWindowSummary'

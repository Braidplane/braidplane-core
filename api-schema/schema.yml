    get:
      summary: Complete managed GitHub App installation
      tags: [organizations]
      operationId: completeOrganizationGitHubAppInstall
      security:
        - SessionAuth: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 32, maxLength: 256 }
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: installation_id
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
        - name: error
          in: query
          description: Terminal authorization request failure. Code and installation_id are required when error is absent for installation and repository setup flows. Existing-installation authorization callbacks omit installation_id. A rejected repository setup records a safe failure without exchanging credentials or creating provider resources.
          schema:
            type: string
            enum: [access_denied, application_suspended, redirect_uri_mismatch]
      responses:
        '200':
          description: Verified installation binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubAppConnection'
        '400':
          description: Invalid or expired installation state
          headers:
            Location:
              description: Relative project recovery URL only after an authorized repository setup failure was recorded.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:

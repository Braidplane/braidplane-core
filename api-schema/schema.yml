        last_sent_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_at:
          $ref: '#/components/schemas/NullableTimestamp'
        declined_at:
          $ref: '#/components/schemas/NullableTimestamp'
        revoked_at:
          $ref: '#/components/schemas/NullableTimestamp'
        expired_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

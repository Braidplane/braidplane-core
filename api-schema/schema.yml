    PipelineWebhookDeliveryIDParam:
      name: delivery_id
      in: path
      description: Sender-provided delivery identity covered by the verified signature.
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'

    ProjectSlugParam:
      name: project_slug
      in: path
      description: Slug of the project
      required: true

      properties:
        resource:
          type: string
          description: Resource type (e.g., members, organizations)
          example: "members"
        action:
          type: string
          description: Action on the resource. Organization export is a separate grant from read access.
          enum: [create, delete, restore, purge, read, update, execute, "*"]
          example: "read"
      required:
        - resource
        - action

    NewOrgRole:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          $ref: '#/components/schemas/Slug'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
        - name
        - permissions

    UpdateOrgRole:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
      required:
        - name
        - permissions

    OrgRole:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        is_default:
          type: boolean
          description: Whether this role is a system default role
          example: false
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        deleted_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - name
        - is_default
        - permissions
        - deleted_at
        - created_at
        - updated_at

    OrgRoleList:
      type: array
      items:
        $ref: '#/components/schemas/OrgRole'

    NewAPIKey:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
          maxLength: 1000
          example: "Used by the nightly workflow sync"
        role:
          $ref: '#/components/schemas/MemberRole'
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        can_manage_api_keys:
          type: boolean
          default: false
          description: Whether this key may manage organization API keys when its role also grants the requested api_keys action. Only a session-authenticated authorized user may enable this capability.
      required:
        - name
        - role

    UpdateAPIKey:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
          maxLength: 1000
          example: "Used by the nightly workflow sync"
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        can_manage_api_keys:
          type: boolean
          description: Enables or disables API key management. Bearer API keys cannot change this field.
      required:
        - name

    APIKey:
      type: object
      properties:
        slug:
          $ref: '#/components/schemas/Slug'
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
          example: "Used by the nightly workflow sync"
        token_prefix:
          type: string
          description: Safe token prefix for identifying the key without exposing the secret.
          example: "xto_12345678"
        role:
          $ref: '#/components/schemas/MemberRole'
        can_manage_api_keys:
          type: boolean
          description: Whether this key may manage organization API keys when its role grants the requested action.
        created_by_user_slug:
          $ref: '#/components/schemas/NullableSlug'
        expires_at:
          $ref: '#/components/schemas/NullableTimestamp'
        revoked_at:
          $ref: '#/components/schemas/NullableTimestamp'
        last_used_at:
          $ref: '#/components/schemas/NullableTimestamp'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - slug
        - name
        - token_prefix
        - role
        - can_manage_api_keys
        - expires_at
        - revoked_at
        - last_used_at
        - created_at
        - updated_at

    APIKeyWithToken:

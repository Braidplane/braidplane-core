              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a logical data source ref
      description: Fully replaces mutable metadata for a pipeline-scoped logical data source reference.
      tags:
        - data-sources
      operationId: updateDataSourceRef
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/PipelineSlugParam'
        - $ref: '#/components/parameters/DataSourceRefSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDataSourceRef'
      responses:
        '200':
          description: Data source ref updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceRef'
        '400':
          description: Update would make existing environment bindings incompatible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization, project, pipeline, or data source ref not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a logical data source ref
      description: Deletes a pipeline-scoped logical data source reference and its environment bindings.
      tags:
        - data-sources
      operationId: deleteDataSourceRef
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/PipelineSlugParam'
        - $ref: '#/components/parameters/DataSourceRefSlugParam'
      responses:
        '204':
          description: Data source ref deleted
        '400':
          description: Invalid delete request or protected environment binding prevents cascade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization, project, pipeline, or data source ref not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/projects/{project_slug}/environments/{environment_slug}/data-source-bindings:
    get:
      summary: List data source bindings
      description: Lists data source bindings for one enabled project environment.
      tags:
        - data-sources
      operationId: listDataSourceBindings
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: List of environment data source bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceBindingListResponse'
        '404':
          description: Organization, project, or environment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/projects/{project_slug}/pipelines/{pipeline_slug}/environments/{environment_slug}/data-source-bindings/{data_source_ref_slug}:
    get:
      summary: Get a data source binding
      description: Returns the concrete data source bound to one pipeline-scoped logical ref in one project environment.
      tags:
        - data-sources
      operationId: getDataSourceBinding
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/PipelineSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
        - $ref: '#/components/parameters/DataSourceRefSlugParam'
      responses:
        '200':
          description: Environment data source binding details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceBinding'
        '404':
          description: Organization, project, pipeline, environment, ref, or binding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Upsert a data source binding
      description: Binds one pipeline-scoped logical data source ref to one organization-owned concrete data source in a project environment.
      tags:
        - data-sources
      operationId: upsertDataSourceBinding
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/PipelineSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
        - $ref: '#/components/parameters/DataSourceRefSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDataSourceBinding'
      responses:
        '200':
          description: Environment data source binding upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSourceBinding'
        '400':
          description: Concrete data source is incompatible with the logical ref contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization, project, pipeline, environment, ref, or concrete data source not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Concrete data source is inactive or otherwise unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a data source binding
      description: Removes the concrete data source binding for one pipeline-scoped logical ref in one project environment.
      tags:
        - data-sources
      operationId: deleteDataSourceBinding
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/ProjectSlugParam'
        - $ref: '#/components/parameters/PipelineSlugParam'
        - $ref: '#/components/parameters/EnvironmentSlugParam'
        - $ref: '#/components/parameters/DataSourceRefSlugParam'
        - $ref: '#/components/parameters/ProtectedEnvironmentConfirmationParam'
      responses:
        '204':
          description: Environment data source binding deleted
        '400':
          description: Invalid delete request or protected environment confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Organization, project, pipeline, environment, ref, or binding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/members:
    post:
      summary: Add an existing user directly to an organization
      description: Directly adds an existing user by slug. Membership additions are disabled for synthetic qualification organizations. Use the member invitation endpoints to invite teammates by email.
      tags:
        - members
      operationId: createMember
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMember'
            example:
              user_slug: "johndoe"
              role: "viewer"
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                user_slug: "johndoe"
                email: "john.doe@example.com"
                role: "viewer"
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        '409':
          description: User is already a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List organization members
      description: Lists active organization members. Pending invitations are listed separately through the member invitation endpoints.
      tags:
        - members
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/MembersFieldParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'
              example:
                members:
                  - user_slug: "johndoe"
                    email: "john.doe@example.com"
                    role: "admin"
                    created_at: "2025-10-04T10:30:00Z"
                    updated_at: "2025-10-04T10:30:00Z"
                has_more: false
                next_cursor: null
                prev_cursor: null

  /organizations/{slug}/member-invitations:
    post:
      summary: Invite a member to an organization
      description: Creates a pending organization member invitation by email address. Invitations are disabled for synthetic qualification organizations. The returned invitation does not include the raw acceptance token.
      tags:
        - members
      operationId: createMemberInvitation
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMemberInvitation'
            example:
              email: "jane.doe@example.com"
              role: "viewer"
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '409':
          description: Email is already a member or already has a pending invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List organization member invitations
      description: Lists pending and historical member invitations for the organization. Pending invitations are separate from active members.
      tags:
        - members
      operationId: listMemberInvitations
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/MemberInvitationsFieldParam'
        - $ref: '#/components/parameters/MemberInvitationStatusParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
      responses:
        '200':
          description: List of member invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitationListResponse'

  /organizations/{slug}/member-invitations/{invitation_slug}:
    get:
      summary: Get a member invitation
      description: Returns one organization member invitation without exposing its raw acceptance token.
      tags:
        - members
      operationId: getMemberInvitation
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/InvitationSlugParam'
      responses:
        '200':
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/member-invitations/{invitation_slug}/resend:
    post:
      summary: Resend a member invitation
      description: Rotates the invitation acceptance token and queues another invitation email. Old links must not grant membership. Invitations cannot be resent from synthetic qualification organizations.
      tags:
        - members
      operationId: resendMemberInvitation
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/InvitationSlugParam'
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/member-invitations/{invitation_slug}/revoke:
    post:
      summary: Revoke a member invitation
      description: Revokes a pending invitation so its acceptance link can no longer grant membership.
      tags:
        - members
      operationId: revokeMemberInvitation
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/InvitationSlugParam'
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '404':
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /member-invitations:
    get:
      summary: List my pending member invitations
      description: Lists pending invitations addressed to the authenticated user's verified email address.
      tags:
        - members
      operationId: listMyMemberInvitations
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/MemberInvitationsFieldParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
      responses:
        '200':
          description: List of pending invitations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitationListResponse'

  /member-invitations/{slug}/{invitation_slug}/accept:
    post:
      summary: Accept one of my pending member invitations
      description: Accepts a pending invitation from the authenticated user's invitation list without exposing invitation token material.
      tags:
        - members
      operationId: acceptMyMemberInvitation
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/InvitationSlugParam'
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitationAcceptance'
        '404':
          description: Invitation not found or no longer pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /member-invitations/{slug}/{invitation_slug}/decline:
    post:
      summary: Decline one of my pending member invitations
      description: Declines a pending invitation from the authenticated user's invitation list without exposing invitation token material.
      tags:
        - members
      operationId: declineMyMemberInvitation
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/InvitationSlugParam'
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '404':
          description: Invitation not found or no longer pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /member-invitations/accept:
    post:
      summary: Accept a member invitation
      description: Accepts a pending invitation after the authenticated user has proved control of the invited email address. Pending invitations are unique per organization/email; one verified email can accept multiple pending invitations across organizations, and each accepted membership uses the role captured on that invitation.
      tags:
        - members
      operationId: acceptMemberInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvitationAcceptanceTokenRequest'
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitationAcceptance'
        '404':
          description: Invitation not found or no longer pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /member-invitations/decline:
    post:
      summary: Decline a member invitation
      description: Declines a pending invitation addressed to the authenticated user's verified email address without creating organization membership.
      tags:
        - members
      operationId: declineMemberInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberInvitationTokenRequest'
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberInvitation'
        '404':
          description: Invitation not found or no longer pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/members/{user_slug}:
    put:
      summary: Update a member
      description: Updates a member's role in the organization. Full replacement.
      tags:
        - members
      operationId: updateMember
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/UserSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMember'
            example:
              role: "admin"
      responses:
        '204':
          description: Member updated
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Remove a member
      description: Removes a user from the organization.
      tags:
        - members
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/UserSlugParam'
      responses:
        '204':
          description: Member removed
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/roles:
    post:
      summary: Create a role
      description: Creates a new role in the organization.
      tags:
        - roles
      operationId: createRole
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrgRole'
            example:
              name: "Editor"
              slug: "editor"
              permissions:
                - resource: "members"
                  action: "read"
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgRole'
              example:
                slug: "editor"
                name: "Editor"
                is_default: false
                permissions:
                  - resource: "members"
                    action: "read"
                deleted_at: null
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        '409':
          description: Role already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List roles
      description: Lists active roles in the organization. Archived roles are excluded unless requested for recovery.
      tags:
        - roles
      operationId: listRoles
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/RolesFieldParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
        - name: include_deleted
          in: query
          description: Include archived roles in the result set. Requires role restore permission.
          required: false
          schema:
            type: boolean
            default: false
        - name: only_deleted
          in: query
          description: Return only archived roles. Implies include_deleted and requires role restore permission.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListResponse'
              example:
                roles:
                  - slug: "admin"
                    name: "Admin"
                    is_default: true
                    permissions:
                      - resource: "*"
                        action: "*"
                    deleted_at: null
                    created_at: "2025-10-04T10:30:00Z"
                    updated_at: "2025-10-04T10:30:00Z"
                  - slug: "viewer"
                    name: "Viewer"
                    is_default: true
                    permissions:
                      - resource: "members"
                        action: "read"
                    deleted_at: null
                    created_at: "2025-10-04T10:30:00Z"
                    updated_at: "2025-10-04T10:30:00Z"
                has_more: false
                next_cursor: null
                prev_cursor: null

  /organizations/{slug}/roles/{role_slug}:
    get:
      summary: Get a role
      description: Returns the role identified by its slug.
      tags:
        - roles
      operationId: getRole
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/RoleSlugParam'
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgRole'
              example:
                slug: "editor"
                name: "Editor"
                is_default: false
                permissions:
                  - resource: "members"
                    action: "read"
                deleted_at: null
                created_at: "2025-10-04T10:30:00Z"
                updated_at: "2025-10-04T10:30:00Z"
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a role
      description: Updates a role's name and permissions. Full replacement of mutable fields.
      tags:
        - roles
      operationId: updateRole
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/RoleSlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgRole'
            example:
              name: "Senior Editor"
              permissions:
                - resource: "members"
                  action: "read"
                - resource: "members"
                  action: "update"
      responses:
        '204':
          description: Role updated
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Archive a role
      description: Archives a custom role from the organization. Normal role list, get, update, assignment, and authorization paths treat archived roles as unavailable until restored.
      tags:
        - roles
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/RoleSlugParam'
      responses:
        '204':
          description: Role archived
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/roles/{role_slug}/restore:
    post:
      summary: Restore a role
      description: Restores an archived custom role so it can be assigned and used for organization-scoped authorization again.
      tags:
        - roles
      operationId: restoreRole
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/RoleSlugParam'
      responses:
        '204':
          description: Role restored
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/api-keys:
    post:
      summary: Create an API key
      description: Creates an organization-scoped API key and returns the raw token once. A management-enabled API key must also have api_keys:create permission and may assign only its own role. Bearer-created keys always have management disabled.
      tags:
        - api-keys
      operationId: createAPIKey
      parameters:
        - $ref: '#/components/parameters/SlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAPIKey'
            example:
              name: "Workflow automation"
              role: "viewer"
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyWithToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot manage API keys, attempted to delegate management capability, or selected a role exceeding its delegation boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List API keys
      description: Lists API keys for an organization. An API key principal must have management enabled and api_keys:read permission, and receives only keys with its own role. Raw tokens and token hashes are never returned.
      tags:
        - api-keys
      operationId: listAPIKeys
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
        - $ref: '#/components/parameters/APIKeysFieldParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/PageDirectionParam'
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot list API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/api-keys/{api_key_slug}:
    get:
      summary: Get an API key
      description: Returns safe API key metadata. A management-enabled API key may read only keys with its own role. Raw tokens and token hashes are never returned.
      tags:
        - api-keys
      operationId: getAPIKey
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/APIKeySlugParam'
      responses:
        '200':
          description: API key details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot read this API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update an API key
      description: Updates API key metadata. The API key role is immutable; revoke and recreate a key to change privileges. A management-enabled API key may update only keys with its own role and may not enable or disable management capability.
      tags:
        - api-keys
      operationId: updateAPIKey
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/APIKeySlugParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAPIKey'
            example:
              name: "Workflow automation"
      responses:
        '200':
          description: API key updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot update this API key or attempted to change management capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Revoke an API key
      description: Revokes the API key so its bearer token can no longer authenticate. A management-enabled API key may revoke only keys with its own role.
      tags:
        - api-keys
      operationId: deleteAPIKey
      parameters:
        - $ref: '#/components/parameters/SlugParam'
        - $ref: '#/components/parameters/APIKeySlugParam'
      responses:
        '204':
          description: API key revoked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The authenticated principal cannot revoke this API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: API key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organizations/{slug}/api-keys/{api_key_slug}/delete:
    post:
      summary: Delete a revoked API key
      description: Permanently deletes revoked API key metadata for an organization. This remains session-only. Active API keys must be revoked before deletion. Raw tokens and token hashes are never returned.

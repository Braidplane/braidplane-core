metadata:
  slug: ${PIPELINE_SLUG}
  name: E2E Git Source DB Sink
steps:
  - kind: query
    slug: fetch-git-users
    query:
      data_source_ref: ${GIT_DATA_SOURCE_SLUG}
      operation_type: git
      operation_ref: ${GIT_QUERY_SLUG}
      output_contract:
        representation: rows
        fields:
          - name: id
            type: string
            required: true
          - name: email
            type: string
            required: true
  - kind: transform
    slug: select-git-user
    transform:
      inputs:
        input: fetch-git-users
      sql: "SELECT CAST(id AS SIGNED) AS account_id, email FROM input WHERE email = 'bob@example.com'"
      output_kind: rows
      output_contract:
        representation: rows
        fields:
          - name: account_id
            type: integer
            required: true
          - name: email
            type: string
            required: true
  - kind: sink
    slug: persist-git-user
    sink:
      idempotency_class: deduplicated_by_ledger
      input: select-git-user
      input_contract:
        representation: rows
        fields:
          - name: account_id
            type: integer
            required: true
          - name: email
            type: string
            required: true
      data_source_ref: ${PG_DATA_SOURCE_SLUG}
      operation_type: sql
      operation_ref: ${SINK_QUERY_SLUG}
      config:
        org_slug: ${ORG_SLUG}

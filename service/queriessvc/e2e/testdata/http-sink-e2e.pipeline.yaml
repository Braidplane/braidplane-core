metadata:
  slug: ${PIPELINE_SLUG}
  name: E2E HTTP Sink
steps:
  - kind: query
    slug: fetch-users
    query:
      data_source_ref: ${SOURCE_DATA_SOURCE_SLUG}
      operation_type: sql
      operation_ref: ${SOURCE_QUERY_SLUG}
      output_contract:
        representation: rows
        fields:
          - name: id
            type: integer
            required: true
  - kind: transform
    slug: project-users
    transform:
      inputs:
        input: fetch-users
      sql: "SELECT id FROM input"
      output_kind: rows
      output_contract:
        name: project-users-output
        representation: rows
        fields:
          - name: id
            type: integer
            required: true
  - kind: sink
    slug: deliver-users
    sink:
      idempotency_class: idempotent_with_key
      input: project-users
      input_contract:
        name: deliver-users-input
        representation: rows
        fields:
          - name: id
            type: integer
            required: true
      data_source_ref: ${SINK_DATA_SOURCE_SLUG}
      operation_type: http
      operation_ref: ${SINK_QUERY_SLUG}
      config:
        mode: bulk
